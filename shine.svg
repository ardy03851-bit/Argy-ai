<svg xmlns="http://www.w3.org/2000/svg" width="720" height="96" viewBox="0 0 720 96" role="img" aria-label="Local mind">
  <title>Local mind</title>

  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000000"/>
      <stop offset="40%"  stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <mask id="sweepMask">
      <rect x="-280" y="0" width="280" height="96" fill="url(#fade)">
        <animate attributeName="x" values="-280;720" dur="3.5s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <!-- base wordmark -->
  <text x="360" y="52" text-anchor="middle" dominant-baseline="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700" letter-spacing="1"
        fill="#8b949e">Local mind</text>

  <!-- bright band sweeping across the wordmark -->
  <g mask="url(#sweepMask)">
    <text x="360" y="52" text-anchor="middle" dominant-baseline="middle"
          font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="44" font-weight="700" letter-spacing="1"
          fill="#ffffff">Local mind</text>
  </g>
</svg>
