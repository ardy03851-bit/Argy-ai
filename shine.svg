<svg xmlns="http://www.w3.org/2000/svg" width="720" height="96" viewBox="0 0 720 96" role="img" aria-label="Project Name">
  <title>Local mind</title>
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0%"   stop-color="#8b949e"/>
      <stop offset="45%"  stop-color="#8b949e"/>
      <stop offset="50%"  stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#8b949e"/>
      <stop offset="100%" stop-color="#8b949e"/>
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        values="-1 0; 1 0"
        dur="6s"
        repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <text x="360" y="52"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700" letter-spacing="1"
        fill="url(#shine)">Local mind</text>
</svg>
