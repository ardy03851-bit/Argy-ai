<svg xmlns="http://www.w3.org/2000/svg" width="400" height="20" viewBox="0 0 400 20">
  <!-- Center geometric diamond -->
  <polygon points="200,5 206,10 200,15 194,10" fill="#d96b4a" />
  
  <!-- Left expanding line -->
  <line y1="10" y2="10" stroke="#d96b4a" stroke-width="1.5" opacity="0.4" x1="190" x2="190">
    <animate attributeName="x1" values="190;30;190" dur="8s" repeatCount="indefinite" />
  </line>
  
  <!-- Right expanding line -->
  <line y1="10" y2="10" stroke="#d96b4a" stroke-width="1.5" opacity="0.4" x1="210" x2="210">
    <animate attributeName="x2" values="210;370;210" dur="8s" repeatCount="indefinite" />
  </line>
</svg>
