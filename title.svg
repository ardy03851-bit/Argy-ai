<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160" role="img" aria-label="Local Mind">
  <title>Local Mind</title>

  <defs>
    <!-- Warm terracotta gradient for the shine -->
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000000"/>
      <stop offset="40%"  stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#d96b4a"/> <!-- App accent color -->
      <stop offset="70%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <mask id="sweepMask">
      <rect x="-300" y="0" width="300" height="160" fill="url(#shineGrad)">
        <animate attributeName="x" values="-300;800" dur="5s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <!-- Base text: Elegant Serif, dark grey -->
  <text x="400" y="90" text-anchor="middle" dominant-baseline="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="72" font-weight="400" letter-spacing="3"
        fill="#555555">Local Mind</text>

  <!-- Highlight text: Sweeps across with a glow -->
  <g mask="url(#sweepMask)">
    <text x="400" y="90" text-anchor="middle" dominant-baseline="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="72" font-weight="400" letter-spacing="3"
          fill="#ffffff">Local Mind</text>
  </g>
</svg>
