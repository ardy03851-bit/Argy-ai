<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <circle cx="30" cy="30" r="10" fill="#d96b4a">
    <animate attributeName="cy" values="30;24;30" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="30" cy="30" r="18" fill="#d96b4a" opacity="0.15">
    <animate attributeName="cy" values="30;24;30" dur="4s" repeatCount="indefinite" />
    <animate attributeName="r" values="18;24;18" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>
