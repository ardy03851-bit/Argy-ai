<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- Solid core -->
  <circle cx="30" cy="30" r="12" fill="#d96b4a" />
  
  <!-- Minimalist rotating outer ring for structure -->
  <circle cx="30" cy="30" r="20" fill="none" stroke="#d96b4a" stroke-width="1.5" stroke-dasharray="2 10" opacity="0.8" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 30 30" to="360 30 30" dur="12s" repeatCount="indefinite"/>
  </circle>
</svg>
