  /* ============================================================
     LIVE FREE / OPEN-WEIGHT MODEL CATALOG
     Murakumo exposes a documented no-key open-model route and live model list.
     OpenRouter's public catalog is discoverable anonymously; inference needs the user's key.
     ============================================================ */
  const FREE_MODEL_CACHE_KEY = 'localmind.openRouterCatalog.v1';
  const MURAKUMO_CACHE_KEY = 'localmind.murakumoCatalog.v1';
  const FREE_MODEL_SELECTION_KEY = 'localmind.freeModelSelection.v1';
  const OPENROUTER_KEY_KEY = 'localmind.openRouterKey.v1';
  const FREE_CATALOG_TTL_MS = 6 * 60 * 60 * 1000;
  const FREE_ROUTE_OPTIONS = [
    { key: 'murakumo:murakumo/free', provider: 'murakumo', id: 'murakumo/free', name: 'Murakumo · Free open models', meta: 'No API key · hosted open-model route', mark: 'MU', search: 'murakumo free open models no key automatic' }
  ];
  let FREE_CATALOG = [];
  let MURAKUMO_CATALOG = [];
  let FREE_CATALOG_LOADING = false;
  let MURAKUMO_CATALOG_LOADING = false;
  let FREE_CATALOG_LOADED_AT = 0;
  let MURAKUMO_CATALOG_LOADED_AT = 0;

  function safeStorageGet(key) {
    try { return localStorage.getItem(key); } catch (err) { return null; }
  }
  function safeStorageSet(key, value) {
    try {
      if (value == null || value === '') localStorage.removeItem(key);
      else localStorage.setItem(key, value);
      return true;
    } catch (err) { return false; }
  }
  function getOpenRouterKey() { return (safeStorageGet(OPENROUTER_KEY_KEY) || '').trim(); }
  function saveFreeModelSelection(model) {
    if (!model) { safeStorageSet(FREE_MODEL_SELECTION_KEY, null); return; }
    safeStorageSet(FREE_MODEL_SELECTION_KEY, JSON.stringify({ key: model.key, provider: model.provider, id: model.id }));
  }
  function setFreeStatus(message) {
    if (freeModelStatus) freeModelStatus.textContent = message;
  }
  function shortContext(value) {
    const n = Number(value);
    if (!Number.isFinite(n) || n <= 0) return '';
    if (n >= 1000000) return `${(n / 1000000).toFixed(n % 1000000 ? 1 : 0)}M context`;
    if (n >= 1000) return `${Math.round(n / 1000)}K context`;
    return `${n} context`;
  }
  function looksOpenWeight(model) {
    const identity = `${model.id || ''} ${model.name || ''} ${model.hugging_face_id || ''}`.toLowerCase();
    // Prefer explicit Hugging Face metadata, with an allowlist for common open-weight families.
    return Boolean(model.hugging_face_id) || /(llama|qwen|gemma|mistral|mixtral|deepseek|\bglm|nemotron|gpt-oss|\bphi|olmo|\byi|minimax|kimi|internlm|nous|command-r|longcat|ling|dots|\blfm|granite|falcon|starcoder|codestral|wizard|openchat|smollm|jamba|rwkv|solar|zephyr|tulu)/i.test(identity);
  }
  function normalizeOpenRouterModels(payload) {
    const rows = payload && Array.isArray(payload.data) ? payload.data : [];
    const found = [];
    const seen = new Set();
    for (const m of rows) {
      if (!m || typeof m.id !== 'string' || !m.id) continue;
      const id = m.id;
      const promptCost = Number(m.pricing && m.pricing.prompt);
      const completionCost = Number(m.pricing && m.pricing.completion);
      const explicitlyFree = id.endsWith(':free') || (Number.isFinite(promptCost) && Number.isFinite(completionCost) && promptCost === 0 && completionCost === 0);
      if (!explicitlyFree || !looksOpenWeight(m) || seen.has(id)) continue;
      // Keep this selector focused on text chat models.
      const output = m.architecture && m.architecture.output_modalities;
      if (Array.isArray(output) && !output.includes('text')) continue;
      const context = shortContext(m.context_length);
      found.push({
        key: `openrouter:${id}`, provider: 'openrouter', id,
        name: String(m.name || id),
        meta: `OpenRouter · free${context ? ` · ${context}` : ''} · key required`,
        mark: String((id.split('/').pop() || 'LLM').replace(/[^a-z0-9]/gi, '').slice(0, 3) || 'LLM').toUpperCase(),
        search: `${id} ${m.name || ''} ${m.description || ''}`.toLowerCase(),
        contextLength: m.context_length || null
      });
      seen.add(id);
    }
    found.sort((a, b) => a.name.localeCompare(b.name));
    return found;
  }
  function normalizeMurakumoModels(payload) {
    const rows = payload && Array.isArray(payload.data) ? payload.data : [];
    const found = [];
    const seen = new Set();
    for (const m of rows) {
      if (!m || typeof m.id !== 'string' || !m.id.trim()) continue;
      const id = m.id.trim();
      if (id === 'murakumo-main' || seen.has(id)) continue; // Retired selector, intentionally excluded.
      if (id !== 'murakumo/free' && !looksOpenWeight(m)) continue; // Keep hosted catalog entries focused on recognizable open-weight families.
      const output = m.architecture && m.architecture.output_modalities;
      if (Array.isArray(output) && !output.includes('text')) continue;
      const context = shortContext(m.context_length || m.context_window || m.context_length_tokens);
      const isDefaultFree = id === 'murakumo/free';
      found.push({
        key: `murakumo:${id}`, provider: 'murakumo', id,
        name: String(m.name || id),
        meta: `Murakumo · no key${context ? ` · ${context}` : ''}${isDefaultFree ? ' · recommended' : ''}`,
        mark: 'MU',
        search: `${id} ${m.name || ''} ${m.description || ''} ${m.owned_by || ''}`.toLowerCase(),
        contextLength: m.context_length || m.context_window || null
      });
      seen.add(id);
    }
    found.sort((a, b) => {
      if (a.id === 'murakumo/free') return -1;
      if (b.id === 'murakumo/free') return 1;
      return a.name.localeCompare(b.name);
    });
    return found;
  }
  function readCachedMurakumoCatalog() {
    try {
      const record = JSON.parse(safeStorageGet(MURAKUMO_CACHE_KEY) || 'null');
      return record && Array.isArray(record.models) ? record : null;
    } catch (err) { return null; }
  }
  async function loadMurakumoCatalog(force = false) {
    if (MURAKUMO_CATALOG_LOADING) return;
    if (!force && MURAKUMO_CATALOG_LOADED_AT && Date.now() - MURAKUMO_CATALOG_LOADED_AT < FREE_CATALOG_TTL_MS) return;
    const cached = readCachedMurakumoCatalog();
    if (!force && cached && cached.models.length && Date.now() - Number(cached.savedAt || 0) < FREE_CATALOG_TTL_MS) {
      MURAKUMO_CATALOG = cached.models;
      MURAKUMO_CATALOG_LOADED_AT = Number(cached.savedAt) || Date.now();
      renderFreeModelOptions();
    }
    MURAKUMO_CATALOG_LOADING = true;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    try {
      const response = await fetch('https://api.murakumo.cloud/v1/models', { method: 'GET', cache: force ? 'no-store' : 'default', signal: controller.signal, headers: { 'Accept': 'application/json' } });
      if (!response.ok) throw new Error(`Murakumo catalog returned HTTP ${response.status}`);
      const payload = await response.json();
      const models = normalizeMurakumoModels(payload);
      if (!models.length) throw new Error('Murakumo returned no text model selectors');
      MURAKUMO_CATALOG = models;
      MURAKUMO_CATALOG_LOADED_AT = Date.now();
      safeStorageSet(MURAKUMO_CACHE_KEY, JSON.stringify({ savedAt: MURAKUMO_CATALOG_LOADED_AT, models }));
      renderFreeModelOptions();
      const statusParts = [];
      statusParts.push(`${models.length} live Murakumo no-key models`);
      if (FREE_CATALOG.length) statusParts.push(`${FREE_CATALOG.length} live OpenRouter free open-weight models`);
      setFreeStatus(`${statusParts.join(' · ')}. OpenRouter models need an optional free key; Murakumo does not.`);
      // Restore a saved Murakumo selection only if the current live list still includes it.
      if (!state.freeModel) {
        try {
          const saved = JSON.parse(safeStorageGet(FREE_MODEL_SELECTION_KEY) || 'null');
          if (saved && saved.provider === 'murakumo') {
            const match = MURAKUMO_CATALOG.find(x => x.id === saved.id);
            if (match) setFreeModelChoice(match);
          }
        } catch (err) {}
      }
    } catch (err) {
      console.warn('[LocalMind] Murakumo catalog refresh failed:', err);
      const stillCached = readCachedMurakumoCatalog();
      if (!MURAKUMO_CATALOG.length && stillCached && Array.isArray(stillCached.models)) MURAKUMO_CATALOG = stillCached.models;
      renderFreeModelOptions();
      if (!MURAKUMO_CATALOG.length) setFreeStatus(`Murakumo live catalog is unavailable right now. ${FREE_CATALOG.length ? `${FREE_CATALOG.length} OpenRouter free models are available with a key` : 'The documented no-key default is still listed'}; refresh or try again later.`);
    } finally {
      clearTimeout(timeout);
      MURAKUMO_CATALOG_LOADING = false;
    }
  }

  function readCachedFreeCatalog() {
    try {
      const record = JSON.parse(safeStorageGet(FREE_MODEL_CACHE_KEY) || 'null');
      if (!record || !Array.isArray(record.models)) return null;
      return record;
    } catch (err) { return null; }
  }
  function getFreeModelIcon(model) {
    if (!model) return '';
    if (model.icon) return model.icon;
    const identity = `${model.id || ''} ${model.name || ''}`.toLowerCase();
    // Provider/family marks from Simple Icons CDN; if no official mark exists, use the UI's fallback star.
    const brandMap = [
      [/\bllama\b|meta-llama|\bmeta\b/, 'meta'], [/\bqwen\b|alibaba/, 'alibabadotcom'],
      [/\bgemma\b|\bgemini\b|google/, 'google'], [/\bmistral\b|mixtral/, 'mistralai'],
      [/deepseek/, 'deepseek'], [/\bphi\b|microsoft/, 'microsoft'], [/\bgranite\b|ibm/, 'ibm'],
      [/\bcommand-r\b|cohere/, 'cohere'], [/\bopenai\b|gpt-oss/, 'openai'],
      [/\bclaude\b|anthropic/, 'anthropic'], [/\bglm\b|zhipu/, 'zhipu'],
      [/\bmoonshot\b|\bkimi\b/, 'moonshot'], [/\bminimax\b/, 'minimax'],
      [/pollinations/, 'pollinations'], [/murakumo/, '']
    ];
    const match = brandMap.find(([re]) => re.test(identity));
    return match && match[1] ? `https://cdn.simpleicons.org/${match[1]}` : '';
  }
  function normalizePollinationsModels(payload) {
    const rows = Array.isArray(payload) ? payload : (payload && Array.isArray(payload.data) ? payload.data : []);
    const seen = new Set(); const out = [];
    for (const m of rows) {
      const id = typeof m === 'string' ? m : m && (m.id || m.name);
      if (typeof id !== 'string' || !id.trim() || seen.has(id)) continue;
      const row = typeof m === 'string' ? { id } : m;
      const price = row.pricing || row.prices || {};
      const cost = Number(price.prompt ?? row.input_price ?? row.prompt_price ?? 0) + Number(price.completion ?? row.output_price ?? row.completion_price ?? 0);
      const hasPricing = row.pricing || row.prices || row.input_price !== undefined || row.prompt_price !== undefined;
      // This is the legacy no-account endpoint. Only show entries whose catalog metadata indicates free/zero-priced,
      // or when the legacy catalog doesn't expose pricing at all.
      if (hasPricing && cost > 0) continue;
      if (row.type && !/text|chat|language/i.test(String(row.type))) continue;
      const name = String(row.name || row.description || id);
      out.push({ key: `pollinations:${id}`, provider: 'pollinations', id, name,
        meta: 'Pollinations · no sign-in · shared free service', mark: 'P',
        icon: getFreeModelIcon({ id, name }), search: `${id} ${name} ${row.description || ''} pollinations no key free`.toLowerCase(),
        contextLength: row.context_length || null });
      seen.add(id);
    }
    return out.sort((a,b)=>a.name.localeCompare(b.name));
  }
  let POLLINATIONS_CATALOG = [];
  let POLLINATIONS_LOADING = false;
  const POLLINATIONS_CACHE_KEY = 'localmind.pollinationsNoKeyCatalog.v1';
  async function loadPollinationsCatalog(force = false) {
    if (POLLINATIONS_LOADING) return;
    POLLINATIONS_LOADING = true;
    try {
      const cached = JSON.parse(safeStorageGet(POLLINATIONS_CACHE_KEY) || 'null');
      if (!force && cached && Array.isArray(cached.models) && Date.now() - Number(cached.savedAt || 0) < 5 * 60 * 1000) {
        POLLINATIONS_CATALOG = cached.models; renderFreeModelOptions();
      }
      const controller = new AbortController(); const timeout = setTimeout(()=>controller.abort(), 9000);
      try {
        const res = await fetch('https://text.pollinations.ai/models', { cache: 'no-store', signal: controller.signal, headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error(`Pollinations catalog HTTP ${res.status}`);
        const models = normalizePollinationsModels(await res.json());
        if (!models.length) throw new Error('No compatible no-key text models returned');
        POLLINATIONS_CATALOG = models;
        safeStorageSet(POLLINATIONS_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), models }));
        renderFreeModelOptions();
        setFreeStatus(`Live catalogs: ${POLLINATIONS_CATALOG.length} Pollinations no-key models and ${MURAKUMO_CATALOG.length} Murakumo models. Shared services can be busy or change availability.`);
        if (!state.freeModel) restoreFreeModelChoice();
      } finally { clearTimeout(timeout); }
    } catch (err) {
      console.warn('[LocalMind] Pollinations no-key catalog unavailable:', err);
      if (!POLLINATIONS_CATALOG.length) {
        try { const c = JSON.parse(safeStorageGet(POLLINATIONS_CACHE_KEY) || 'null'); if (c && Array.isArray(c.models)) POLLINATIONS_CATALOG = c.models; } catch (_) {}
      }
      renderFreeModelOptions();
    } finally { POLLINATIONS_LOADING = false; }
  }

  async function loadFreeModelCatalog(force = false) {
    if (FREE_CATALOG_LOADING) return;
    if (!force && FREE_CATALOG_LOADED_AT && Date.now() - FREE_CATALOG_LOADED_AT < FREE_CATALOG_TTL_MS) return;
    const cached = readCachedFreeCatalog();
    if (!force && cached && Array.isArray(cached.models) && cached.models.length && Date.now() - Number(cached.savedAt || 0) < FREE_CATALOG_TTL_MS) {
      FREE_CATALOG = cached.models;
      FREE_CATALOG_LOADED_AT = Number(cached.savedAt) || Date.now();
      renderFreeModelOptions();
      setFreeStatus(`Loaded ${FREE_CATALOG.length} cached free open-weight models. Refresh to check for updates.`);
    } else {
      setFreeStatus('Fetching the latest free open-weight model catalog…');
    }
    FREE_CATALOG_LOADING = true;
    refreshFreeModelsBtn.disabled = true;
    refreshFreeModelsBtn.style.opacity = '.55';
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 12000);
    try {
      const response = await fetch('https://openrouter.ai/api/v1/models', { method: 'GET', cache: force ? 'no-store' : 'default', signal: controller.signal, headers: { 'Accept': 'application/json' } });
      if (!response.ok) throw new Error(`OpenRouter catalog returned HTTP ${response.status}`);
      const payload = await response.json();
      const models = normalizeOpenRouterModels(payload);
      if (!models.length) throw new Error('The public catalog returned no matching free open-weight models');
      FREE_CATALOG = models;
      FREE_CATALOG_LOADED_AT = Date.now();
      safeStorageSet(FREE_MODEL_CACHE_KEY, JSON.stringify({ savedAt: FREE_CATALOG_LOADED_AT, models }));
      renderFreeModelOptions();
      setFreeStatus(`Live catalog updated: ${models.length} free open-weight models. Cloud inference requires a free OpenRouter key.`);
      // Restore a previously selected catalog model after its ID has been verified against the live listing.
      if (!state.freeModel) {
        try {
          const saved = JSON.parse(safeStorageGet(FREE_MODEL_SELECTION_KEY) || 'null');
          if (saved && saved.provider === 'openrouter') {
            const match = FREE_CATALOG.find(x => x.id === saved.id);
            if (match) setFreeModelChoice(match);
          }
        } catch (err) {}
      }
    } catch (err) {
      console.warn('[LocalMind] Free model catalog refresh failed:', err);
      const stillCached = readCachedFreeCatalog();
      if (!FREE_CATALOG.length && stillCached && Array.isArray(stillCached.models)) FREE_CATALOG = stillCached.models;
      renderFreeModelOptions();
      if (FREE_CATALOG.length) setFreeStatus(`OpenRouter catalog unavailable. Showing ${FREE_CATALOG.length} saved models; no-key Murakumo models are listed separately.`);
      else setFreeStatus(`OpenRouter catalog is unavailable${MURAKUMO_CATALOG.length ? `; ${MURAKUMO_CATALOG.length} no-key Murakumo models are available` : '; the no-key default route is still listed'}. Check your connection or refresh later.`);
    } finally {
      clearTimeout(timeout);
      FREE_CATALOG_LOADING = false;
      refreshFreeModelsBtn.disabled = false;
      refreshFreeModelsBtn.style.opacity = '';
      updateOpenRouterKeyStatus();
    }
  }

  /* ============================================================
     STREAM EVENT HANDLING
     ============================================================ */
  function handleStreamEvent(json, meta, onContent, onThinking) {
    if (!json || typeof json !== 'object') return;

    if (Array.isArray(json.candidates) && json.candidates.length) {
      const cand = json.candidates[0];
      if (cand.content && Array.isArray(cand.content.parts)) {
        cand.content.parts.forEach(part => {
          if (!part) return;
          if (part.thought === true) { if (typeof part.text === 'string') onThinking(part.text); }
          else if (typeof part.text === 'string') onContent(part.text);
        });
      }
      if (cand.finishReason === 'MAX_TOKENS' || cand.finishReason === 'LENGTH') meta.truncated = true;
      return;
    }

    if (Array.isArray(json.choices) && json.choices.length) {
      const choice = json.choices[0];
      const delta = choice.delta || choice.message || {};
      if (typeof delta.reasoning_content === 'string') onThinking(delta.reasoning_content);
      if (typeof delta.reasoning === 'string') onThinking(delta.reasoning);
      if (typeof delta.thinking === 'string') onThinking(delta.thinking);
      if (delta.content != null) {
        if (typeof delta.content === 'string') onContent(delta.content);
        else if (Array.isArray(delta.content)) {
          for (const part of delta.content) {
            if (!part) continue;
            const isThought = part.thought === true || (part.type && /thought|reasoning/i.test(part.type));
            if (isThought) { if (typeof part.text === 'string') onThinking(part.text); }
            else if (typeof part.text === 'string') onContent(part.text);
          }
        }
      }
      if (choice.finish_reason === 'length') meta.truncated = true;
      return;
    }

    const type = json.type;
    if (typeof type !== 'string') return;

    if (type === 'content_block_start' && json.content_block) {
      const cb = json.content_block;
      if (cb.type === 'thinking' && typeof cb.thinking === 'string' && cb.thinking) onThinking(cb.thinking);
      if (cb.type === 'text' && typeof cb.text === 'string' && cb.text) onContent(cb.text);
      return;
    }
    if (type === 'content_block_delta' && json.delta) {
      const d = json.delta;
      if (d.type === 'thinking_delta' && typeof d.thinking === 'string') onThinking(d.thinking);
      else if (d.type === 'text_delta' && typeof d.text === 'string') onContent(d.text);
      return;
    }
    if (type === 'message_delta') { if (json.delta && json.delta.stop_reason === 'max_tokens') meta.truncated = true; return; }
    if (type === 'message_start' || type === 'message_stop' || type === 'content_block_stop' || type === 'ping') return;

    if (type.startsWith('response.')) {
      if (type === 'response.output_text.delta' && typeof json.delta === 'string') { onContent(json.delta); return; }
      if (type === 'response.reasoning_summary_text.delta' && typeof json.delta === 'string') { onThinking(json.delta); return; }
      if (type === 'response.reasoning_text.delta' && typeof json.delta === 'string') { onThinking(json.delta); return; }
      if (type === 'response.completed' && json.response) {
        if (json.response.status === 'incomplete' || json.response.incomplete_details) meta.truncated = true;
        if (!meta.text && Array.isArray(json.response.output)) {
          let extracted = '';
          let extractedThinking = '';
          json.response.output.forEach(item => {
            if (!item) return;
            if (item.type === 'reasoning') {
              if (Array.isArray(item.summary)) extractedThinking += item.summary.map(s => s.text || '').join('\n');
              if (Array.isArray(item.content)) extractedThinking += item.content.map(c => c.text || '').join('');
            }
            if (item.type === 'message' && Array.isArray(item.content)) {
              item.content.forEach(c => {
                if ((c.type === 'output_text' || c.type === 'text') && c.text) extracted += c.text;
              });
            }
          });
          if (extractedThinking) onThinking(extractedThinking);
          if (extracted) onContent(extracted);
        }
        return;
      }
      if (type === 'response.failed') {
        throw new Error((json.response && json.response.error && json.response.error.message) || 'Response failed');
      }
      return;
    }

    if (type === 'error') throw new Error((json.error && json.error.message) || json.message || 'Stream error');

    if (json.delta && typeof json.delta === 'object') {
      if (typeof json.delta.content === 'string') onContent(json.delta.content);
      if (typeof json.delta.thinking === 'string') onThinking(json.delta.thinking);
      if (typeof json.delta.reasoning === 'string') onThinking(json.delta.reasoning);
    }
    if (typeof json.thinking === 'string') onThinking(json.thinking);
    if (typeof json.text === 'string') onContent(json.text);
  }

  async function processStreamingResponse(response, onContent, onThinking) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    const meta = { text: '', thinking: '', truncated: false };
    const emitContent = (c) => { if (c) { meta.text += c; onContent(c); } };
    const emitThinking = (c) => { if (c) { meta.thinking += c; onThinking(c); } };
    let finished = false;

    const processLine = (line) => {
      const trimmed = line.trim();
      if (!trimmed) return;
      if (trimmed.startsWith(':')) return;
      if (trimmed.startsWith('event:')) return;
      if (!trimmed.startsWith('data:')) return;
      const payload = trimmed.slice(5).trim();
      if (!payload) return;
      if (payload === '[DONE]') { finished = true; return; }
      let json;
      try { json = JSON.parse(payload); } catch (e) { return; }
      if (json.error) throw new Error(json.error.message || JSON.stringify(json.error));
      handleStreamEvent(json, meta, emitContent, emitThinking);
    };

    try {
      while (!finished) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf('\n')) !== -1) {
          const line = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 1);
          processLine(line);
          if (finished) break;
        }
      }
      if (!finished && buffer.trim()) processLine(buffer);
    } finally {
      try { await reader.cancel(); } catch (e) {}
    }
    return meta;
  }

  /* ============================================================
     NON-STREAMING EXTRACTION
     ============================================================ */
  function extractFromJson(json) {
    if (!json || typeof json !== 'object') throw new Error('Empty response');
    if (json.error) throw new Error(json.error.message || JSON.stringify(json.error));

    let text = '';
    let thinking = '';
    let truncated = false;

    if (Array.isArray(json)) {
      json.forEach(chunk => {
        if (!chunk) return;
        if (chunk.error) throw new Error(chunk.error.message || JSON.stringify(chunk.error));
        if (Array.isArray(chunk.candidates) && chunk.candidates.length) {
          const cand = chunk.candidates[0];
          if (cand.content && Array.isArray(cand.content.parts)) {
            cand.content.parts.forEach(part => {
              if (!part) return;
              if (part.thought === true) { if (typeof part.text === 'string') thinking += part.text; }
              else if (typeof part.text === 'string') text += part.text;
            });
          }
          if (cand.finishReason === 'MAX_TOKENS' || cand.finishReason === 'LENGTH') truncated = true;
        }
      });
      return { text, thinking, truncated };
    }

    if (Array.isArray(json.candidates) && json.candidates.length) {
      const cand = json.candidates[0];
      if (cand.content && Array.isArray(cand.content.parts)) {
        cand.content.parts.forEach(part => {
          if (!part) return;
          if (part.thought === true) { if (typeof part.text === 'string') thinking += part.text; }
          else if (typeof part.text === 'string') text += part.text;
        });
      }
      if (cand.finishReason === 'MAX_TOKENS' || cand.finishReason === 'LENGTH') truncated = true;
      return { text, thinking, truncated };
    }

    const consumeChatMessage = (msg) => {
      if (!msg) return;
      if (typeof msg.content === 'string') text += msg.content;
      else if (Array.isArray(msg.content)) {
        msg.content.forEach(part => {
          if (!part) return;
          const isThought = part.thought === true || (part.type && /thought|reasoning/i.test(part.type));
          if (isThought) { if (typeof part.text === 'string') thinking += part.text; }
          else if (typeof part.text === 'string') text += part.text;
        });
      }
      if (typeof msg.reasoning_content === 'string') thinking += msg.reasoning_content;
      if (typeof msg.reasoning === 'string') thinking += msg.reasoning;
      if (typeof msg.thinking === 'string') thinking += msg.thinking;
    };

    if (Array.isArray(json.content) && !Array.isArray(json.choices)) {
      json.content.forEach(block => {
        if (!block) return;
        if (block.type === 'thinking' && typeof block.thinking === 'string') thinking += block.thinking;
        else if (block.type === 'text' && typeof block.text === 'string') text += block.text;
      });
      if (json.stop_reason === 'max_tokens') truncated = true;
    } else if (Array.isArray(json.output)) {
      json.output.forEach(item => {
        if (!item) return;
        if (item.type === 'reasoning') {
          if (Array.isArray(item.summary)) thinking += item.summary.map(s => s.text || '').join('\n');
          if (Array.isArray(item.content)) thinking += item.content.map(c => c.text || '').join('');
          if (typeof item.text === 'string') thinking += item.text;
        }
        if (item.type === 'message' && Array.isArray(item.content)) {
          item.content.forEach(c => {
            if ((c.type === 'output_text' || c.type === 'text') && c.text) text += c.text;
          });
        }
      });
      if (!text && typeof json.output_text === 'string') text = json.output_text;
      if (json.status === 'incomplete' || json.incomplete_details) truncated = true;
    } else if (Array.isArray(json.choices) && json.choices.length) {
      const choice = json.choices[0];
      consumeChatMessage(choice.message);
      if (choice.finish_reason === 'length') truncated = true;
    } else {
      if (typeof json.output_text === 'string') text = json.output_text;
      if (!text && typeof json.content === 'string') text = json.content;
      consumeChatMessage(json.message);
    }

    return { text, thinking, truncated };
  }

  /* ============================================================
     FETCH RESPONSE
     ============================================================ */
  async function fetchModelResponse(config, messages, reasoning, attachments, opts = {}) {
    const stream = opts.stream !== false;
    const endpoint = config.endpoint;
    const apiType = config.apiType || 'openai-chat';
    const systemPrompt = getSystemPrompt(config);

    // The free-model routes use a separate provider and must never inherit Kie.ai credentials.
    if (config.provider === 'murakumo' || config.provider === 'openrouter' || config.provider === 'pollinations') {
      const remoteMessages = [];
      if (systemPrompt) remoteMessages.push({ role: 'system', content: systemPrompt });
      const sourceMessages = JSON.parse(JSON.stringify(messages));
      let textContext = '';
      const imageAttachments = [];
      (attachments || []).forEach(att => {
        if (att.type === 'text') textContext += `\n\n--- Attached File: ${att.name} ---\n${att.content}`;
        else if (att.type === 'image') imageAttachments.push(att.content);
      });
      sourceMessages.forEach((m, index) => {
        const isLast = index === sourceMessages.length - 1;
        let content = typeof m.content === 'string' ? m.content : String(m.content || '');
        if (isLast && m.role === 'user') content += textContext;
        if (isLast && m.role === 'user' && imageAttachments.length) {
          const parts = [{ type: 'text', text: content }];
          imageAttachments.forEach(url => parts.push({ type: 'image_url', image_url: { url } }));
          remoteMessages.push({ role: 'user', content: parts });
        } else {
          remoteMessages.push({ role: m.role === 'assistant' ? 'assistant' : 'user', content });
        }
      });
      if (config.provider === 'openrouter' && !getOpenRouterKey()) {
        throw new Error('This OpenRouter model needs a free API key. Open the Free models menu and choose “Add OpenRouter key”, or choose a no-key Murakumo model.');
      }
      const headers = { 'Content-Type': 'application/json', 'Accept': stream ? 'text/event-stream, application/json' : 'application/json' };
      if (config.provider === 'openrouter') {
        headers.Authorization = `Bearer ${getOpenRouterKey()}`;
        headers['X-Title'] = 'LocalMind';
      }
      const body = { model: config.id, messages: remoteMessages, stream, temperature: 0.7, max_tokens: config.provider === 'murakumo' ? 2048 : 4096 };
      if (config.provider === 'pollinations') { body.private = true; body.stream = stream; }
      const res = await fetch(endpoint, {
        method: 'POST', headers, body: JSON.stringify(body),
        signal: state.abortController ? state.abortController.signal : undefined
      });
      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        let details = errText.slice(0, 300);
        try { const parsed = JSON.parse(errText); details = parsed.error && (parsed.error.message || parsed.error.code) || parsed.message || details; } catch (e) {}
        if (stream && res.status >= 400 && res.status < 500 && /stream/i.test(details)) {
          return fetchModelResponse(config, messages, reasoning, attachments, { stream: false });
        }
        if (res.status === 401 || res.status === 403) throw new Error(config.provider === 'openrouter' ? `OpenRouter rejected the request (HTTP ${res.status}). Check the saved key, or choose a no-key model. ${details}` : `The no-key open-model provider rejected the request (HTTP ${res.status}). Try another model or refresh its catalog. ${details}`);
        if (res.status === 429) throw new Error(`The free provider is rate-limited right now. Wait a little or choose another free route. ${details}`);
        throw new Error(`Free provider HTTP ${res.status}: ${details}`);
      }
      return res;
    }

    const authHeaders = getAuthHeaders(config);
    let body = {};

    let textContext = '';
    const imageAttachments = [];
    attachments.forEach(att => {
      if (att.type === 'text') textContext += `\n\n--- Attached File: ${att.name} ---\n${att.content}`;
      else if (att.type === 'image') imageAttachments.push(att.content);
    });

    const augmentedMessages = JSON.parse(JSON.stringify(messages));
    if (textContext) {
      const lastMsg = augmentedMessages[augmentedMessages.length - 1];
      if (lastMsg && lastMsg.role === 'user') lastMsg.content += textContext;
    }

    // System-prompt inclusion flag (default depends on apiType to preserve past behaviour)
    const defaultInclude = apiType === 'openai-responses' ? false : true;
    const includeInstructions = config.includeInstructions !== undefined
      ? config.includeInstructions === true
      : defaultInclude;

    if (apiType === 'openai-chat') {
      const gMessages = [];
      if (includeInstructions && systemPrompt) {
        gMessages.push({ role: 'system', content: systemPrompt });
      }
      augmentedMessages.forEach((m, idx) => {
        const isLast = idx === augmentedMessages.length - 1;
        if (m.role === 'user') {
          if (isLast && imageAttachments.length > 0) {
            const contentParts = [{ type: 'text', text: m.content }];
            imageAttachments.forEach(img => contentParts.push({ type: 'image_url', image_url: { url: img } }));
            gMessages.push({ role: 'user', content: contentParts });
          } else {
            gMessages.push({ role: 'user', content: m.content });
          }
        } else {
          gMessages.push({ role: m.role, content: m.content });
        }
      });

      body = { messages: gMessages, stream };
      if (config.sendModelInBody) body.model = config.id;
      if (config.supportsReasoningEffort && reasoning) body.reasoning_effort = reasoning;
      if (config.includeThoughts) body.include_thoughts = true;
      if (Array.isArray(config.tools) && config.tools.length) body.tools = config.tools;
      if (config.maxOutputTokens) body.max_tokens = config.maxOutputTokens;
    } else if (apiType === 'openai-responses') {
      const input = augmentedMessages.map(m => ({
        type: 'message',
        role: m.role,
        content: [{
          type: m.role === 'user' ? 'input_text' : 'output_text',
          text: m.content
        }]
      }));

      if (imageAttachments.length > 0) {
        const lastMsg = input[input.length - 1];
        imageAttachments.forEach(img => lastMsg.content.push({ type: 'input_image', image_url: img }));
      }

      body = { stream, input };
      if (config.sendModelInBody !== false) body.model = config.id;
      if (config.supportsReasoningEffort && reasoning) body.reasoning = { effort: reasoning };
      if (includeInstructions && systemPrompt) body.instructions = systemPrompt;
      if (Array.isArray(config.tools) && config.tools.length) body.tools = config.tools;
      if (config.maxOutputTokens) body.max_output_tokens = config.maxOutputTokens;
    } else if (apiType === 'gemini-native') {
      const gContents = augmentedMessages.map(m => ({
        role: m.role === 'user' ? 'user' : 'model',
        parts: [{ text: m.content }]
      }));

      if (imageAttachments.length > 0) {
        const lastContent = gContents[gContents.length - 1];
        imageAttachments.forEach(img => {
          const match = img.match(/^data:([^;]+);base64,(.+)$/);
          if (match) lastContent.parts.push({ inlineData: { mimeType: match[1], data: match[2] } });
        });
      }

      body = {
        stream: true,
        contents: gContents,
        generationConfig: {
          thinkingConfig: { includeThoughts: config.includeThoughts !== false, thinkingLevel: reasoning }
        }
      };
      if (includeInstructions && systemPrompt) body.systemInstruction = { parts: [{ text: systemPrompt }] };
    } else if (apiType === 'anthropic') {
      const claudeMessages = augmentedMessages.map((m, idx) => {
        const isLast = idx === augmentedMessages.length - 1;
        if (m.role === 'user' && isLast && imageAttachments.length > 0) {
          const contentParts = [{ type: 'text', text: m.content }];
          imageAttachments.forEach(img => contentParts.push({ type: 'image_url', image_url: { url: img } }));
          return { role: 'user', content: contentParts };
        }
        return { role: m.role, content: m.content };
      });

      const maxTokensMap = config.maxTokens || { minimal: 8192, low: 12288, medium: 16384, high: 24576, max: 32000 };
      const maxTokens = maxTokensMap[reasoning] || config.maxOutputTokens || 32000;

      body = {
        model: config.id,
        messages: claudeMessages,
        max_tokens: maxTokens,
        stream,
        thinkingFlag: true
      };
      if (includeInstructions && systemPrompt) body.system = systemPrompt;
    } else {
      throw new Error(`Unknown apiType: ${apiType}`);
    }

    const headers = { ...authHeaders, 'Content-Type': 'application/json' };
    const res = await fetch(endpoint, {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
      signal: state.abortController.signal
    });

    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      if (stream && res.status >= 400 && res.status < 500 && /stream/i.test(errText)) {
        return fetchModelResponse(config, messages, reasoning, attachments, { stream: false });
      }
      throw new Error(`HTTP ${res.status}: ${errText.slice(0, 300)}`);
    }
    return res;
  }

  /* ============================================================
     GENERATE RESPONSE
     ============================================================ */
  async function generateResponse() {
    if (state.isGenerating) {
      if (state.abortController) state.abortController.abort();
      return;
    }
    const text = chatInput.value.trim();
    if (!text && state.attachments.length === 0) return;
    if (!state.model) return;

    state.isGenerating = true;
    chatInput.value = '';
    chatInput.style.height = 'auto';
    sendIcon.style.display = 'none';
    stopIcon.style.display = 'block';
    sendBtn.classList.add('stop-mode');
    sendBtn.disabled = false;
    inputWrapper.classList.add('generating');
    updateSendBtn();

    addUserMessage(text, state.attachments);
    state.messages.push({ role: 'user', content: text });

    const currentAttachments = [...state.attachments];
    state.attachments = [];
    renderAttachments();

    const { bubble, avatar, contentDiv } = createAssistantRow();
    const streamState = { renderedParts: [] };

    let rawText = '';
    let rawThinking = '';
    let hasThinking = false;
    let hasContent = false;
    let thinkingPanel = null;
    let thinkingBody = null;
    let thinkingTimeEl = null;
    let thinkingTimer = null;
    let thinkingStart = 0;
    let renderTimer = null;
    let pendingThinking = false;

    state.abortController = new AbortController();
    const signal = state.abortController.signal;

    function removeWaiting() {
      const w = bubble.querySelector('.waiting-indicator');
      if (w) w.remove();
    }
    function ensureThinkingPanel() {
      if (thinkingPanel) return;
      removeWaiting();
      thinkingPanel = createThinkingPanel();
      thinkingBody = thinkingPanel.querySelector('.thinking-body');
      thinkingTimeEl = thinkingPanel.querySelector('.thinking-time');
      thinkingStart = performance.now();
      thinkingTimer = setInterval(() => {
        if (thinkingTimeEl) thinkingTimeEl.textContent = ((performance.now() - thinkingStart) / 1000).toFixed(1) + 's';
      }, 100);
      bubble.insertBefore(thinkingPanel, contentDiv);
    }
    function scheduleContentRender() {
      if (renderTimer) return;
      renderTimer = setTimeout(() => {
        renderTimer = null;
        updateStreamingContent(contentDiv, rawText, streamState);
        contentDiv.classList.remove('content-arriving');
        void contentDiv.offsetWidth;
        contentDiv.classList.add('content-arriving');
        ensureCursor(contentDiv);
        scrollToBottom();
      }, 30);
    }
    function finalizeThinking(forceCollapse = true) {
      if (!thinkingPanel || thinkingPanel.dataset.finalized) return;
      thinkingPanel.dataset.finalized = 'true';
      thinkingPanel.classList.add('done');
      if (thinkingTimer) { clearInterval(thinkingTimer); thinkingTimer = null; }
      const elapsed = thinkingStart ? ((performance.now() - thinkingStart) / 1000) : 0;
      const userWantsExpanded = thinkingPanel.dataset.userExpanded === 'true';
      if (forceCollapse && !userWantsExpanded) thinkingPanel.classList.remove('expanded');
      const label = thinkingPanel.querySelector('.thinking-label');
      if (label) {
        label.innerHTML = `<svg class="thought-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><path d="M20 6L9 17l-5-5"/></svg><span class="thinking-text">Thought for ${elapsed.toFixed(1)}s</span>`;
      }
      avatar.classList.remove('thinking');
    }
    function onThinking(chunk) {
      if (!chunk) return;
      rawThinking += chunk;
      if (!hasThinking) { hasThinking = true; ensureThinkingPanel(); avatar.classList.add('thinking'); }
      if (pendingThinking) return;
      pendingThinking = true;
      requestAnimationFrame(() => {
        pendingThinking = false;
        if (thinkingBody) {
          thinkingBody.textContent = rawThinking;
          const wrapper = thinkingBody.parentElement;
          if (wrapper && thinkingPanel && thinkingPanel.classList.contains('expanded')) {
            const nearBottom = wrapper.scrollHeight - wrapper.scrollTop - wrapper.clientHeight < 40;
            if (nearBottom) wrapper.scrollTop = wrapper.scrollHeight;
          }
        }
        scrollToBottom();
      });
    }
    function onContent(chunk) {
      if (!chunk) return;
      rawText += chunk;
      if (!hasContent) {
        hasContent = true;
        removeWaiting();
        if (hasThinking) finalizeThinking();
      }
      scheduleContentRender();
    }

    try {
      const config = getActiveFreeConfig() || MODEL_CONFIG[state.model];
      if (!config) throw new Error('The selected model is unavailable. Choose another model and try again.');
      let requestMessages = [...state.messages];
      let accumulated = '';
      const maxAttempts = 3;

      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        if (signal.aborted) throw abortError();
        const response = await fetchModelResponse(config, requestMessages, state.reasoning, attempt === 0 ? currentAttachments : []);
        const contentType = (response.headers.get('content-type') || '').toLowerCase();
        let result;

        if (contentType.includes('text/event-stream') && response.body) {
          result = await processStreamingResponse(response, onContent, onThinking);
        } else {
          const json = await response.json();
          result = extractFromJson(json);
          if (result.thinking) await typewriterReveal(result.thinking, onThinking, signal, { maxDuration: 1600 });
          if (signal.aborted) throw abortError();
          if (result.text) await typewriterReveal(result.text, onContent, signal);
          if (signal.aborted) throw abortError();
        }

        accumulated += result.text || '';
        if (!result.truncated) break;
        if (attempt === maxAttempts - 1) break;
        requestMessages = [
          ...requestMessages,
          { role: 'assistant', content: accumulated },
          { role: 'user', content: 'Continue from exactly where you stopped. Do not repeat any previous content. Output only the continuation.' }
        ];
      }
    } catch (err) {
      if (err.name === 'AbortError') rawText = rawText ? rawText + '\n\n*[Generation stopped]*' : '*[Generation stopped]*';
      else { console.error(err); const errMsg = `⚠️ **Error:** ${err.message}`; rawText = rawText ? rawText + '\n\n' + errMsg : errMsg; }
      hasContent = true;
      removeWaiting();
      scheduleContentRender();
    } finally {
      if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
      if (thinkingTimer) { clearInterval(thinkingTimer); thinkingTimer = null; }
      removeWaiting();
      removeCursor(contentDiv);
      finalizeContent(contentDiv, rawText, streamState);
      if (hasThinking) finalizeThinking();
      avatar.classList.remove('thinking');
      addMessageActions(bubble, rawText);
      if (rawText.trim()) state.messages.push({ role: 'assistant', content: rawText });

      state.isGenerating = false;
      state.abortController = null;
      inputWrapper.classList.remove('generating');
      sendIcon.style.display = 'block';
      stopIcon.style.display = 'none';
      sendBtn.classList.remove('stop-mode');
      updateSendBtn();
      chatInput.focus();
      scrollToBottom(true);
      updateScrollBtn();
    }
  }

  /* ============================================================
     EVENTS
     ============================================================ */
  sendBtn.addEventListener('click', generateResponse);
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (state.isGenerating) return;
      generateResponse();
    }
  });
  chatInput.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 200) + 'px';
    updateSendBtn();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      modelDropdown.classList.remove('active');
      modelBtn.classList.remove('active');
      modelBtn.setAttribute('aria-expanded', 'false');
      freeModelDropdown.classList.remove('active');
      freeModelBtn.classList.remove('active');
      freeModelBtn.setAttribute('aria-expanded', 'false');
      sidebar.classList.remove('active');
      sidebarOverlay.classList.remove('active');
      previewModal.classList.remove('open');
    }
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      chatInput.focus();
    }
    if (mod && e.key.toLowerCase() === 'l') {
      e.preventDefault();
      clearChatBtn.click();
    }
    if (mod && e.shiftKey && e.key.toLowerCase() === 'e') {
      e.preventDefault();
      exportConversation();
    }
    if (mod && e.key === '/') {
      e.preventDefault();
      chatInput.focus();
    }
  });

  /* ============================================================
     BOOTSTRAP
     ============================================================ */
  async function loadConfig() {
    try {
      if (location.protocol === 'file:') throw new Error('file:// protocol — local fetch blocked');
      const res = await fetch('models.json', { cache: 'default' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data || !Array.isArray(data.models) || data.models.length === 0) throw new Error('models.json missing models array');
      console.log('[LocalMind] Loaded models.json —', data.models.length, 'model(s)');
      return data;
    } catch (err) {
      console.warn('[LocalMind] models.json load failed — using built-in fallback:', err.message);
      return DEFAULT_CONFIG;
    }
  }

  async function init() {
    const cfg = await loadConfig();
    SETTINGS = cfg.settings || {};
    MODELS_LIST = cfg.models;
    MODEL_CONFIG = {};
    MODELS_LIST.forEach(m => { MODEL_CONFIG[m.key] = m; });

    applySettings();
    populateModelDropdown();

    const defaultKey = (SETTINGS.defaultModel && MODEL_CONFIG[SETTINGS.defaultModel])
      ? SETTINGS.defaultModel
      : MODELS_LIST[0].key;

    // setMode must run BEFORE selectModel so state.mode is correct
    // when renderReasoningUI picks the mode-specific default.
    setMode('coding');
    selectModel(defaultKey);
    updateFreeModelButton();
    updateOpenRouterKeyStatus();
    restoreFreeModelChoice();
    // External catalog loading is non-blocking and must never prevent the Kie.ai chat from booting.
    loadMurakumoCatalog(true).catch(err => console.warn('[LocalMind] No-key catalog startup failed:', err));
    loadPollinationsCatalog(true).catch(err => console.warn('[LocalMind] Pollinations catalog startup failed:', err));
    chatInput.focus();
    updateSendBtn();
  }

  init().catch(err => {
    console.error('[LocalMind] Init failed:', err);
  });
</script>
</body>
</html>
