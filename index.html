/* ============================================================================
   STREAM EVENT HANDLING  (per-API-type, with tool-call accumulation)
   ============================================================================ */
function handleStreamEvent(json, meta, apiType, emitContent, emitThinking) {
  if (!json || typeof json !== 'object') return;

  // ---- Gemini native ----
  if (Array.isArray(json.candidates) && json.candidates.length) {
    const cand = json.candidates[0];
    if (cand.content && Array.isArray(cand.content.parts)) {
      cand.content.parts.forEach(part => {
        if (!part) return;
        if (part.thought === true) { if (typeof part.text === 'string') emitThinking(part.text); }
        else if (typeof part.text === 'string') emitContent(part.text);
        else if (part.functionCall) {
          meta.toolCalls.push({
            id: 'call_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
            name: part.functionCall.name,
            args: part.functionCall.args || {}
          });
        }
      });
    }
    if (cand.finishReason === 'MAX_TOKENS' || cand.finishReason === 'LENGTH') meta.truncated = true;
    return;
  }

  // ---- OpenAI Chat ----
  if (Array.isArray(json.choices) && json.choices.length) {
    const choice = json.choices[0];
    const delta = choice.delta || choice.message || {};
    if (typeof delta.reasoning_content === 'string') emitThinking(delta.reasoning_content);
    if (typeof delta.reasoning === 'string') emitThinking(delta.reasoning);
    if (typeof delta.thinking === 'string') emitThinking(delta.thinking);
    if (delta.content != null) {
      if (typeof delta.content === 'string') emitContent(delta.content);
      else if (Array.isArray(delta.content)) {
        for (const part of delta.content) {
          if (!part) continue;
          const isThought = part.thought === true || (part.type && /thought|reasoning/i.test(part.type));
          if (isThought) { if (typeof part.text === 'string') emitThinking(part.text); }
          else if (typeof part.text === 'string') emitContent(part.text);
        }
      }
    }
    if (Array.isArray(delta.tool_calls)) {
      for (const tc of delta.tool_calls) {
        const idx = tc.index ?? 0;
        if (!meta._chatToolAcc) meta._chatToolAcc = new Map();
        if (!meta._chatToolAcc.has(idx)) meta._chatToolAcc.set(idx, { id: '', name: '', argsStr: '' });
        const acc = meta._chatToolAcc.get(idx);
        if (tc.id) acc.id = tc.id;
        if (tc.function && tc.function.name) acc.name = tc.function.name;
        if (tc.function && tc.function.arguments) acc.argsStr += tc.function.arguments;
      }
    }
    if (choice.finish_reason === 'length') meta.truncated = true;
    return;
  }

  const type = json.type;
  if (typeof type !== 'string') return;

  // ---- Anthropic ----
  if (type === 'content_block_start' && json.content_block) {
    const cb = json.content_block;
    if (cb.type === 'thinking' && typeof cb.thinking === 'string' && cb.thinking) emitThinking(cb.thinking);
    if (cb.type === 'text' && typeof cb.text === 'string' && cb.text) emitContent(cb.text);
    if (cb.type === 'tool_use') {
      if (!meta._anthropicToolAcc) meta._anthropicToolAcc = new Map();
      meta._anthropicToolAcc.set(json.index ?? 0, {
        id: cb.id || 'toolu_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        name: cb.name || '',
        argsStr: ''
      });
    }
    return;
  }
  if (type === 'content_block_delta' && json.delta) {
    const d = json.delta;
    if (d.type === 'thinking_delta' && typeof d.thinking === 'string') emitThinking(d.thinking);
    else if (d.type === 'text_delta' && typeof d.text === 'string') emitContent(d.text);
    else if (d.type === 'input_json_delta' && typeof d.partial_json === 'string') {
      if (!meta._anthropicToolAcc) meta._anthropicToolAcc = new Map();
      const acc = meta._anthropicToolAcc.get(json.index ?? 0);
      if (acc) acc.argsStr += d.partial_json;
    }
    return;
  }
  if (type === 'message_delta') {
    if (json.delta && json.delta.stop_reason === 'max_tokens') meta.truncated = true;
    return;
  }
  if (type === 'message_start' || type === 'message_stop' || type === 'content_block_stop' || type === 'ping') return;

  // ---- OpenAI Responses ----
  if (type.startsWith('response.')) {
    if (type === 'response.output_text.delta' && typeof json.delta === 'string') { emitContent(json.delta); return; }
    if (type === 'response.reasoning_summary_text.delta' && typeof json.delta === 'string') { emitThinking(json.delta); return; }
    if (type === 'response.reasoning_text.delta' && typeof json.delta === 'string') { emitThinking(json.delta); return; }

    if (type === 'response.output_item.added' && json.item && json.item.type === 'function_call') {
      if (!meta._respToolAcc) meta._respToolAcc = new Map();
      meta._respToolAcc.set(json.item.id, {
        id: json.item.call_id || json.item.id,
        name: json.item.name || '',
        argsStr: json.item.arguments || ''
      });
      return;
    }
    if (type === 'response.function_call_arguments.delta' && typeof json.delta === 'string') {
      if (!meta._respToolAcc) meta._respToolAcc = new Map();
      const acc = meta._respToolAcc.get(json.item_id);
      if (acc) acc.argsStr += json.delta;
      return;
    }
    if (type === 'response.output_item.done' && json.item && json.item.type === 'function_call') {
      if (!meta._respToolAcc) meta._respToolAcc = new Map();
      const acc = meta._respToolAcc.get(json.item.id);
      if (acc && typeof json.item.arguments === 'string') acc.argsStr = json.item.arguments;
      return;
    }

    if (type === 'response.completed' && json.response) {
      if (json.response.status === 'incomplete' || json.response.incomplete_details) meta.truncated = true;
      // Authoritative tool-call extraction
      if (Array.isArray(json.response.output)) {
        let extracted = '';
        let extractedThinking = '';
        const toolCalls = [];
        json.response.output.forEach(item => {
          if (!item) return;
          if (item.type === 'reasoning') {
            if (Array.isArray(item.summary)) extractedThinking += item.summary.map(s => s.text || '').join('\n');
            if (Array.isArray(item.content)) extractedThinking += item.content.map(c => c.text || '').join('');
          }
          if (item.type === 'function_call') {
            toolCalls.push({
              id: item.call_id || item.id,
              name: item.name || '',
              args: safeJsonParse(item.arguments)
            });
          }
          if (item.type === 'message' && Array.isArray(item.content)) {
            item.content.forEach(c => {
              if ((c.type === 'output_text' || c.type === 'text') && c.text) extracted += c.text;
            });
          }
        });
        if (extractedThinking && !meta.text) emitThinking(extractedThinking);
        if (extracted && !meta.text) emitContent(extracted);
        if (toolCalls.length) meta.toolCalls.push(...toolCalls);
      }
      return;
    }
    if (type === 'response.failed') {
      throw new Error((json.response && json.response.error && json.response.error.message) || 'Response failed');
    }
    return;
  }

  if (type === 'error') throw new Error((json.error && json.error.message) || json.message || 'Stream error');

  if (json.delta && typeof json.delta === 'object') {
    if (typeof json.delta.content === 'string') emitContent(json.delta.content);
    if (typeof json.delta.thinking === 'string') emitThinking(json.delta.thinking);
    if (typeof json.delta.reasoning === 'string') emitThinking(json.delta.reasoning);
  }
  if (typeof json.thinking === 'string') emitThinking(json.thinking);
  if (typeof json.text === 'string') emitContent(json.text);
}

async function processStreamingResponse(response, apiType, { onContent, onThinking }) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  const meta = { text: '', thinking: '', truncated: false, toolCalls: [] };
  const emitContent = (c) => { if (c) { meta.text += c; onContent(c); } };
  const emitThinking = (c) => { if (c) { meta.thinking += c; onThinking(c); } };
  let finished = false;

  const processLine = (line) => {
    const trimmed = line.trim();
    if (!trimmed) return;
    if (trimmed.startsWith(':')) return;
    if (trimmed.startsWith('event:')) return;
    if (!trimmed.startsWith('data:')) return;
    const payload = trimmed.slice(5).trim();
    if (!payload) return;
    if (payload === '[DONE]') { finished = true; return; }
    let json;
    try { json = JSON.parse(payload); } catch (e) { return; }
    if (json.error) throw new Error(json.error.message || JSON.stringify(json.error));
    handleStreamEvent(json, meta, apiType, emitContent, emitThinking);
  };

  try {
    while (!finished) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf('\n')) !== -1) {
        const line = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 1);
        processLine(line);
        if (finished) break;
      }
    }
    if (!finished && buffer.trim()) processLine(buffer);
  } finally {
    try { await reader.cancel(); } catch (e) {}
  }

  // Finalize tool calls per API type
  if (meta._chatToolAcc) {
    const arr = Array.from(meta._chatToolAcc.entries()).sort((a, b) => a[0] - b[0]);
    arr.forEach(([, acc]) => {
      if (acc.name) meta.toolCalls.push({ id: acc.id || ('call_' + Math.random().toString(36).slice(2, 8)), name: acc.name, args: safeJsonParse(acc.argsStr) });
    });
    meta._chatToolAcc = null;
  }
  if (meta._anthropicToolAcc) {
    const arr = Array.from(meta._anthropicToolAcc.entries()).sort((a, b) => a[0] - b[0]);
    arr.forEach(([, acc]) => {
      if (acc.name) meta.toolCalls.push({ id: acc.id, name: acc.name, args: safeJsonParse(acc.argsStr) });
    });
    meta._anthropicToolAcc = null;
  }
  if (meta._respToolAcc) {
    // fallback if response.completed didn't provide
    if (!meta.toolCalls.length) {
      const arr = Array.from(meta._respToolAcc.values());
      arr.forEach(acc => {
        if (acc.name) meta.toolCalls.push({ id: acc.id, name: acc.name, args: safeJsonParse(acc.argsStr) });
      });
    }
    meta._respToolAcc = null;
  }

  return meta;
}

/* ============================================================================
   NON-STREAMING EXTRACTION
   ============================================================================ */
function extractFromJson(json, apiType) {
  if (!json || typeof json !== 'object') throw new Error('Empty response');
  if (json.error) throw new Error(json.error.message || JSON.stringify(json.error));

  let text = '';
  let thinking = '';
  let truncated = false;
  const toolCalls = [];

  const consumeChatMessage = (msg) => {
    if (!msg) return;
    if (typeof msg.content === 'string') text += msg.content;
    else if (Array.isArray(msg.content)) {
      msg.content.forEach(part => {
        if (!part) return;
        const isThought = part.thought === true || (part.type && /thought|reasoning/i.test(part.type));
        if (isThought) { if (typeof part.text === 'string') thinking += part.text; }
        else if (typeof part.text === 'string') text += part.text;
      });
    }
    if (typeof msg.reasoning_content === 'string') thinking += msg.reasoning_content;
    if (typeof msg.reasoning === 'string') thinking += msg.reasoning;
    if (typeof msg.thinking === 'string') thinking += msg.thinking;
    if (Array.isArray(msg.tool_calls)) {
      msg.tool_calls.forEach(tc => {
        if (!tc || !tc.function) return;
        toolCalls.push({ id: tc.id, name: tc.function.name, args: safeJsonParse(tc.function.arguments) });
      });
    }
  };

  if (Array.isArray(json)) {
    json.forEach(chunk => {
      if (!chunk) return;
      if (chunk.error) throw new Error(chunk.error.message || JSON.stringify(chunk.error));
      if (Array.isArray(chunk.candidates) && chunk.candidates.length) {
        const cand = chunk.candidates[0];
        if (cand.content && Array.isArray(cand.content.parts)) {
          cand.content.parts.forEach(part => {
            if (!part) return;
            if (part.thought === true) { if (typeof part.text === 'string') thinking += part.text; }
            else if (typeof part.text === 'string') text += part.text;
            else if (part.functionCall) toolCalls.push({ id: 'call_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8), name: part.functionCall.name, args: part.functionCall.args || {} });
          });
        }
        if (cand.finishReason === 'MAX_TOKENS' || cand.finishReason === 'LENGTH') truncated = true;
      }
      if (Array.isArray(chunk.choices) && chunk.choices.length) {
        consumeChatMessage(chunk.choices[0].message);
        if (chunk.choices[0].finish_reason === 'length') truncated = true;
      }
    });
    return { text, thinking, truncated, toolCalls };
  }

  if (Array.isArray(json.candidates) && json.candidates.length) {
    const cand = json.candidates[0];
    if (cand.content && Array.isArray(cand.content.parts)) {
      cand.content.parts.forEach(part => {
        if (!part) return;
        if (part.thought === true) { if (typeof part.text === 'string') thinking += part.text; }
        else if (typeof part.text === 'string') text += part.text;
        else if (part.functionCall) toolCalls.push({ id: 'call_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8), name: part.functionCall.name, args: part.functionCall.args || {} });
      });
    }
    if (cand.finishReason === 'MAX_TOKENS' || cand.finishReason === 'LENGTH') truncated = true;
    return { text, thinking, truncated, toolCalls };
  }

  if (Array.isArray(json.content) && !Array.isArray(json.choices)) {
    // Anthropic
    json.content.forEach(block => {
      if (!block) return;
      if (block.type === 'thinking' && typeof block.thinking === 'string') thinking += block.thinking;
      else if (block.type === 'text' && typeof block.text === 'string') text += block.text;
      else if (block.type === 'tool_use') toolCalls.push({ id: block.id, name: block.name, args: block.input || {} });
    });
    if (json.stop_reason === 'max_tokens') truncated = true;
  } else if (Array.isArray(json.output)) {
    // OpenAI Responses
    json.output.forEach(item => {
      if (!item) return;
      if (item.type === 'reasoning') {
        if (Array.isArray(item.summary)) thinking += item.summary.map(s => s.text || '').join('\n');
        if (Array.isArray(item.content)) thinking += item.content.map(c => c.text || '').join('');
        if (typeof item.text === 'string') thinking += item.text;
      }
      if (item.type === 'function_call') {
        toolCalls.push({ id: item.call_id || item.id, name: item.name, args: safeJsonParse(item.arguments) });
      }
      if (item.type === 'message' && Array.isArray(item.content)) {
        item.content.forEach(c => {
          if ((c.type === 'output_text' || c.type === 'text') && c.text) text += c.text;
        });
      }
    });
    if (!text && typeof json.output_text === 'string') text = json.output_text;
    if (json.status === 'incomplete' || json.incomplete_details) truncated = true;
  } else if (Array.isArray(json.choices) && json.choices.length) {
    const choice = json.choices[0];
    consumeChatMessage(choice.message);
    if (choice.finish_reason === 'length') truncated = true;
  } else {
    if (typeof json.output_text === 'string') text = json.output_text;
    if (!text && typeof json.content === 'string') text = json.content;
    consumeChatMessage(json.message);
  }

  return { text, thinking, truncated, toolCalls };
}

/* ============================================================================
   API MESSAGE CONVERSION
   ============================================================================ */
function convertMessagesForOpenAIChat(messages, systemPrompt, includeSystem, imageAttachments) {
  const out = [];
  if (includeSystem && systemPrompt) out.push({ role: 'system', content: systemPrompt });
  messages.forEach((m, idx) => {
    const isLast = idx === messages.length - 1;
    if (m.role === 'user') {
      if (isLast && imageAttachments && imageAttachments.length) {
        const contentParts = [{ type: 'text', text: m.content }];
        imageAttachments.forEach(img => contentParts.push({ type: 'image_url', image_url: { url: img } }));
        out.push({ role: 'user', content: contentParts });
      } else {
        out.push({ role: 'user', content: m.content });
      }
    } else if (m.role === 'assistant') {
      if (m.toolCalls && m.toolCalls.length) {
        out.push({
          role: 'assistant',
          content: m.content || null,
          tool_calls: m.toolCalls.map(tc => ({
            id: tc.id,
            type: 'function',
            function: { name: tc.name, arguments: JSON.stringify(tc.args || {}) }
          }))
        });
      } else {
        out.push({ role: 'assistant', content: m.content });
      }
    } else if (m.role === 'tool') {
      out.push({ role: 'tool', tool_call_id: m.toolCallId, content: m.content });
    }
  });
  return out;
}

function convertMessagesForOpenAIResponses(messages, systemPrompt, includeSystem, imageAttachments) {
  const input = [];
  messages.forEach((m, idx) => {
    const isLast = idx === messages.length - 1;
    if (m.role === 'user') {
      const content = [{ type: 'input_text', text: m.content }];
      if (isLast && imageAttachments && imageAttachments.length) {
        imageAttachments.forEach(img => content.push({ type: 'input_image', image_url: img }));
      }
      input.push({ type: 'message', role: 'user', content });
    } else if (m.role === 'assistant') {
      if (m.content) input.push({ type: 'message', role: 'assistant', content: [{ type: 'output_text', text: m.content }] });
      if (m.toolCalls) {
        for (const tc of m.toolCalls) {
          input.push({ type: 'function_call', call_id: tc.id, name: tc.name, arguments: JSON.stringify(tc.args || {}) });
        }
      }
    } else if (m.role === 'tool') {
      input.push({ type: 'function_call_output', call_id: m.toolCallId, output: m.content });
    }
  });
  const body = { input };
  if (includeSystem && systemPrompt) body.instructions = systemPrompt;
  return body;
}

function convertMessagesForGemini(messages, systemPrompt, includeSystem, imageAttachments) {
  const contents = [];
  messages.forEach((m, idx) => {
    const isLast = idx === messages.length - 1;
    if (m.role === 'user') {
      const parts = [{ text: m.content }];
      if (isLast && imageAttachments && imageAttachments.length) {
        imageAttachments.forEach(img => {
          const match = img.match(/^data:([^;]+);base64,(.+)$/);
          if (match) parts.push({ inlineData: { mimeType: match[1], data: match[2] } });
        });
      }
      contents.push({ role: 'user', parts });
    } else if (m.role === 'assistant') {
      const parts = [];
      if (m.content) parts.push({ text: m.content });
      if (m.toolCalls) {
        for (const tc of m.toolCalls) parts.push({ functionCall: { name: tc.name, args: tc.args || {} } });
      }
      if (parts.length) contents.push({ role: 'model', parts });
    } else if (m.role === 'tool') {
      contents.push({ role: 'user', parts: [{ functionResponse: { name: m.name, response: { output: m.content } } }] });
    }
  });
  const body = { contents };
  if (includeSystem && systemPrompt) body.systemInstruction = { parts: [{ text: systemPrompt }] };
  return body;
}

function convertMessagesForAnthropic(messages, systemPrompt, includeSystem, imageAttachments) {
  const out = [];
  messages.forEach((m, idx) => {
    const isLast = idx === messages.length - 1;
    if (m.role === 'user') {
      if (isLast && imageAttachments && imageAttachments.length) {
        const contentParts = [{ type: 'text', text: m.content }];
        imageAttachments.forEach(img => contentParts.push({ type: 'image_url', image_url: { url: img } }));
        out.push({ role: 'user', content: contentParts });
      } else {
        out.push({ role: 'user', content: m.content });
      }
    } else if (m.role === 'assistant') {
      const blocks = [];
      if (m.content) blocks.push({ type: 'text', text: m.content });
      if (m.toolCalls) {
        for (const tc of m.toolCalls) {
          blocks.push({ type: 'tool_use', id: tc.id, name: tc.name, input: tc.args || {} });
        }
      }
      if (blocks.length) out.push({ role: 'assistant', content: blocks });
    } else if (m.role === 'tool') {
      out.push({ role: 'user', content: [{ type: 'tool_result', tool_use_id: m.toolCallId, content: m.content }] });
    }
  });
  const body = { messages: out };
  if (includeSystem && systemPrompt) body.system = systemPrompt;
  return body;
}

/* ============================================================================
   FETCH RESPONSE
   ============================================================================ */
async function fetchModelResponse(config, messages, reasoning, attachments, opts = {}) {
  const stream = opts.stream !== false;
  const endpoint = config.endpoint;
  const apiType = config.apiType || 'openai-chat';
  const systemPrompt = getSystemPrompt(config);
  const authHeaders = getAuthHeaders(config);

  // Split attachments
  let textContext = '';
  const imageAttachments = [];
  (attachments || []).forEach(att => {
    if (att.type === 'text') textContext += `\n\n--- Attached File: ${att.name} ---\n${att.content}`;
    else if (att.type === 'image') imageAttachments.push(att.content);
  });

  // Clone messages and append textContext to last user message
  const augmented = messages.map(m => ({ ...m }));
  if (textContext) {
    const lastUser = [...augmented].reverse().find(m => m.role === 'user');
    if (lastUser) lastUser.content = (lastUser.content || '') + textContext;
  }

  const defaultInclude = apiType === 'openai-responses' ? false : true;
  const includeInstructions = config.includeInstructions !== undefined
    ? config.includeInstructions === true
    : defaultInclude;

  const tools = getToolsForAPI(apiType);
  const hasTools = tools.length > 0 && config.enableTools !== false;

  let body = {};

  if (apiType === 'openai-chat') {
    const gMessages = convertMessagesForOpenAIChat(augmented, systemPrompt, includeInstructions, imageAttachments);
    body = { messages: gMessages, stream };
    if (config.sendModelInBody) body.model = config.id;
    if (config.supportsReasoningEffort && reasoning) body.reasoning_effort = reasoning;
    if (config.includeThoughts) body.include_thoughts = true;
    if (hasTools) body.tools = tools;
    if (config.maxOutputTokens) body.max_tokens = config.maxOutputTokens;
  } else if (apiType === 'openai-responses') {
    const converted = convertMessagesForOpenAIResponses(augmented, systemPrompt, includeInstructions, imageAttachments);
    body = { stream, ...converted };
    if (config.sendModelInBody !== false) body.model = config.id;
    if (config.supportsReasoningEffort && reasoning) body.reasoning = { effort: reasoning };
    if (hasTools) body.tools = tools;
    if (config.maxOutputTokens) body.max_output_tokens = config.maxOutputTokens;
  } else if (apiType === 'gemini-native') {
    const converted = convertMessagesForGemini(augmented, systemPrompt, includeInstructions, imageAttachments);
    body = {
      ...converted,
      stream: true,
      generationConfig: {
        thinkingConfig: { includeThoughts: config.includeThoughts !== false, thinkingLevel: reasoning }
      }
    };
    if (hasTools) body.tools = tools;
  } else if (apiType === 'anthropic') {
    const converted = convertMessagesForAnthropic(augmented, systemPrompt, includeInstructions, imageAttachments);
    const maxTokensMap = config.maxTokens || { minimal: 8192, low: 12288, medium: 16384, high: 24576, max: 32000 };
    const maxTokens = maxTokensMap[reasoning] || config.maxOutputTokens || 32000;
    body = {
      model: config.id,
      ...converted,
      max_tokens: maxTokens,
      stream
    };
    if (!hasTools) body.thinkingFlag = true;
    if (hasTools) body.tools = tools;
  } else {
    throw new Error(`Unknown apiType: ${apiType}`);
  }

  const headers = { ...authHeaders, 'Content-Type': 'application/json' };
  const res = await fetch(endpoint, {
    method: 'POST',
    headers,
    body: JSON.stringify(body),
    signal: state.abortController.signal
  });

  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    if (stream && res.status >= 400 && res.status < 500 && /stream/i.test(errText)) {
      return fetchModelResponse(config, messages, reasoning, attachments, { stream: false });
    }
    throw new Error(`HTTP ${res.status}: ${errText.slice(0, 300)}`);
  }
  return res;
}

/* ============================================================================
   GENERATE RESPONSE (with tool loop)
   ============================================================================ */
async function generateResponse() {
  if (state.isGenerating) {
    if (state.abortController) state.abortController.abort();
    return;
  }
  const text = chatInput.value.trim();
  if (!text && state.attachments.length === 0) return;
  if (!state.model) return;

  state.isGenerating = true;
  chatInput.value = '';
  chatInput.style.height = 'auto';
  sendIcon.style.display = 'none';
  stopIcon.style.display = 'block';
  sendBtn.classList.add('stop-mode');
  sendBtn.disabled = false;
  inputWrapper.classList.add('generating');
  updateSendBtn();

  addUserMessage(text, state.attachments);
  state.messages.push({ role: 'user', content: text });

  const currentAttachments = [...state.attachments];
  state.attachments = [];
  renderAttachments();

  const { bubble, avatar } = createAssistantRow();

  let rawText = '';
  let hasThinking = false;
  let thinkingPanel = null;
  let thinkingBody = null;
  let thinkingTimeEl = null;
  let thinkingTimer = null;
  let thinkingStart = 0;

  // Per-round content containers
  let currentContentDiv = null;
  let currentRenderState = null;
  let currentRoundText = '';
  let renderTimer = null;
  let pendingThinking = false;

  state.abortController = new AbortController();
  const signal = state.abortController.signal;

  function removeWaiting() {
    const w = bubble.querySelector('.waiting-indicator');
    if (w) w.remove();
  }
  function ensureThinkingPanel() {
    if (thinkingPanel) return;
    removeWaiting();
    thinkingPanel = createThinkingPanel();
    thinkingBody = thinkingPanel.querySelector('.thinking-body');
    thinkingTimeEl = thinkingPanel.querySelector('.thinking-time');
    thinkingStart = performance.now();
    thinkingTimer = setInterval(() => {
      if (thinkingTimeEl) thinkingTimeEl.textContent = ((performance.now() - thinkingStart) / 1000).toFixed(1) + 's';
    }, 100);
    bubble.insertBefore(thinkingPanel, bubble.firstChild);
  }
  function ensureContentDiv() {
    if (currentContentDiv) return;
    removeWaiting();
    currentContentDiv = document.createElement('div');
    currentContentDiv.className = 'content';
    currentRenderState = { renderedParts: [] };
    currentRoundText = '';
    bubble.appendChild(currentContentDiv);
  }
  function scheduleContentRender() {
    if (renderTimer) return;
    renderTimer = setTimeout(() => {
      renderTimer = null;
      if (!currentContentDiv) return;
      updateStreamingContent(currentContentDiv, currentRoundText, currentRenderState);
      ensureCursor(currentContentDiv);
      scrollToBottom();
    }, 30);
  }
  function finalizeCurrentRound() {
    if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
    if (currentContentDiv) {
      removeCursor(currentContentDiv);
      finalizeContent(currentContentDiv, currentRoundText, currentRenderState);
      autoSyncCodeBlocksToVFS(currentRoundText);
    }
    currentContentDiv = null;
    currentRenderState = null;
    currentRoundText = '';
  }
  function finalizeThinking(forceCollapse = true) {
    if (!thinkingPanel || thinkingPanel.dataset.finalized) return;
    thinkingPanel.dataset.finalized = 'true';
    thinkingPanel.classList.add('done');
    if (thinkingTimer) { clearInterval(thinkingTimer); thinkingTimer = null; }
    const elapsed = thinkingStart ? ((performance.now() - thinkingStart) / 1000) : 0;
    const userWantsExpanded = thinkingPanel.dataset.userExpanded === 'true';
    if (forceCollapse && !userWantsExpanded) thinkingPanel.classList.remove('expanded');
    const label = thinkingPanel.querySelector('.thinking-label');
    if (label) {
      label.innerHTML = `<svg class="thought-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><path d="M20 6L9 17l-5-5"/></svg><span class="thinking-text">Thought for ${elapsed.toFixed(1)}s</span>`;
    }
    avatar.classList.remove('thinking');
  }
  function onThinking(chunk) {
    if (!chunk) return;
    if (!hasThinking) { hasThinking = true; ensureThinkingPanel(); avatar.classList.add('thinking'); }
    if (pendingThinking) return;
    pendingThinking = true;
    requestAnimationFrame(() => {
      pendingThinking = false;
      if (thinkingBody) {
        thinkingBody.textContent += chunk;
        const wrapper = thinkingBody.parentElement;
        if (wrapper && thinkingPanel && thinkingPanel.classList.contains('expanded')) {
          const nearBottom = wrapper.scrollHeight - wrapper.scrollTop - wrapper.clientHeight < 40;
          if (nearBottom) wrapper.scrollTop = wrapper.scrollHeight;
        }
      }
      scrollToBottom();
    });
  }
  function onContent(chunk) {
    if (!chunk) return;
    rawText += chunk;
    ensureContentDiv();
    currentRoundText += chunk;
    scheduleContentRender();
    if (hasThinking) finalizeThinking();
  }

  try {
    const config = MODEL_CONFIG[state.model];
    let toolLoops = 0;
    let continuationAttempts = 0;
    let finalResult = null;
    let finalWasRound = false;

    while (true) {
      if (signal.aborted) throw abortError();

      const sendAttachments = (toolLoops === 0 && continuationAttempts === 0) ? currentAttachments : [];
      const response = await fetchModelResponse(config, state.messages, state.reasoning, sendAttachments);
      const contentType = (response.headers.get('content-type') || '').toLowerCase();
      let result;

      if (contentType.includes('text/event-stream') && response.body) {
        result = await processStreamingResponse(response, config.apiType, { onContent, onThinking });
      } else {
        const json = await response.json();
        result = extractFromJson(json, config.apiType);
        if (result.thinking) await typewriterReveal(result.thinking, onThinking, signal, { maxDuration: 1600 });
        if (signal.aborted) throw abortError();
        if (result.text) await typewriterReveal(result.text, onContent, signal);
        if (signal.aborted) throw abortError();
      }

      // Finalize this round's content display
      finalizeCurrentRound();

      // Tool calls?
      if (result.toolCalls && result.toolCalls.length) {
        if (++toolLoops > MAX_TOOL_LOOPS) {
          finalResult = { text: rawText + '\n\n*[Stopped: too many tool calls]*' };
          finalWasRound = true;
          break;
        }

        // Show tool chips
        const chipsList = document.createElement('div');
        chipsList.className = 'tool-calls-list';
        bubble.appendChild(chipsList);
        const chipEls = result.toolCalls.map(tc => {
          const chip = createToolChip(tc.name, tc.args);
          chipsList.appendChild(chip);
          return chip;
        });
        scrollToBottom();

        // Push to state.messages
        state.messages.push({
          role: 'assistant',
          content: result.text || '',
          toolCalls: result.toolCalls
        });

        // Execute tools sequentially
        for (let i = 0; i < result.toolCalls.length; i++) {
          const tc = result.toolCalls[i];
          const output = await executeTool(tc.name, tc.args);
          const chip = chipEls[i];
          const ok = !/^Error:/i.test(output);
          setToolChipResult(chip, output, ok);
          state.messages.push({
            role: 'tool',
            toolCallId: tc.id,
            name: tc.name,
            content: output
          });
        }

        // Reset for next round
        finalResult = null;
        finalWasRound = false;
        continue;
      }

      // Truncation retry?
      if (result.truncated && continuationAttempts < MAX_CONTINUATIONS) {
        continuationAttempts++;
        state.messages.push({ role: 'assistant', content: result.text || '' });
        state.messages.push({ role: 'user', content: 'Continue exactly where you stopped. Do not repeat any previous content. Output only the continuation.' });
        finalResult = null;
        finalWasRound = false;
        continue;
      }

      // Done
      finalResult = result;
      finalWasRound = true;
      if (result.text) {
        state.messages.push({ role: 'assistant', content: result.text });
      }
      break;
    }

    if (finalResult && finalWasRound && finalResult.text) {
      // nothing extra needed
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      rawText = rawText ? rawText + '\n\n*[Generation stopped]*' : '*[Generation stopped]*';
    } else {
      console.error(err);
      const errMsg = `⚠️ **Error:** ${err.message}`;
      rawText = rawText ? rawText + '\n\n' + errMsg : errMsg;
    }
    // Render error text into a fresh content div
    if (!currentContentDiv) {
      currentContentDiv = document.createElement('div');
      currentContentDiv.className = 'content';
      currentRenderState = { renderedParts: [] };
      bubble.appendChild(currentContentDiv);
    }
    currentRoundText = rawText;
    removeCursor(currentContentDiv);
    finalizeContent(currentContentDiv, currentRoundText, currentRenderState);
    currentContentDiv = null;
  } finally {
    if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
    if (thinkingTimer) { clearInterval(thinkingTimer); thinkingTimer = null; }
    removeWaiting();
    if (currentContentDiv) {
      removeCursor(currentContentDiv);
      finalizeContent(currentContentDiv, currentRoundText, currentRenderState);
      autoSyncCodeBlocksToVFS(currentRoundText);
    }
    if (hasThinking) finalizeThinking();
    avatar.classList.remove('thinking');

    if (rawText.trim()) addMessageActions(bubble, rawText);

    state.isGenerating = false;
    state.abortController = null;
    inputWrapper.classList.remove('generating');
    sendIcon.style.display = 'block';
    stopIcon.style.display = 'none';
    sendBtn.classList.remove('stop-mode');
    updateSendBtn();
    chatInput.focus();
    scrollToBottom(true);
    updateScrollBtn();
  }
}

/* ============================================================================
   EVENTS
   ============================================================================ */
sendBtn.addEventListener('click', generateResponse);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    if (state.isGenerating) return;
    generateResponse();
  }
});
chatInput.addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 200) + 'px';
  updateSendBtn();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    modelDropdown.classList.remove('active');
    modelBtn.classList.remove('active');
    sidebar.classList.remove('active');
    sidebarOverlay.classList.remove('active');
    previewModal.classList.remove('open');
  }
});

/* ============================================================================
   BOOTSTRAP
   ============================================================================ */
async function loadConfig() {
  try {
    if (location.protocol === 'file:') throw new Error('file:// protocol — local fetch blocked');
    const res = await fetch('models.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!data || !Array.isArray(data.models) || data.models.length === 0) throw new Error('models.json missing models array');
    console.log('[LocalMind] Loaded models.json —', data.models.length, 'model(s)');
    return data;
  } catch (err) {
    console.warn('[LocalMind] models.json load failed — using built-in fallback:', err.message);
    return DEFAULT_CONFIG;
  }
}

async function init() {
  const cfg = await loadConfig();
  SETTINGS = cfg.settings || {};
  MODELS_LIST = cfg.models;
  MODEL_CONFIG = {};
  MODELS_LIST.forEach(m => { MODEL_CONFIG[m.key] = m; });

  applySettings();
  populateModelDropdown();

  const defaultKey = (SETTINGS.defaultModel && MODEL_CONFIG[SETTINGS.defaultModel])
    ? SETTINGS.defaultModel
    : MODELS_LIST[0].key;

  setMode('coding');
  selectModel(defaultKey);
  renderWorkspaceFiles();
  chatInput.focus();
  updateSendBtn();
}

init().catch(err => {
  console.error('[LocalMind] Init failed:', err);
});
</script>
