<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>LocalMind · Agent Workspace</title>
<link rel="icon" type="image/png" href="icon.png" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg-base: #0e0d0c;
    --bg-surface: #1a1817;
    --bg-input: #23201e;
    --border: #332d2a;
    --border-focus: #4a3f39;
    --text-main: #f2ebe6;
    --text-muted: #9c8d83;
    --accent: #d97757;
    --accent-hover: #e88a6c;
    --accent-glow: rgba(217, 119, 87, 0.15);
    --danger: #ef4444;
/* ── developed by ardy and deepseek for bug fixing and giving notes and help, ty deepseek ── */
    --font-ui: 'Inter', -apple-system, sans-serif;
    --font-serif: 'Lora', Georgia, serif;
    --font-mono: 'JetBrains Mono', monospace;

    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100dvh;
    width: 100vw;
    background-color: var(--bg-base);
    color: var(--text-main);
    font-family: var(--font-ui);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.4s ease;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 0%, rgba(217, 119, 87, 0.03) 0%, transparent 50%),
      radial-gradient(circle at 50% 100%, rgba(180, 140, 100, 0.02) 0%, transparent 50%);
    z-index: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: url('bg.png') center / cover no-repeat;
    opacity: 0.10;
    z-index: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    filter: saturate(0.9);
  }

  body.mode-coding {
    --bg-base: #0a0a0b;
    --bg-surface: #121316;
    --bg-input: #191a1e;
    --border: #282a30;
    --border-focus: #3f424b;
    --text-main: #e2e8f0;
    --text-muted: #8a9bb0;
  }
  body.mode-coding::before {
    background: radial-gradient(circle at 50% 0%, rgba(66, 133, 244, 0.04) 0%, transparent 60%);
  }
  body.mode-coding::after { opacity: 0.09; }
  body.mode-coding .welcome-title {
    font-family: var(--font-serif);
    font-weight: 400;
    letter-spacing: -0.02em;
  }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100vw;
    max-width: 960px;
    margin: 0 auto;
  }

  /* ── Hamburger & Sidebar mmmmm... yummy ── */
  .hamburger {
    position: absolute;
    top: calc(16px + var(--safe-top));
    left: 16px;
    z-index: 50;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 40px;
    height: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .hamburger:hover { background: #1e2024; border-color: var(--border-focus); }
  .hamburger span {
    display: block;
    width: 18px;
    height: 2px;
    background: var(--text-main);
    border-radius: 2px;
    transition: 0.2s;
  }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 280px;
    background: var(--bg-surface);
    border-right: 1px solid var(--border);
    z-index: 70;
    transform: translateX(-100%);
    transition: transform 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    padding: calc(24px + var(--safe-top)) 16px calc(24px + var(--safe-bottom)) 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sidebar.active { transform: translateX(0); }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 8px 18px 8px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-brand img {
    width: 24px;
    height: 24px;
    object-fit: contain;
    opacity: 0.9;
    filter: drop-shadow(0 2px 6px rgba(217,119,87,0.25));
  }
  .sidebar-brand span {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.2px;
    color: var(--text-main);
  }

  .sidebar h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 12px;
    padding-left: 8px;
  }
  .sidebar-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-main);
    font-family: var(--font-ui);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    width: 100%;
  }
  .sidebar-option:hover { background: rgba(255,255,255,0.04); }
  .sidebar-option.active {
    background: rgba(217, 119, 87, 0.08);
    border-color: rgba(217, 119, 87, 0.2);
  }
  .sidebar-option .icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    opacity: 0.8;
  }
  .sidebar-option .desc {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ── Chat Area ── */
  .chat-scroll-area {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: calc(40px + var(--safe-top)) 24px calc(180px + var(--safe-bottom)) 24px;
    display: flex;
    flex-direction: column;
    gap: 32px;
    scroll-behavior: smooth;
    position: relative;
    z-index: 2;
    -webkit-overflow-scrolling: touch;
  }

  .welcome-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .welcome-container.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-20px);
    position: absolute;
  }
  .welcome-icon {
    width: 72px;
    height: 72px;
    margin-bottom: 22px;
    object-fit: contain;
    opacity: 0.85;
    filter: drop-shadow(0 8px 28px rgba(217,119,87,0.22));
  }
  .welcome-title {
    font-family: var(--font-serif);
    font-size: 42px;
    font-weight: 400;
    letter-spacing: -0.5px;
    color: var(--text-main);
    text-align: center;
    margin-bottom: 16px;
  }
  .welcome-subtitle {
    font-size: 15px;
    color: var(--text-muted);
    text-align: center;
    max-width: 440px;
    line-height: 1.6;
  }

  .message-row {
    display: flex;
    width: 100%;
    gap: 18px;
    animation: slideUp 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    opacity: 0;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message-row.user { justify-content: flex-end; }

  .msg-avatar {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
    background: transparent;
    border: none;
    box-shadow: none;
    border-radius: 0;
    overflow: visible;
    position: relative;
  }
  .msg-avatar img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(217, 119, 87, 0.25));
  }
  .msg-avatar > svg {
    width: 24px;
    height: 24px;
    color: var(--accent);
  }
  .msg-avatar.thinking img {
    animation: avatarGlow 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 12px rgba(217, 119, 87, 0.7));
  }
  @keyframes avatarGlow {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; }
  }
  .message-row.user .msg-avatar { display: none; }

  .bubble {
    line-height: 1.7;
    font-size: 16px;
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 85%;
    width: fit-content;
  }
  .message-row.user .bubble {
    background: var(--bg-surface);
    padding: 14px 20px;
    border-radius: 18px;
    border-bottom-right-radius: 4px;
    border: 1px solid var(--border);
    font-size: 15px;
  }
  .message-row.assistant .bubble {
    background: transparent;
    padding: 4px 0;
    max-width: 100%;
    white-space: normal;
    width: 100%;
  }

  /* ── Markdown Text ── */
  .content { word-break: break-word; }
  .md-block { margin: 0; }
  .md-text {
    white-space: normal;
    word-break: break-word;
    line-height: 1.7;
    font-size: 16px;
  }
  .md-text > *:first-child { margin-top: 0; }
  .md-text > *:last-child { margin-bottom: 0; }
  .md-text p { margin: 0 0 12px; }
  .md-text ul, .md-text ol { margin: 4px 0 12px; padding-left: 22px; }
  .md-text li { margin-bottom: 4px; }
  .md-text h1, .md-text h2, .md-text h3, .md-text h4, .md-text h5, .md-text h6 {
    margin: 18px 0 8px; font-weight: 600; line-height: 1.3;
  }
  .md-text h1 { font-size: 22px; }
  .md-text h2 { font-size: 19px; }
  .md-text h3 { font-size: 17px; }
  .md-text h4 { font-size: 16px; }
  .md-text blockquote {
    margin: 8px 0; padding-left: 14px;
    border-left: 3px solid var(--border-focus);
    color: var(--text-muted);
  }
  .md-text hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .md-text code.inline-code {
    background: rgba(255,255,255,0.08);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 13px;
  }
  .md-text a { color: var(--accent); text-decoration: none; }
  .md-text a:hover { text-decoration: underline; }

  /* ── Streaming Cursor ── */
  .stream-cursor {
    display: inline-block;
    color: var(--accent);
    font-size: 14px;
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── Waiting Indicator ── */
  .waiting-indicator {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    font-size: 14px;
    height: 24px;
    min-width: 0;
  }
  .waiting-indicator span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .waiting-indicator .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Thinking Panel ── */
  .thinking-panel {
    margin: 2px 0 14px 0;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.015);
    border: 1px solid var(--border);
    overflow: hidden;
    animation: thinkIn 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    width: 100%;
    max-width: 100%;
    backdrop-filter: blur(2px);
  }
  @keyframes thinkIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .thinking-header {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 11px 14px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    text-align: left;
    transition: background 0.2s;
    white-space: normal;
  }
  .thinking-header:hover { background: rgba(255, 255, 255, 0.03); }
  .thinking-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .thinking-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    animation: thinkingPulse 1.4s ease-in-out infinite;
  }
  @keyframes thinkingPulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(217, 119, 87, 0.45); }
    50% { opacity: 0.5; box-shadow: 0 0 0 6px rgba(217, 119, 87, 0); }
  }
  .thinking-time {
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    opacity: 0.75;
    margin-left: 2px;
    font-family: var(--font-mono);
    flex-shrink: 0;
  }
  .thinking-chevron {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    opacity: 0.7;
    transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  .thinking-panel.expanded .thinking-chevron {
    transform: rotate(180deg);
  }
  .thought-check {
    color: var(--accent);
    flex-shrink: 0;
  }
  .thinking-body-wrapper {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.42s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  .thinking-panel.expanded .thinking-body-wrapper {
    max-height: min(400px, 50vh);
    overflow-y: auto;
  }
  .thinking-body-wrapper::-webkit-scrollbar { width: 6px; }
  .thinking-body-wrapper::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }
  .thinking-body {
    padding: 0 14px 13px 14px;
    font-size: 13px;
    line-height: 1.65;
    color: #a0aab8;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--font-mono);
  }
  .thinking-panel.done .thinking-dot { display: none; }

  /* ── Tool Call Cards ── */
  .tool-call-card {
    margin: 10px 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: rgba(255,255,255,0.02);
    overflow: hidden;
    animation: slideUp 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  .tool-call-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    font-family: var(--font-mono);
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .tool-call-header.running { color: var(--accent); }
  .tool-call-header.running .tool-icon { animation: spin 1s linear infinite; }
  .tool-call-header .tool-icon { flex-shrink: 0; }
  .tool-call-header .tool-name {
    font-weight: 600;
    color: var(--text-main);
    flex-shrink: 0;
  }
  .tool-call-header.running .tool-name { color: var(--accent); }
  .tool-call-header .tool-args {
    color: var(--text-muted);
    opacity: 0.7;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }
  .tool-call-header .tool-chevron {
    width: 12px;
    height: 12px;
    flex-shrink: 0;
    opacity: 0.6;
    transition: transform 0.3s;
  }
  .tool-call-card.expanded .tool-chevron { transform: rotate(180deg); }
  .tool-call-body {
    display: none;
    padding: 8px 12px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 260px;
    overflow-y: auto;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.18);
    color: #b0a89f;
    line-height: 1.5;
  }
  .tool-call-card.expanded .tool-call-body { display: block; }

  /* ── Code Blocks ── */
  .code-block-wrapper {
    margin: 12px 0;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #0d0c0b;
  }
  .code-block-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px 12px 8px 16px;
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    flex-wrap: wrap;
  }
  .code-lang {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .code-block-wrapper.streaming .code-lang::after {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: thinkingPulse 1.2s ease-in-out infinite;
    flex-shrink: 0;
  }
  .code-actions {
    display: flex;
    gap: 4px;
    align-items: center;
    flex-wrap: wrap;
  }
  .code-action-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    font-family: var(--font-ui);
    transition: all 0.15s;
    white-space: nowrap;
  }
  .code-action-btn:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text-main);
    border-color: var(--border);
  }
  .code-action-btn.copied { color: #4ade80; }
  .code-block-wrapper pre {
    margin: 0;
    padding: 16px;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.5;
  }
  .code-block-wrapper code { font-family: var(--font-mono); }

  /* ── Message Actions ── */
  .message-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .msg-action-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-family: var(--font-ui);
    cursor: pointer;
    transition: all 0.2s;
  }
  .msg-action-btn:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text-main);
    border-color: var(--border-focus);
  }
  .msg-action-btn.copied {
    color: #4ade80;
    border-color: rgba(74, 222, 128, 0.35);
  }
  .msg-action-btn svg { width: 14px; height: 14px; }

  /* ── Bottom Bar (fixed full-width) ── */
  .bottom-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 20px max(24px, var(--safe-right)) calc(24px + var(--safe-bottom)) max(24px, var(--safe-left));
    background: linear-gradient(0deg, var(--bg-base) 70%, transparent 100%);
    display: flex;
    justify-content: center;
    z-index: 3;
    pointer-events: none;
  }
  .bottom-bar > * { pointer-events: auto; }
  .input-wrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
  }
  .input-wrapper.disabled { opacity: 0.6; cursor: not-allowed; }
  .input-wrapper:focus-within:not(.disabled) {
    border-color: var(--border-focus);
    box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 0 3px var(--accent-glow);
  }
  .input-wrapper.generating {
    border-color: rgba(217, 119, 87, 0.35);
    animation: inputGlow 2.4s ease-in-out infinite;
  }
  @keyframes inputGlow {
    0%, 100% { box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 0 2px rgba(217,119,87,0.07); }
    50% { box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 0 3px rgba(217,119,87,0.16); }
  }
  .input-wrapper.generating::before {

  /* ============================================================

  const vfs = {

  const zipStore = new Map();

  /* ============================================================
     TOOL DEFINITIONS
     ============================================================ */
  function getToolDefinitions(mode) {
    const tools = [];

        { type: 'function', function: {
          name: 'list_files',

            type: 'object',
            properties: { path: { type: 'string', description: 'File path (e.g. "index.html")' } },

          }

            type: 'object',
            properties: {
              path: { type: 'string' },

            required: ['path', 'content']
          }
        }},

          name: 'edit_file',
          description: 'Surgically replace an exact string in a file with a new string. The old_string must appear exactly once. Use this to modify files WITHOUT rewriting them.',
          parameters: {
            type: 'object',
            properties: {
              path: { type: 'string' },
              old_string: { type: 'string', description: 'The exact substring to find (must be unique)' },
              new_string: { type: 'string', description: 'The replacement text' }
            },
            required: ['path', 'old_string', 'new_string']
          }
        }},
        { type: 'function', function: {
          name: 'delete_file',
          description: 'Delete a file from the workspace.',
          parameters: {
            type: 'object',
            properties: { path: { type: 'string' } },
            required: ['path']
          }
        }},
        { type: 'function', function: {
          name: 'run_javascript',
          description: 'Execute JavaScript in a sandboxed iframe and return console.log output and any return value. Useful for testing logic before shipping.',
          parameters: {
            type: 'object',
            properties: { code: { type: 'string' } },
            required: ['code']
          }
        }},
        { type: 'function', function: {
          name: 'open_zip',
          description: 'Re-extract an attached .zip file into the workspace (usually already extracted on attach).',
          parameters: {
            type: 'object',
            properties: { name: { type: 'string' } },
            required: ['name']
          }
        }},
        { type: 'function', function: {
          name: 'preview_html',
          description: 'Open a workspace HTML file in the preview modal, auto-inlining local CSS/JS.',
          parameters: {
            type: 'object',
            properties: { path: { type: 'string' } },
            required: ['path']
          }
        }}
      );
    }
    tools.push(
      { type: 'function', function: {
        name: 'web_search',
        description: 'Search the web for current information. Returns snippets and source URLs.',
        parameters: {
          type: 'object',
          properties: { query: { type: 'string' } },
          required: ['query']
        }
      }},
      { type: 'function', function: {
        name: 'fetch_url',
        description: 'Fetch the text content of a URL (returns up to ~8KB). Useful for reading documentation or articles.',
        parameters: {
          type: 'object',
          properties: { url: { type: 'string' } },
          required: ['url']
        }
      }}
    );
    return tools;
  }

  function toolsForApi(tools, apiType) {
    if (!tools.length) return null;
    switch (apiType) {
      case 'openai-chat':
        return tools;
      case 'openai-responses':
        return tools.map(t => ({
          type: 'function',
          name: t.function.name,
          description: t.function.description,
          parameters: t.function.parameters
        }));
      case 'gemini-native':
        return [{
          functionDeclarations: tools.map(t => ({
            name: t.function.name,
            description: t.function.description,
            parameters: t.function.parameters
          }))
        }];
      case 'anthropic':
        return tools.map(t => ({
          name: t.function.name,
          description: t.function.description,
          input_schema: t.function.parameters
        }));
      default:
        return null;
    }
  }

  /* ============================================================
     TOOL EXECUTION
     ============================================================ */
  const TOOL_RESULT_MAX = 100000;

  async function executeTool(name, argsStr) {
    let args;
    try {
      args = typeof argsStr === 'string' ? JSON.parse(argsStr || '{}') : (argsStr || {});
    } catch (e) {
      return `Error: invalid JSON arguments (${e.message})`;
    }
    if (!args || typeof args !== 'object') args = {};
    try {
      switch (name) {
        case 'list_files': {
          if (vfs.size() === 0) return 'Workspace is empty.';
          return vfs.list().map(f => `- ${f} (${vfs.read(f).length} chars)`).join('\n');
        }
        case 'read_file': {
          if (!vfs.exists(args.path)) return `Error: file "${args.path}" not found. Available: ${vfs.list().join(', ') || '(none)'}`;
          const content = vfs.read(args.path);
          if (content.length > TOOL_RESULT_MAX) {
            return content.slice(0, TOOL_RESULT_MAX) + `\n\n[...truncated, ${content.length - TOOL_RESULT_MAX} chars omitted]`;
          }
          return content;
        }
        case 'write_file': {
          vfs.write(args.path, args.content ?? '');
          return `Wrote ${(args.content || '').length} chars to ${args.path}`;
        }
        case 'edit_file': {
          if (!vfs.exists(args.path)) return `Error: file "${args.path}" not found.`;
          const content = vfs.read(args.path);
          const oldS = args.old_string ?? '';
          const newS = args.new_string ?? '';
          if (!oldS) return 'Error: old_string is empty';
          const count = content.split(oldS).length - 1;
          if (count === 0) return `Error: old_string not found in ${args.path}`;
          if (count > 1) return `Error: old_string appears ${count} times in ${args.path} — must be unique. Include more surrounding context.`;
          vfs.write(args.path, content.replace(oldS, newS));
          return `Edited ${args.path}`;
        }
        case 'delete_file': {
          if (!vfs.exists(args.path)) return `Error: file "${args.path}" not found.`;
          vfs.delete(args.path);
          return `Deleted ${args.path}`;
        }
        case 'run_javascript': {
          return await runJsSandbox(args.code || '');
        }
        case 'open_zip': {
          const data = zipStore.get(args.name);
          if (!data) return `Error: zip "${args.name}" not in store. Attached zips: ${Array.from(zipStore.keys()).join(', ') || '(none)'}`;
          await extractZipData(data, args.name);
          return `Extracted ${args.name} — workspace now has ${vfs.size()} file(s).`;
        }
        case 'preview_html': {
          if (!vfs.exists(args.path)) return `Error: file "${args.path}" not found.`;
          previewProjectFromVfs(args.path);
          return `Opened preview for ${args.path}`;
        }
        case 'web_search': {
          return await webSearch(args.query || '');
        }
        case 'fetch_url': {
          return await fetchUrl(args.url || '');
        }
        default:
          return `Error: unknown tool "${name}"`;
      }
    } catch (e) {
      return `Error executing ${name}: ${e.message}`;
    }
  }

  async function runJsSandbox(code) {
    return new Promise((resolve) => {
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.sandbox = 'allow-scripts';
      const id = 'sbx_' + Math.random().toString(36).slice(2);
      const safeCode = code.replace(/<\/script/gi, '<\\/script');
      iframe.srcdoc = '<script>\n' +
        'const __logs = [];\n' +
        'console.log = (...a) => { __logs.push(a.map(x => { try { return typeof x === "object" ? JSON.stringify(x) : String(x); } catch(e){ return String(x); } }).join(" ")); };\n' +
        'let __result, __error;\n' +
        'try {\n' +
        '  __result = (function(){\n' + safeCode + '\n  })();\n' +
        '} catch(e) { __error = e.message; }\n' +
        'let __ret = null;\n' +
        'try { __ret = __result === undefined ? null : (typeof __result === "object" ? JSON.stringify(__result) : String(__result)); } catch(e) { __ret = String(__result); }\n' +
        'parent.postMessage({ id: ' + JSON.stringify(id) + ', logs: __logs, error: __error, result: __ret }, "*");\n' +
        '<\/script>';
      const timer = setTimeout(() => {
        window.removeEventListener('message', handler);
        if (iframe.parentNode) iframe.remove();
        resolve('Error: timeout (5s)');
      }, 5000);
      function handler(e) {
        if (!e.data || e.data.id !== id) return;
        clearTimeout(timer);
        window.removeEventListener('message', handler);
        if (iframe.parentNode) iframe.remove();
        const logs = (e.data.logs || []).join('\n');
        if (e.data.error) resolve(`Error: ${e.data.error}\n${logs ? 'Logs:\n' + logs : ''}`);
        else {
          let out = '';
          if (logs) out += logs;
          if (e.data.result !== null && e.data.result !== undefined) out += (out ? '\n' : '') + 'Return: ' + e.data.result;
          resolve(out || 'No output.');
        }
      }
      window.addEventListener('message', handler);
      document.body.appendChild(iframe);
    });
  }

  async function webSearch(query) {
    if (!query.trim()) return 'Error: empty query';
    try {
      const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const results = [];
      if (data.AbstractText) {
        results.push(`Summary: ${data.AbstractText}` + (data.AbstractURL ? `\nSource: ${data.AbstractURL}` : ''));
      }
      if (Array.isArray(data.RelatedTopics)) {
        const pushTopic = (t) => {
          if (t.Text && t.FirstURL) results.push(`- ${t.Text} (${t.FirstURL})`);
        };
        data.RelatedTopics.slice(0, 8).forEach(t => {
          pushTopic(t);
          if (Array.isArray(t.Topics)) t.Topics.slice(0, 3).forEach(pushTopic);
        });
      }
      return results.length ? results.join('\n') : `No results found for "${query}".`;
    } catch (e) {
      return `Search failed: ${e.message}`;
    }
  }

  async function fetchUrl(url) {
    if (!url) return 'Error: empty url';
    const tryFetch = async (u) => {
      const res = await fetch(u);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const txt = await res.text();
      return txt.slice(0, 8000) + (txt.length > 8000 ? '\n...[truncated]' : '');
    };
    try {
      return await tryFetch(url);
    } catch (e) {
      try {
        return await tryFetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
      } catch (e2) {
        return `Fetch failed: ${e2.message}`;
      }
    }
  }

  async function extractZipData(data, name) {
    const zip = await JSZip.loadAsync(data);
    const textExts = /\.(txt|md|html?|js|css|json|py|ts|tsx|jsx|c|cpp|h|hpp|java|cs|go|rs|rb|php|xml|yml|yaml|sh|svg)$/i;
    for (const [path, entry] of Object.entries(zip.files)) {
      if (entry.dir) continue;
      if (!textExts.test(path)) continue;
      const content = await entry.async('string');
      vfs.write(path, content);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function extForLang(lang) {
    const map = {
      html: 'html', htm: 'html', css: 'css', js: 'js', javascript: 'js', jsx: 'jsx',

    return map[(lang || '').toLowerCase()] || 'txt';

  /* ============================================================

     ============================================================ */
  function applySettings() {
    const root = document.documentElement;
    if (SETTINGS.accentColor) root.style.setProperty('--accent', SETTINGS.accentColor);
    if (SETTINGS.accentHoverColor) root.style.setProperty('--accent-hover', SETTINGS.accentHoverColor);
    if (SETTINGS.accentGlow) root.style.setProperty('--accent-glow', SETTINGS.accentGlow);

    let styleTag = document.getElementById('custom-bg-style');
    if (!styleTag) {
      styleTag = document.createElement('style');
      styleTag.id = 'custom-bg-style';
      document.head.appendChild(styleTag);
    }
    let css = '';
    if (SETTINGS.backgroundGradient) css += `body::before { background: ${SETTINGS.backgroundGradient}; }\n`;
    if (SETTINGS.backgroundImageOpacity != null) css += `body::after { opacity: ${SETTINGS.backgroundImageOpacity}; }\n`;
    if (SETTINGS.codingBackgroundGradient) css += `body.mode-coding::before { background: ${SETTINGS.codingBackgroundGradient}; }\n`;
    if (SETTINGS.codingBackgroundImageOpacity != null) css += `body.mode-coding::after { opacity: ${SETTINGS.codingBackgroundImageOpacity}; }\n`;
    styleTag.textContent = css;

    const welcomeIconEl = document.querySelector('.welcome-icon');
    if (welcomeIconEl && SETTINGS.welcome && SETTINGS.welcome.icon) {
      welcomeIconEl.src = SETTINGS.welcome.icon;
    }
  }

  function getAuthHeaders(config) {
    const auth = config.auth || {};
    const header = auth.header || 'Authorization';
    const prefix = auth.prefix !== undefined ? auth.prefix : 'Bearer ';
    const key = auth.key || SETTINGS.apiKey || '';
    return { [header]: prefix + key };
  }

  function getSystemPrompt(config) {
    if (config.systemPrompt && config.systemPrompt[state.mode]) return config.systemPrompt[state.mode];
    if (SETTINGS.systemPrompts && SETTINGS.systemPrompts[state.mode]) return SETTINGS.systemPrompts[state.mode];
    return '';
  }

  function getFullSystemPrompt(config) {
    let p = getSystemPrompt(config);
    if (state.mode === 'coding' && vfs.size() > 0) {
      p += `\n\n=== WORKSPACE (${vfs.size()} file${vfs.size() === 1 ? '' : 's'}) ===\n${vfs.list().map(f => '- ' + f).join('\n')}\n\nUse list_files / read_file / write_file / edit_file / delete_file to manage these. Prefer edit_file for small changes.`;
    }
    return p;
  }

  /* ============================================================
     REASONING CONFIG
     ============================================================ */
  function getReasoningConfig() {
    const config = MODEL_CONFIG[state.model];
    if (!config) return null;
    const r = config.reasoning;
    const hasNewFormat = r && typeof r === 'object' && Array.isArray(r.options) && r.options.length > 0;
    let type, options, defaultVal, codingDefault, simpleDefault;

    if (hasNewFormat) {
      type = r.type || 'pills';
      if (type === 'none') return null;
      options = r.options.map(opt => {
        if (typeof opt === 'string') return { value: opt, label: opt.charAt(0).toUpperCase() + opt.slice(1) };
        return { value: opt.value, label: opt.label || (opt.value.charAt(0).toUpperCase() + opt.value.slice(1)) };
      });
      const midOpt = options[Math.floor((options.length - 1) / 2)];
      defaultVal = r.default && options.some(o => o.value === r.default) ? r.default : (midOpt ? midOpt.value : options[0].value);
      codingDefault = r.codingDefault && options.some(o => o.value === r.codingDefault) ? r.codingDefault : defaultVal;
      simpleDefault = r.simpleDefault && options.some(o => o.value === r.simpleDefault) ? r.simpleDefault : defaultVal;
    } else if (config.reasoningType) {
      type = config.reasoningType;
      if (type === 'none') return null;
      const rawOptions = config.reasoningOptions || ['low', 'medium', 'high'];
      options = rawOptions.map(opt => typeof opt === 'string' ? { value: opt, label: opt.charAt(0).toUpperCase() + opt.slice(1) } : { value: opt.value, label: opt.label || String(opt.value) });
      defaultVal = config.defaultReasoning || 'medium';
      if (type === 'pills') { codingDefault = 'high'; simpleDefault = 'low'; }
      else { const values = options.map(o => o.value); codingDefault = values[values.length - 1] || defaultVal; simpleDefault = values[1] || values[0] || defaultVal; }
    } else return null;

    return { type, options, default: defaultVal, codingDefault, simpleDefault };
  }

     ============================================================ */
  function renderReasoningUI() {
    reasoningContainer.innerHTML = '';
    const r = getReasoningConfig();
    if (!r) return;
    let defaultReasoning;
    if (state.mode === 'coding') defaultReasoning = r.codingDefault;
    else if (state.mode === 'simple') defaultReasoning = r.simpleDefault;
    else defaultReasoning = r.default;
    if (!r.options.some(o => o.value === defaultReasoning)) defaultReasoning = r.options[0].value;
    state.reasoning = defaultReasoning;

    if (r.type === 'slider') {
      const values = r.options.map(o => o.value);
      const labels = r.options.map(o => o.label);
      const maxIdx = values.length - 1;
      const initialIdx = Math.max(0, values.indexOf(defaultReasoning));
      const wrapper = document.createElement('div');
      wrapper.className = 'claude-slider-wrapper';
      const ticksHtml = values.map(() => '<span></span>').join('');
      wrapper.innerHTML =
        '<div class="claude-level-bubble">' + escapeHtml(labels[initialIdx]) + '</div>' +
        '<div class="claude-slider-track">' +
          '<div class="claude-slider-fill"></div>' +
          '<div class="claude-slider-ticks">' + ticksHtml + '</div>' +
        '</div>' +
        '<input type="range" class="claude-slider" min="0" max="' + maxIdx + '" step="1" value="' + initialIdx + '" aria-label="Reasoning effort">';
      const slider = wrapper.querySelector('.claude-slider');
      const bubble = wrapper.querySelector('.claude-level-bubble');
      const tickEls = Array.from(wrapper.querySelectorAll('.claude-slider-ticks span'));
      const applySlider = (idx, pop) => {
        const pct = maxIdx > 0 ? idx / maxIdx : 0;
        wrapper.style.setProperty('--pct', pct);
        bubble.style.left = 'calc(10px + (100% - 20px) * ' + pct + ')';
        bubble.textContent = labels[idx];
        tickEls.forEach((t, i) => t.classList.toggle('active', i <= idx));
        state.reasoning = values[idx];
        if (pop) {
          try {
            bubble.getAnimations().forEach(a => a.cancel());
            bubble.animate(
              [{ transform: 'translateX(-50%) scale(0.92)' }, { transform: 'translateX(-50%) scale(1.06)' }, { transform: 'translateX(-50%) scale(1)' }],
              { duration: 220, easing: 'ease-out' }
            );
          } catch (e) {}
        }
      };
      slider.value = initialIdx;
      applySlider(initialIdx, false);
      slider.addEventListener('input', (e) => applySlider(parseInt(e.target.value, 10), true));
      slider.addEventListener('pointerdown', () => wrapper.classList.add('dragging'));
      ['pointerup', 'pointercancel', 'pointerleave', 'blur'].forEach(ev => slider.addEventListener(ev, () => wrapper.classList.remove('dragging')));
      reasoningContainer.appendChild(wrapper);
    } else {
      const wrapper = document.createElement('div');
      wrapper.className = 'reasoning-toggle';
      r.options.forEach(opt => {
        const el = document.createElement('div');
        el.className = 'reasoning-option' + (opt.value === defaultReasoning ? ' active' : '');
        el.dataset.level = opt.value;
        el.textContent = opt.label;
        el.addEventListener('click', () => {

        });
        wrapper.appendChild(el);
      });
      reasoningContainer.appendChild(wrapper);
    }
  }

  /* ============================================================
     TYPEWRITER
     ============================================================ */
  function typewriterReveal(text, onChunk, signal, opts = {}) {
    return new Promise((resolve) => {
      if (!text) { resolve(); return; }
      const interval = opts.interval || 16;
      const minDuration = opts.minDuration || 250;
      const maxDuration = opts.maxDuration || 2200;
      const total = text.length;
      const duration = Math.min(maxDuration, Math.max(minDuration, total * 0.35));
      const steps = Math.max(1, Math.round(duration / interval));
      const chunk = Math.max(1, Math.ceil(total / steps));
      let i = 0;
      const timer = setInterval(() => {
        if (signal && signal.aborted) { clearInterval(timer); resolve(); return; }
        const next = Math.min(total, i + chunk);
        onChunk(text.slice(i, next));
        i = next;
        if (i >= total) { clearInterval(timer); resolve(); }
      }, interval);
    });
  }

  /* ============================================================
     MARKDOWN
     ============================================================ */
  function renderInline(text) {
    let t = escapeHtml(text);
    t = t.replace(/`([^`\n]+)`/g, '<code class="inline-code">$1</code>');
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return t;
  }

  function renderTextBlock(text) {
    if (!text) return '';
    const lines = text.split('\n');
    let html = '';
    let inList = null;
    let paraLines = [];
    const flushPara = () => {
      if (paraLines.length) {
        html += `<p>${paraLines.map(renderInline).join('<br>')}</p>`;
        paraLines = [];
      }
    };
    const closeList = () => { if (inList) { html += `</${inList}>`; inList = null; } };
    for (let raw of lines) {
      const line = raw.replace(/\r$/, '');
      if (/^\s*$/.test(line)) { flushPara(); closeList(); continue; }
      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { flushPara(); closeList(); const lvl = h[1].length; html += `<h${lvl}>${renderInline(h[2])}</h${lvl}>`; continue; }
      const ul = line.match(/^\s*[-*+]\s+(.*)$/);
      if (ul) {
        flushPara();
        if (inList !== 'ul') { closeList(); html += '<ul>'; inList = 'ul'; }
        html += `<li>${renderInline(ul[1])}</li>`;
        continue;
      }
      const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (ol) {
        flushPara();
        if (inList !== 'ol') { closeList(); html += '<ol>'; inList = 'ol'; }
        html += `<li>${renderInline(ol[1])}</li>`;
        continue;
      }
      if (/^\s*---+\s*$/.test(line)) { flushPara(); closeList(); html += '<hr>'; continue; }
      if (/^\s*>\s?/.test(line)) { flushPara(); closeList(); html += `<blockquote>${renderInline(line.replace(/^\s*>\s?/, ''))}</blockquote>`; continue; }
      closeList();
      paraLines.push(line);
    }
    flushPara();
    closeList();
    return html;
  }

  function parseMarkdownParts(text) {
    const parts = [];
    let i = 0;
    const len = text.length;
    while (i < len) {
      const fenceStart = text.indexOf('```', i);
      if (fenceStart === -1) {
        if (i < len) parts.push({ type: 'text', content: text.slice(i) });
        break;
      }
      if (fenceStart > i) parts.push({ type: 'text', content: text.slice(i, fenceStart) });
      const lineEnd = text.indexOf('\n', fenceStart);
      let lang = '';
      let codeStart;
      if (lineEnd === -1) {
        lang = text.slice(fenceStart + 3).trim();
        codeStart = len;
      } else {
        lang = text.slice(fenceStart + 3, lineEnd).trim().split(/\s+/)[0] || '';
        codeStart = lineEnd + 1;
      }
      const fenceEnd = text.indexOf('```', codeStart);
      if (fenceEnd === -1) {
        parts.push({ type: 'code', lang, code: text.slice(codeStart), unclosed: true });
        break;
      } else {
        parts.push({ type: 'code', lang, code: text.slice(codeStart, fenceEnd), unclosed: false });
        i = fenceEnd + 3;
        if (text[i] === '\n') i++;
      }
    }
    return parts;
  }

  function createCodeNode(part) {
    const lang = (part.lang || 'text').toLowerCase();
    const displayLang = part.lang || 'text';
    const isRunnable = /^(html|htm|js|javascript)$/.test(lang);
    const wrapper = document.createElement('div');
    wrapper.className = 'code-block-wrapper' + (part.unclosed ? ' streaming' : '');
    wrapper.dataset.lang = displayLang;
    const header = document.createElement('div');
    header.className = 'code-block-header';
    const langLabel = document.createElement('span');
    langLabel.className = 'code-lang';
    langLabel.textContent = displayLang + (part.unclosed ? ' · writing…' : (part.truncated ? ' · truncated' : ''));
    header.appendChild(langLabel);
    const actions = document.createElement('div');
    actions.className = 'code-actions';
    if (!part.unclosed) {
      if (isRunnable && !part.truncated) {
        const runBtn = document.createElement('button');
        runBtn.className = 'code-action-btn run-btn';
        runBtn.textContent = '▶ Run';
        actions.appendChild(runBtn);
      }
      const copyBtn = document.createElement('button');
      copyBtn.className = 'code-action-btn copy-btn';
      copyBtn.textContent = 'Copy';
      actions.appendChild(copyBtn);
      const dlBtn = document.createElement('button');
      dlBtn.className = 'code-action-btn dl-btn';
      dlBtn.textContent = 'Download';
      actions.appendChild(dlBtn);
    }
    header.appendChild(actions);
    const pre = document.createElement('pre');
    const code = document.createElement('code');
    code.className = `language-${displayLang}`;
    code.textContent = part.code;
    pre.appendChild(code);
    wrapper.appendChild(header);
    wrapper.appendChild(pre);
    if (!part.unclosed) {
      try { if (window.hljs) hljs.highlightElement(code); } catch (e) {}
    }
    return wrapper;
  }

  function createPartNode(part) {
    if (part.type === 'text') {
      const div = document.createElement('div');
      div.className = 'md-block md-text';
      div.innerHTML = renderTextBlock(part.content);
      return div;
    }
    return createCodeNode(part);
  }

  function partsEqual(a, b) {
    if (!a || !b || a.type !== b.type) return false;
    if (a.type === 'text') return a.content === b.content;
    return a.lang === b.lang && a.code === b.code && a.unclosed === b.unclosed && a.truncated === b.truncated;
  }

  function updateStreamingContent(container, text, renderState) {
    const parts = parseMarkdownParts(text);
    let common = 0;
    while (common < parts.length && common < renderState.renderedParts.length && partsEqual(parts[common], renderState.renderedParts[common].part)) common++;
    for (let j = common; j < renderState.renderedParts.length; j++) renderState.renderedParts[j].node.remove();
    renderState.renderedParts = renderState.renderedParts.slice(0, common);
    for (let j = common; j < parts.length; j++) {
      const node = createPartNode(parts[j]);
      container.appendChild(node);
      renderState.renderedParts.push({ part: parts[j], node });
    }
  }

  function ensureCursor(container) {
    let cursor = container.querySelector(':scope > .stream-cursor');
    if (!cursor) { cursor = document.createElement('span'); cursor.className = 'stream-cursor'; cursor.textContent = '▍'; }
    if (container.lastElementChild !== cursor) container.appendChild(cursor);
  }
  function removeCursor(container) {
    const cursor = container.querySelector(':scope > .stream-cursor');
    if (cursor) cursor.remove();
  }

  function finalizeContent(container, text, renderState) {
    container.innerHTML = '';
    renderState.renderedParts = [];
    if (!text || !text.trim()) return;
    const parts = parseMarkdownParts(text);
    if (parts.length && parts[parts.length - 1].type === 'code' && parts[parts.length - 1].unclosed) {
      parts[parts.length - 1].unclosed = false;
      parts[parts.length - 1].truncated = true;
    }
    parts.forEach(part => {
      const node = createPartNode(part);
      container.appendChild(node);
      renderState.renderedParts.push({ part, node });
    });
  }

  /* ============================================================
     VFS SYNC FROM CODE BLOCKS
     ============================================================ */
  function detectFilename(code, lang) {
    const firstLine = (code.split('\n')[0] || '').trim();
    const m = firstLine.match(/(?:\/\/|<!--|#|\/\*)\s*(?:file(?:name)?\s*[:=]\s*)?([\w./-]+\.[a-z0-9]{1,8})/i);
    return m ? m[1] : null;
  }
  function syncCodeBlocksToVfs(text) {
    if (!text) return;
    const parts = parseMarkdownParts(text);
    parts.forEach(p => {
      if (p.type !== 'code' || p.unclosed) return;
      const filename = detectFilename(p.code, p.lang);
      if (filename) vfs.write(filename, p.code);
    });
  }

      a.download = `code.${extForLang(lang)}`;
      document.body.appendChild(a);
      a.click();

  function copyText(text, btn) {
    const done = () => {
      if (!btn.dataset.origHtml) btn.dataset.origHtml = btn.innerHTML;
      btn.innerHTML = 'Copied!';
      btn.classList.add('copied');
      clearTimeout(btn._copyTimer);
      btn._copyTimer = setTimeout(() => {
        btn.innerHTML = btn.dataset.origHtml;
        btn.classList.remove('copied');
      }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { alert('Copy failed'); }
    ta.remove();
  }

  function openPreviewModal(html) {
    previewIframe.srcdoc = html;
    previewModal.classList.add('open');
  }
  previewCloseBtn.addEventListener('click', () => previewModal.classList.remove('open'));
  previewModal.querySelector('.preview-modal-backdrop').addEventListener('click', () => previewModal.classList.remove('open'));

  function previewProjectFromVfs(mainHtmlPath) {
    let htmlPath = mainHtmlPath;
    if (!htmlPath || !vfs.exists(htmlPath)) {
      htmlPath = vfs.list().find(p => /\.html?$/i.test(p));
    }
    if (!htmlPath || !vfs.exists(htmlPath)) { alert('No HTML file in workspace.'); return; }
    let html = vfs.read(htmlPath);

    const cssFiles = vfs.list().filter(p => /\.css$/i.test(p));
    for (const p of cssFiles) {
      const css = vfs.read(p);
      if (/<\/head>/i.test(html)) html = html.replace(/<\/head>/i, `<style>\n${css}\n</style>\n</head>`);
      else html = `<style>\n${css}\n</style>\n` + html;
    }
    const jsFiles = vfs.list().filter(p => /\.js$/i.test(p));
    for (const p of jsFiles) {
      const js = vfs.read(p).replace(/<\/script/gi, '<\\/script');
      if (/<\/body>/i.test(html)) html = html.replace(/<\/body>/i, `<script>\n${js}\n<\/script>\n</body>`);
      else html = html + `\n<script>\n${js}\n<\/script>`;
    }
    openPreviewModal(html);
  }

  async function downloadVfsAsZip() {
    if (typeof JSZip === 'undefined') { alert('ZIP library not loaded.'); return; }
    if (vfs.size() === 0) { alert('Workspace is empty.'); return; }
    const zip = new JSZip();
    for (const path of vfs.list()) zip.file(path, vfs.read(path));
    try {
      const blob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'project.zip';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) { alert('Failed to create ZIP: ' + e.message); }
  }

  function addMessageActions(bubble, text) {
    if (!text || !text.trim()) return;

    const copyBtn = document.createElement('button');

    copyBtn.addEventListener('click', () => copyText(text, copyBtn));
    actions.appendChild(copyBtn);

    const hasHtml = vfs.list().some(p => /\.html?$/i.test(p));

    if (hasHtml) {

      previewBtn.className = 'msg-action-btn';
      previewBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Preview Project';

      const zipBtn = document.createElement('button');
      zipBtn.className = 'msg-action-btn';

      zipBtn.addEventListener('click', () => downloadVfsAsZip());
      actions.appendChild(zipBtn);
    }
    bubble.appendChild(actions);
  }

  /* ============================================================
     ATTACHMENTS
     ============================================================ */
  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      if (file.size > 10 * 1024 * 1024) { alert(`File ${file.name} is too large (max 10MB).`); continue; }
      let content = '';
      let type = 'text';

      if (file.name.endsWith('.zip')) {
        try {
          const arrayBuffer = await file.arrayBuffer();
          const bytes = new Uint8Array(arrayBuffer);
          zipStore.set(file.name, bytes);
          await extractZipData(bytes, file.name);
          content = `[Zip "${file.name}" extracted to workspace: ${vfs.list().join(', ')}]`;
        } catch (err) {
          console.error('Error reading zip:', err);
          alert('Failed to read zip file.');
          continue;
        }
      } else if (/\.(txt|md|html|js|css|json|py|ts|tsx|jsx|c|cpp|h|hpp|java|cs|go|rs|rb|php|xml|yml|yaml)$/i.test(file.name) || file.type.startsWith('text/')) {
        content = await file.text();
        vfs.write(file.name, content);
      } else if (file.type.startsWith('image/')) {
        content = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (ev) => resolve(ev.target.result);
          reader.readAsDataURL(file);
        });
        type = 'image';
      } else continue;

      if (content) state.attachments.push({ name: file.name, content, type });
    }
    fileInput.value = '';
    renderAttachments();
    updateSendBtn();
  });

  function renderAttachments() {
    attachmentsContainer.innerHTML = '';
    state.attachments.forEach((att, index) => {
      const chip = document.createElement('div');
