  /* ============================================================
     STREAM EVENT HANDLING (with tool calls)
     ============================================================ */
  function handleStreamEvent(json, meta, onContent, onThinking) {
    if (!json || typeof json !== 'object') return;
    if (!meta.toolCallsMap) meta.toolCallsMap = {};
    if (!meta.toolCalls) meta.toolCalls = [];

    // OpenAI Chat completions
    if (Array.isArray(json.choices) && json.choices.length) {
      const choice = json.choices[0];
      const delta = choice.delta || choice.message || {};

      if (Array.isArray(delta.tool_calls)) {
        for (const tc of delta.tool_calls) {
          if (!tc) continue;
          const idx = tc.index ?? 0;
          if (!meta.toolCallsMap[idx]) meta.toolCallsMap[idx] = { id: '', type: 'function', function: { name: '', arguments: '' } };
          const entry = meta.toolCallsMap[idx];
          if (tc.id) entry.id = tc.id;
          if (tc.type) entry.type = tc.type;
          if (tc.function) {
            if (tc.function.name) entry.function.name += tc.function.name;
            if (tc.function.arguments) entry.function.arguments += tc.function.arguments;
          }
        }
      }

      if (typeof delta.reasoning_content === 'string') onThinking(delta.reasoning_content);
      if (typeof delta.reasoning === 'string') onThinking(delta.reasoning);
      if (typeof delta.thinking === 'string') onThinking(delta.thinking);
      if (delta.content != null) {
        if (typeof delta.content === 'string') onContent(delta.content);
        else if (Array.isArray(delta.content)) {
          for (const part of delta.content) {
            if (!part) continue;
            const isThought = part.thought === true || (part.type && /thought|reasoning/i.test(part.type));
            if (isThought) { if (typeof part.text === 'string') onThinking(part.text); }
            else if (typeof part.text === 'string') onContent(part.text);
          }
        }
      }
      if (choice.finish_reason === 'length') meta.truncated = true;
      return;
    }

    // Gemini native
    if (Array.isArray(json.candidates) && json.candidates.length) {
      const cand = json.candidates[0];
      if (cand.content && Array.isArray(cand.content.parts)) {
        cand.content.parts.forEach(part => {
          if (!part) return;
          if (part.functionCall && part.functionCall.name) {
            // Deduplicate by name+args — some Gemini stream versions resend the same functionCall
            const argsJson = JSON.stringify(part.functionCall.args || {});
            const key = part.functionCall.name + '::' + argsJson;
            if (!meta._geminiSeenCalls) meta._geminiSeenCalls = new Set();
            if (!meta._geminiSeenCalls.has(key)) {
              meta._geminiSeenCalls.add(key);
              meta.toolCalls.push({
                id: 'call_' + Math.random().toString(36).slice(2, 10),
                type: 'function',
                function: {
                  name: part.functionCall.name,
                  arguments: argsJson
                }
              });
            }
          } else if (part.thought === true) {
            if (typeof part.text === 'string') onThinking(part.text);
          } else if (typeof part.text === 'string' && part.text) {
            onContent(part.text);
          }
        });
      }
      if (cand.finishReason === 'MAX_TOKENS' || cand.finishReason === 'LENGTH') meta.truncated = true;
      return;
    }

    const type = json.type;
    if (typeof type !== 'string') return;

    // OpenAI Responses API
    if (type.startsWith('response.')) {
      if (type === 'response.output_item.added' && json.item && json.item.type === 'function_call') {
        const idx = json.output_index ?? 0;
        meta.toolCallsMap[idx] = {
          id: json.item.id || json.item.call_id,
          call_id: json.item.call_id,
          type: 'function',
          function: { name: json.item.name || '', arguments: json.item.arguments || '' }
        };
        return;
      }
      if (type === 'response.function_call_arguments.delta') {
        const idx = json.output_index ?? 0;
        if (meta.toolCallsMap[idx]) meta.toolCallsMap[idx].function.arguments += json.delta || '';
        return;
      }
      if (type === 'response.function_call_arguments.done') {
        const idx = json.output_index ?? 0;
        if (meta.toolCallsMap[idx] && typeof json.arguments === 'string') meta.toolCallsMap[idx].function.arguments = json.arguments;
        return;
      }
      if (type === 'response.output_text.delta' && typeof json.delta === 'string') { onContent(json.delta); return; }
      if (type === 'response.reasoning_summary_text.delta' && typeof json.delta === 'string') { onThinking(json.delta); return; }
      if (type === 'response.reasoning_text.delta' && typeof json.delta === 'string') { onThinking(json.delta); return; }
      if (type === 'response.completed' && json.response) {
        if (json.response.status === 'incomplete' || json.response.incomplete_details) meta.truncated = true;
        // Fallback: harvest tool calls from final output if no deltas were emitted
        if (!meta._responseSawToolDeltas && Array.isArray(json.response.output)) {
          let idx = 0;
          json.response.output.forEach(item => {
            if (item && item.type === 'function_call') {
              meta.toolCallsMap[idx] = {
                id: item.id || item.call_id,
                call_id: item.call_id,
                type: 'function',
                function: { name: item.name || '', arguments: item.arguments || '' }
              };
              idx++;
            }
          });
        }
        meta._responseSawToolDeltas = false;
        return;
      }
      if (type === 'response.failed') {
        throw new Error((json.response && json.response.error && json.response.error.message) || 'Response failed');
      }
      return;
    }

    // Anthropic
    if (type === 'content_block_start' && json.content_block) {
      const cb = json.content_block;
      if (cb.type === 'tool_use') {
        meta.toolCallsMap[json.index ?? 0] = {
          id: cb.id,
          type: 'function',
          function: { name: cb.name, arguments: '' }
        };
        return;
      }
      if (cb.type === 'thinking' && typeof cb.thinking === 'string' && cb.thinking) onThinking(cb.thinking);
      if (cb.type === 'text' && typeof cb.text === 'string' && cb.text) onContent(cb.text);
      return;
    }
    if (type === 'content_block_delta' && json.delta) {
      const d = json.delta;
      if (d.type === 'input_json_delta') {
        const idx = json.index ?? 0;
        if (meta.toolCallsMap[idx]) meta.toolCallsMap[idx].function.arguments += d.partial_json || '';
        return;
      }
      if (d.type === 'thinking_delta' && typeof d.thinking === 'string') onThinking(d.thinking);
      else if (d.type === 'text_delta' && typeof d.text === 'string') onContent(d.text);
      return;
    }
    if (type === 'message_delta') {
      if (json.delta && json.delta.stop_reason === 'max_tokens') meta.truncated = true;
      return;
    }
    if (type === 'message_start' || type === 'message_stop' || type === 'content_block_stop' || type === 'ping') return;

    if (type === 'error') throw new Error((json.error && json.error.message) || json.message || 'Stream error');

    if (json.delta && typeof json.delta === 'object') {
      if (typeof json.delta.content === 'string') onContent(json.delta.content);
      if (typeof json.delta.thinking === 'string') onThinking(json.delta.thinking);
    }
  }

  async function processStreamingResponse(response, onContent, onThinking) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    const meta = { text: '', thinking: '', truncated: false, toolCalls: [], toolCallsMap: {} };
    const emitContent = (c) => { if (c) { meta.text += c; onContent(c); } };
    const emitThinking = (c) => { if (c) { meta.thinking += c; onThinking(c); } };
    let finished = false;

    const processLine = (line) => {
      const trimmed = line.trim();
      if (!trimmed) return;
      if (trimmed.startsWith(':')) return;
      if (trimmed.startsWith('event:')) return;
      if (!trimmed.startsWith('data:')) return;
      const payload = trimmed.slice(5).trim();
      if (!payload) return;
      if (payload === '[DONE]') { finished = true; return; }
      let json;
      try { json = JSON.parse(payload); } catch (e) { return; }
      if (json.error) throw new Error(json.error.message || JSON.stringify(json.error));
      handleStreamEvent(json, meta, emitContent, emitThinking);
    };

    try {
      while (!finished) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf('\n')) !== -1) {
          const line = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 1);
          processLine(line);
          if (finished) break;
        }
      }
      if (!finished && buffer.trim()) processLine(buffer);
    } finally {
      try { await reader.cancel(); } catch (e) {}
    }

    const streamed = Object.values(meta.toolCallsMap || {}).filter(tc => tc && tc.function && tc.function.name);
    meta.toolCalls = [...meta.toolCalls, ...streamed];
    meta.toolCallsMap = {};
    delete meta._geminiSeenCalls;
    delete meta._responseSawToolDeltas;
    return meta;
  }

  /* ============================================================
     NON-STREAMING EXTRACTION
     ============================================================ */
  function extractFromJson(json) {
    if (!json || typeof json !== 'object') throw new Error('Empty response');
    if (json.error) throw new Error(json.error.message || JSON.stringify(json.error));

    const result = { text: '', thinking: '', truncated: false, toolCalls: [] };
    let text = '';
    let thinking = '';
    const seenGeminiCalls = new Set();

    if (Array.isArray(json)) {
      json.forEach(chunk => {
        if (!chunk) return;
        if (chunk.error) throw new Error(chunk.error.message || JSON.stringify(chunk.error));
        if (Array.isArray(chunk.candidates) && chunk.candidates.length) {
          const cand = chunk.candidates[0];
          if (cand.content && Array.isArray(cand.content.parts)) {
            cand.content.parts.forEach(part => {
              if (!part) return;
              if (part.functionCall && part.functionCall.name) {
                const argsJson = JSON.stringify(part.functionCall.args || {});
                const key = part.functionCall.name + '::' + argsJson;
                if (!seenGeminiCalls.has(key)) {
                  seenGeminiCalls.add(key);
                  result.toolCalls.push({
                    id: 'call_' + Math.random().toString(36).slice(2, 10),
                    type: 'function',
                    function: { name: part.functionCall.name, arguments: argsJson }
                  });
                }
              } else if (part.thought === true) { if (typeof part.text === 'string') thinking += part.text; }
              else if (typeof part.text === 'string') text += part.text;
            });
          }
          if (cand.finishReason === 'MAX_TOKENS' || cand.finishReason === 'LENGTH') result.truncated = true;
        }
      });
      result.text = text; result.thinking = thinking;
      return result;
    }

    if (Array.isArray(json.candidates) && json.candidates.length) {
      const cand = json.candidates[0];
      if (cand.content && Array.isArray(cand.content.parts)) {
        cand.content.parts.forEach(part => {
          if (!part) return;
          if (part.functionCall && part.functionCall.name) {
            const argsJson = JSON.stringify(part.functionCall.args || {});
            const key = part.functionCall.name + '::' + argsJson;
            if (!seenGeminiCalls.has(key)) {
              seenGeminiCalls.add(key);
              result.toolCalls.push({
                id: 'call_' + Math.random().toString(36).slice(2, 10),
                type: 'function',
                function: { name: part.functionCall.name, arguments: argsJson }
              });
            }
          } else if (part.thought === true) { if (typeof part.text === 'string') thinking += part.text; }
          else if (typeof part.text === 'string') text += part.text;
        });
      }
      if (cand.finishReason === 'MAX_TOKENS' || cand.finishReason === 'LENGTH') result.truncated = true;
      result.text = text; result.thinking = thinking;
      return result;
    }

    const consumeChatMessage = (msg) => {
      if (!msg) return;
      if (Array.isArray(msg.tool_calls)) {
        msg.tool_calls.forEach(tc => {
          if (!tc) return;
          result.toolCalls.push({
            id: tc.id || ('call_' + Math.random().toString(36).slice(2, 10)),
            call_id: tc.id,
            type: tc.type || 'function',
            function: { name: (tc.function && tc.function.name) || '', arguments: (tc.function && tc.function.arguments) || '' }
          });
        });
      }
      if (typeof msg.content === 'string') text += msg.content;
      else if (Array.isArray(msg.content)) {
        msg.content.forEach(part => {
          if (!part) return;
          const isThought = part.thought === true || (part.type && /thought|reasoning/i.test(part.type));
          if (isThought) { if (typeof part.text === 'string') thinking += part.text; }
          else if (typeof part.text === 'string') text += part.text;
        });
      }
      if (typeof msg.reasoning_content === 'string') thinking += msg.reasoning_content;
      if (typeof msg.reasoning === 'string') thinking += msg.reasoning;
      if (typeof msg.thinking === 'string') thinking += msg.thinking;
    };

    if (Array.isArray(json.content) && !Array.isArray(json.choices)) {
      json.content.forEach(block => {
        if (!block) return;
        if (block.type === 'tool_use') {
          result.toolCalls.push({
            id: block.id,
            type: 'function',
            function: { name: block.name, arguments: JSON.stringify(block.input || {}) }
          });
        } else if (block.type === 'thinking' && typeof block.thinking === 'string') thinking += block.thinking;
        else if (block.type === 'text' && typeof block.text === 'string') text += block.text;
      });
      if (json.stop_reason === 'max_tokens') result.truncated = true;
    } else if (Array.isArray(json.output)) {
      json.output.forEach(item => {
        if (!item) return;
        if (item.type === 'function_call') {
          result.toolCalls.push({
            id: item.id,
            call_id: item.call_id,
            type: 'function',
            function: { name: item.name, arguments: item.arguments || '' }
          });
        }
        if (item.type === 'reasoning') {
          if (Array.isArray(item.summary)) thinking += item.summary.map(s => s.text || '').join('\n');
          if (Array.isArray(item.content)) thinking += item.content.map(c => c.text || '').join('');
          if (typeof item.text === 'string') thinking += item.text;
        }
        if (item.type === 'message' && Array.isArray(item.content)) {
          item.content.forEach(c => {
            if ((c.type === 'output_text' || c.type === 'text') && c.text) text += c.text;
          });
        }
      });
      if (!text && typeof json.output_text === 'string') text = json.output_text;
      if (json.status === 'incomplete' || json.incomplete_details) result.truncated = true;
    } else if (Array.isArray(json.choices) && json.choices.length) {
      const choice = json.choices[0];
      consumeChatMessage(choice.message);
      if (choice.finish_reason === 'length') result.truncated = true;
    } else {
      if (typeof json.output_text === 'string') text = json.output_text;
      if (!text && typeof json.content === 'string') text = json.content;
      consumeChatMessage(json.message);
    }

    result.text = text; result.thinking = thinking;
    return result;
  }

  /* ============================================================
     FETCH MODEL RESPONSE
     ============================================================ */
  async function fetchModelResponse(config, messages, reasoning, attachments, signal, opts = {}) {
    const stream = opts.stream !== false;
    const endpoint = config.endpoint;
    const apiType = config.apiType || 'openai-chat';
    const systemPrompt = getFullSystemPrompt(config);
    const authHeaders = getAuthHeaders(config);
    let body = {};

    let textContext = '';
    const imageAttachments = [];
    attachments.forEach(att => {
      if (att.type === 'text') textContext += `\n\n--- Attached File: ${att.name} ---\n${att.content}`;
      else if (att.type === 'image') imageAttachments.push(att.content);
    });

    const augmentedMessages = JSON.parse(JSON.stringify(messages));
    if (textContext) {
      for (let i = augmentedMessages.length - 1; i >= 0; i--) {
        if (augmentedMessages[i].role === 'user') {
          augmentedMessages[i].content += textContext;
          break;
        }
      }
    }

    const defaultInclude = apiType === 'openai-responses' ? false : true;
    const includeInstructions = config.includeInstructions !== undefined
      ? config.includeInstructions === true
      : defaultInclude;

    const toolsEnabled = !opts.noTools && config.supportsTools !== false;
    const toolDefs = toolsEnabled ? toolsForApi(getToolDefinitions(state.mode), apiType) : null;

    if (apiType === 'openai-chat') {
      const gMessages = [];
      if (includeInstructions && systemPrompt) gMessages.push({ role: 'system', content: systemPrompt });

      augmentedMessages.forEach((m) => {
        if (m.role === 'user') {
          gMessages.push({ role: 'user', content: m.content });
        } else if (m.role === 'assistant') {
          const out = { role: 'assistant', content: m.content || null };
          if (Array.isArray(m.tool_calls) && m.tool_calls.length) {
            out.tool_calls = m.tool_calls.map(tc => ({
              id: tc.id || tc.call_id,
              type: 'function',
              function: { name: tc.function.name, arguments: tc.function.arguments || '' }
            }));
            if (!out.content) delete out.content;
          }
          gMessages.push(out);
        } else if (m.role === 'tool') {
          gMessages.push({
            role: 'tool',
            tool_call_id: m.tool_call_id,
            content: m.content
          });
        }
      });

      if (imageAttachments.length > 0) {
        for (let i = gMessages.length - 1; i >= 0; i--) {
          if (gMessages[i].role === 'user') {
            const existing = typeof gMessages[i].content === 'string' ? gMessages[i].content : '';
            const contentParts = [{ type: 'text', text: existing }];
            imageAttachments.forEach(img => contentParts.push({ type: 'image_url', image_url: { url: img } }));
            gMessages[i].content = contentParts;
            break;
          }
        }
      }

      body = { messages: gMessages, stream };
      if (config.sendModelInBody) body.model = config.id;
      if (config.supportsReasoningEffort && reasoning) body.reasoning_effort = reasoning;
      if (config.includeThoughts) body.include_thoughts = true;
      if (toolDefs && toolDefs.length) body.tools = toolDefs;
      if (config.maxOutputTokens) body.max_tokens = config.maxOutputTokens;

    } else if (apiType === 'openai-responses') {
      const input = [];
      augmentedMessages.forEach(m => {
        if (m.role === 'user') {
          input.push({ type: 'message', role: 'user', content: [{ type: 'input_text', text: m.content }] });
        } else if (m.role === 'assistant') {
          if (m.content) input.push({ type: 'message', role: 'assistant', content: [{ type: 'output_text', text: m.content }] });
          if (Array.isArray(m.tool_calls)) {
            m.tool_calls.forEach(tc => {
              input.push({
                type: 'function_call',
                id: tc.id || tc.call_id,
                call_id: tc.call_id || tc.id,
                name: tc.function.name,
                arguments: tc.function.arguments || '',
                status: 'completed'
              });
            });
          }
        } else if (m.role === 'tool') {
          input.push({ type: 'function_call_output', call_id: m.tool_call_id, output: m.content });
        }
      });

      if (imageAttachments.length > 0) {
        for (let i = input.length - 1; i >= 0; i--) {
          if (input[i].type === 'message' && input[i].role === 'user') {
            imageAttachments.forEach(img => input[i].content.push({ type: 'input_image', image_url: img }));
            break;
          }
        }
      }

      body = { stream, input };
      if (config.sendModelInBody !== false) body.model = config.id;
      if (config.supportsReasoningEffort && reasoning) body.reasoning = { effort: reasoning };
      if (includeInstructions && systemPrompt) body.instructions = systemPrompt;
      if (toolDefs && toolDefs.length) body.tools = toolDefs;
      if (config.maxOutputTokens) body.max_output_tokens = config.maxOutputTokens;

    } else if (apiType === 'gemini-native') {
      const gContents = [];
      augmentedMessages.forEach(m => {
        if (m.role === 'user') {
          gContents.push({ role: 'user', parts: [{ text: m.content }] });
        } else if (m.role === 'assistant') {
          const parts = [];
          if (m.content) parts.push({ text: m.content });
          if (Array.isArray(m.tool_calls)) {
            m.tool_calls.forEach(tc => {
              let args = {};
              try { args = JSON.parse(tc.function.arguments || '{}'); } catch (e) {}
              parts.push({ functionCall: { name: tc.function.name, args } });
            });
          }
          if (parts.length) gContents.push({ role: 'model', parts });
        } else if (m.role === 'tool') {
          let responseData;
          try {
            const parsed = JSON.parse(m.content);
            responseData = { result: parsed };
          } catch (e) {
            responseData = { result: m.content };
          }
          gContents.push({
            role: 'user',
            parts: [{ functionResponse: { name: m.name || 'tool', response: responseData } }]
          });
        }
      });

      if (imageAttachments.length > 0) {
        for (let i = gContents.length - 1; i >= 0; i--) {
          if (gContents[i].role === 'user') {
            imageAttachments.forEach(img => {
              const match = img.match(/^data:([^;]+);base64,(.+)$/);
              if (match) gContents[i].parts.push({ inlineData: { mimeType: match[1], data: match[2] } });
            });
            break;
          }
        }
      }

      body = {
        contents: gContents,
        generationConfig: {
          thinkingConfig: {
            includeThoughts: config.includeThoughts !== false,
            thinkingBudget: reasoning === 'high' ? 24576 : reasoning === 'low' ? 4096 : 12288
          }
        }
      };
      if (includeInstructions && systemPrompt) body.systemInstruction = { parts: [{ text: systemPrompt }] };
      if (toolDefs) body.tools = toolDefs;

    } else if (apiType === 'anthropic') {
      const claudeMessages = [];
      augmentedMessages.forEach(m => {
        if (m.role === 'user') {
          claudeMessages.push({ role: 'user', content: m.content });
        } else if (m.role === 'assistant') {
          const content = [];
          if (m.content) content.push({ type: 'text', text: m.content });
          if (Array.isArray(m.tool_calls)) {
            m.tool_calls.forEach(tc => {
              let input = {};
              try { input = JSON.parse(tc.function.arguments || '{}'); } catch (e) {}
              content.push({ type: 'tool_use', id: tc.id, name: tc.function.name, input });
            });
          }
          if (content.length) claudeMessages.push({ role: 'assistant', content });
        } else if (m.role === 'tool') {
          claudeMessages.push({
            role: 'user',
            content: [{ type: 'tool_result', tool_use_id: m.tool_call_id, content: m.content }]
          });
        }
      });

      if (imageAttachments.length > 0) {
        for (let i = claudeMessages.length - 1; i >= 0; i--) {
          if (claudeMessages[i].role === 'user' && typeof claudeMessages[i].content === 'string') {
            const text = claudeMessages[i].content;
            const parts = [{ type: 'text', text }];
            imageAttachments.forEach(img => {
              const m = img.match(/^data:([^;]+);base64,(.+)$/);
              if (m) parts.push({ type: 'image', source: { type: 'base64', media_type: m[1], data: m[2] } });
            });
            claudeMessages[i].content = parts;
            break;
          }
        }
      }

      const maxTokensMap = config.maxTokens || { minimal: 8192, low: 12288, medium: 16384, high: 24576, max: 32000 };
      const maxTokens = maxTokensMap[reasoning] || config.maxOutputTokens || 32000;

      body = { model: config.id, messages: claudeMessages, max_tokens: maxTokens, stream };
      if (includeInstructions && systemPrompt) body.system = systemPrompt;
      if (toolDefs && toolDefs.length) body.tools = toolDefs;

    } else {
      throw new Error(`Unknown apiType: ${apiType}`);
    }

    const headers = { ...authHeaders, 'Content-Type': 'application/json' };
    const res = await fetch(endpoint, {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
      signal
    });

    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      if (body.tools && !opts.noTools && res.status >= 400 && res.status < 500) {
        console.warn('[tools retry] API rejected tools, retrying without:', errText.slice(0, 200));
        return fetchModelResponse(config, messages, reasoning, attachments, signal, { ...opts, noTools: true });
      }
      if (stream && res.status >= 400 && res.status < 500 && /stream/i.test(errText)) {
        return fetchModelResponse(config, messages, reasoning, attachments, signal, { ...opts, stream: false });
      }
      throw new Error(`HTTP ${res.status}: ${errText.slice(0, 300)}`);
    }
    return res;
  }

  /* ============================================================
     GENERATE RESPONSE (multi-round + tools)
     ============================================================ */
  async function generateResponse() {
    if (state.isGenerating) {
      if (state.abortController) state.abortController.abort();
      return;
    }
    const text = chatInput.value.trim();
    if (!text && state.attachments.length === 0) return;
    if (!state.model) return;

    state.isGenerating = true;
    chatInput.value = '';
    chatInput.style.height = 'auto';
    sendIcon.style.display = 'none';
    stopIcon.style.display = 'block';
    sendBtn.classList.add('stop-mode');
    sendBtn.disabled = false;
    inputWrapper.classList.add('generating');
    updateSendBtn();

    addUserMessage(text, state.attachments);
    state.messages.push({ role: 'user', content: text });

    const currentAttachments = [...state.attachments];
    state.attachments = [];
    renderAttachments();

    const { bubble, avatar } = createAssistantRow();

    state.abortController = new AbortController();
    const signal = state.abortController.signal;

    const maxRounds = 12;
    let round = 0;
    let allRenderedText = '';
    let finalPushed = false;

    let currentThinking = null;
    let currentThinkingTimer = null;
    let currentThinkingStart = 0;
    let currentContent = null;
    let currentRenderState = null;
    let currentText = '';
    let renderTimer = null;

    function removeWaiting() {
      const w = bubble.querySelector('.waiting-indicator');
      if (w) w.remove();
    }

    function startRound() {
      currentThinking = null;
      if (currentThinkingTimer) { clearInterval(currentThinkingTimer); currentThinkingTimer = null; }
      currentContent = null;
      currentRenderState = { renderedParts: [] };
      currentText = '';
      if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
    }

    function finalizeThinking() {
      if (!currentThinking || currentThinking.dataset.finalized) return;
      currentThinking.dataset.finalized = 'true';
      currentThinking.classList.add('done');
      if (currentThinkingTimer) { clearInterval(currentThinkingTimer); currentThinkingTimer = null; }
      const elapsed = currentThinkingStart ? ((performance.now() - currentThinkingStart) / 1000) : 0;
      const userWantsExpanded = currentThinking.dataset.userExpanded === 'true';
      if (!userWantsExpanded) currentThinking.classList.remove('expanded');
      const label = currentThinking.querySelector('.thinking-label');
      if (label) {
        label.innerHTML = `<svg class="thought-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><path d="M20 6L9 17l-5-5"/></svg><span class="thinking-text">Thought for ${elapsed.toFixed(1)}s</span>`;
      }
      avatar.classList.remove('thinking');
    }

    function ensureThinkingPanel() {
      if (currentThinking && !currentThinking.dataset.finalized) return currentThinking;
      removeWaiting();
      currentThinking = createThinkingPanel();
      bubble.appendChild(currentThinking);
      currentThinkingStart = performance.now();
      currentThinkingTimer = setInterval(() => {
        const t = currentThinking && currentThinking.querySelector('.thinking-time');
        if (t) t.textContent = ((performance.now() - currentThinkingStart) / 1000).toFixed(1) + 's';
      }, 100);
      avatar.classList.add('thinking');
      return currentThinking;
    }

    function ensureContentDiv() {
      if (currentContent) return currentContent;
      removeWaiting();
      finalizeThinking();
      currentContent = document.createElement('div');
      currentContent.className = 'content';
      bubble.appendChild(currentContent);
      return currentContent;
    }

    function onThinking(chunk) {
      if (!chunk) return;
      const panel = ensureThinkingPanel();
      const body = panel.querySelector('.thinking-body');
      if (body) body.textContent += chunk;
      scrollToBottom();
    }

    function scheduleRender() {
      if (renderTimer) return;
      renderTimer = setTimeout(() => {
        renderTimer = null;
        if (currentContent && currentRenderState) {
          updateStreamingContent(currentContent, currentText, currentRenderState);
          ensureCursor(currentContent);
          scrollToBottom();
        }
      }, 30);
    }

    function onContent(chunk) {
      if (!chunk) return;
      ensureContentDiv();
      currentText += chunk;
      allRenderedText += chunk;
      scheduleRender();
    }

    function renderToolCard(tc) {
      const card = document.createElement('div');
      card.className = 'tool-call-card';
      const argSummary = summarizeArgs(tc.function.arguments);
      card.innerHTML = `
        <div class="tool-call-header running">
          <svg class="tool-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9" stroke-dasharray="28" stroke-dashoffset="10"/></svg>
          <span class="tool-name">${escapeHtml(tc.function.name)}</span>
          <span class="tool-args">${escapeHtml(argSummary)}</span>
          <svg class="tool-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="tool-call-body"></div>
      `;
      card.querySelector('.tool-call-header').addEventListener('click', () => {
        card.classList.toggle('expanded');
      });
      bubble.appendChild(card);
      scrollToBottom();
      return card;
    }

    function completeToolCard(card, result) {
      const header = card.querySelector('.tool-call-header');
      header.classList.remove('running');
      const iconEl = header.querySelector('.tool-icon');
      if (iconEl) iconEl.outerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>';
      const body = card.querySelector('.tool-call-body');
      const txt = String(result);
      const maxLen = 4000;
      body.textContent = txt.length > maxLen ? txt.slice(0, maxLen) + `\n…[${txt.length - maxLen} chars omitted]` : txt;
    }

    try {
      const config = MODEL_CONFIG[state.model];

      while (round < maxRounds) {
        if (signal.aborted) throw abortError();
        startRound();

        const result = await callModelOnce(config, state.messages, state.reasoning, round === 0 ? currentAttachments : [], signal, onContent, onThinking);

        if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
        if (currentContent) {
          removeCursor(currentContent);
          if (currentText.trim()) finalizeContent(currentContent, currentText, currentRenderState);
          else currentContent.remove();
        }
        finalizeThinking();

        if (!result.toolCalls || result.toolCalls.length === 0) {
          state.messages.push({ role: 'assistant', content: currentText });
          finalPushed = true;
          break;
        }

        state.messages.push({
          role: 'assistant',
          content: currentText,
          tool_calls: result.toolCalls
        });

        for (const tc of result.toolCalls) {
          if (signal.aborted) throw abortError();
          const card = renderToolCard(tc);
          let toolResult;
          try {
            toolResult = await Promise.race([
              executeTool(tc.function.name, tc.function.arguments),
              new Promise((_, rej) => setTimeout(() => rej(new Error('Tool timeout (30s)')), 30000))
            ]);
          } catch (e) {
            toolResult = `Error: ${e.message}`;
          }
          const resultStr = typeof toolResult === 'string' ? toolResult : JSON.stringify(toolResult);
          const truncated = resultStr.length > TOOL_RESULT_MAX
            ? resultStr.slice(0, TOOL_RESULT_MAX) + `\n\n[...truncated, ${resultStr.length - TOOL_RESULT_MAX} chars omitted]`
            : resultStr;
          completeToolCard(card, truncated);
          state.messages.push({
            role: 'tool',
            tool_call_id: tc.call_id || tc.id,
            name: tc.function.name,
            content: truncated
          });
        }
        round++;
      }

      if (round >= maxRounds) {
        onContent('\n\n*[Reached maximum tool-use iterations]*');
      }
    } catch (err) {
      if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
      if (currentContent) { removeCursor(currentContent); }
      finalizeThinking();
      if (err.name === 'AbortError') {
        onContent('\n\n*[Generation stopped]*');
      } else {
        console.error(err);
        const errMsg = `⚠️ **Error:** ${err.message}`;
        onContent(errMsg);
      }
    } finally {
      if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
      if (currentThinkingTimer) { clearInterval(currentThinkingTimer); currentThinkingTimer = null; }
      removeWaiting();
      if (currentContent) {
        removeCursor(currentContent);
        finalizeContent(currentContent, currentText, currentRenderState);
      }
      finalizeThinking();
      avatar.classList.remove('thinking');

      syncCodeBlocksToVfs(allRenderedText);

      if (allRenderedText.trim()) addMessageActions(bubble, allRenderedText);

      if (!finalPushed && allRenderedText.trim()) {
        state.messages.push({ role: 'assistant', content: allRenderedText });
      }

      state.isGenerating = false;
      state.abortController = null;
      inputWrapper.classList.remove('generating');
      sendIcon.style.display = 'block';
      stopIcon.style.display = 'none';
      sendBtn.classList.remove('stop-mode');
      updateSendBtn();
      chatInput.focus();
      scrollToBottom(true);
      updateScrollBtn();
    }
  }

  function summarizeArgs(argsStr) {
    if (!argsStr) return '';
    try {
      const o = JSON.parse(argsStr);
      if (!o || typeof o !== 'object') return argsStr.length > 60 ? argsStr.slice(0, 60) + '…' : argsStr;
      const entries = Object.entries(o).slice(0, 2).map(([k, v]) => {
        let s = typeof v === 'string' ? v : JSON.stringify(v);
        if (s.length > 40) s = s.slice(0, 40) + '…';
        return `${k}: ${s}`;
      });
      return entries.join(', ') + (Object.keys(o).length > 2 ? ', …' : '');
    } catch (e) {
      return argsStr.length > 60 ? argsStr.slice(0, 60) + '…' : argsStr;
    }
  }

  async function callModelOnce(config, messages, reasoning, attachments, signal, onContent, onThinking) {
    const response = await fetchModelResponse(config, messages, reasoning, attachments, signal);
    const contentType = (response.headers.get('content-type') || '').toLowerCase();

    if (contentType.includes('text/event-stream') && response.body) {
      return await processStreamingResponse(response, onContent, onThinking);
    } else {
      const json = await response.json();
      const result = extractFromJson(json);
      if (result.thinking) await typewriterReveal(result.thinking, onThinking, signal, { maxDuration: 1600 });
      if (signal.aborted) throw abortError();
      if (result.text) await typewriterReveal(result.text, onContent, signal);
      if (signal.aborted) throw abortError();
      return result;
    }
  }

  /* ============================================================
     FILES BUTTON
     ============================================================ */
  filesBtn.addEventListener('click', () => {
    const files = vfs.list();
    if (files.length === 0) return;
    const list = files.map(f => `• ${f} (${vfs.read(f).length} chars)`).join('\n');
    if (confirm(`Workspace files (${files.length}):\n\n${list}\n\nDownload as project.zip?`)) {
      downloadVfsAsZip();
    }
  });

  /* ============================================================
     EVENTS
     ============================================================ */
  sendBtn.addEventListener('click', generateResponse);
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (state.isGenerating) return;
      generateResponse();
    }
  });
  chatInput.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 200) + 'px';
    updateSendBtn();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      modelDropdown.classList.remove('active');
      modelBtn.classList.remove('active');
      sidebar.classList.remove('active');
      sidebarOverlay.classList.remove('active');
      previewModal.classList.remove('open');
    }
  });

  /* ============================================================
     BOOTSTRAP
     ============================================================ */
  async function loadConfig() {
    try {
      if (location.protocol === 'file:') throw new Error('file:// protocol — local fetch blocked');
      const res = await fetch('models.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data || !Array.isArray(data.models) || data.models.length === 0) throw new Error('models.json missing models array');
      console.log('[LocalMind] Loaded models.json —', data.models.length, 'model(s)');
      return data;
    } catch (err) {
      console.warn('[LocalMind] models.json load failed — using built-in fallback:', err.message);
      return DEFAULT_CONFIG;
    }
  }

  async function init() {
    const cfg = await loadConfig();
    SETTINGS = cfg.settings || {};
    MODELS_LIST = cfg.models;
    MODEL_CONFIG = {};
    MODELS_LIST.forEach(m => { MODEL_CONFIG[m.key] = m; });
    applySettings();
    populateModelDropdown();
    const defaultKey = (SETTINGS.defaultModel && MODEL_CONFIG[SETTINGS.defaultModel])
      ? SETTINGS.defaultModel
      : MODELS_LIST[0].key;
    setMode('coding');
    selectModel(defaultKey);
    chatInput.focus();
    updateSendBtn();
  }

  init().catch(err => {
    console.error('[LocalMind] Init failed:', err);
  });
</script>
</body>
