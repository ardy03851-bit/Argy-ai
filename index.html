<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>LocalMind · Agent Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg-base: #0e0d0c;
    --bg-surface: #1a1817;
    --bg-input: #23201e;
    --border: #332d2a;
    --border-focus: #4a3f39;
    --text-main: #f2ebe6;
    --text-muted: #9c8d83;
    --accent: #d97757;
    --accent-hover: #e88a6c;
    --accent-glow: rgba(217, 119, 87, 0.15);
    --danger: #ef4444;
    
    --font-ui: 'Inter', -apple-system, sans-serif;
    --font-serif: 'Lora', Georgia, serif;
    --font-mono: 'JetBrains Mono', monospace;
    
    --glow-gemini: rgba(66, 133, 244, 0.6);
    --glow-claude: rgba(217, 119, 87, 0.6);
    --glow-luna: rgba(16, 163, 127, 0.6);
    --glow-deepseek: rgba(77, 107, 254, 0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100dvh;
    width: 100vw;
    background-color: var(--bg-base);
    color: var(--text-main);
    font-family: var(--font-ui);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.4s ease;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(circle at 50% 0%, rgba(217, 119, 87, 0.03) 0%, transparent 50%),
      radial-gradient(circle at 50% 100%, rgba(180, 140, 100, 0.02) 0%, transparent 50%);
    z-index: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  body.mode-coding {
    --bg-base: #0a0a0b;
    --bg-surface: #121316;
    --bg-input: #191a1e;
    --border: #282a30;
    --border-focus: #3f424b;
    --text-main: #e2e8f0;
    --text-muted: #8a9bb0;
  }
  body.mode-coding::before {
    background: radial-gradient(circle at 50% 0%, rgba(66, 133, 244, 0.04) 0%, transparent 60%);
  }
  body.mode-coding .welcome-title {
    font-family: var(--font-serif);
    font-weight: 400;
    letter-spacing: -0.02em;
  }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100vw;
    max-width: 960px;
    margin: 0 auto;
  }

  /* ── Hamburger & Sidebar ── */
  .hamburger {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 50;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 40px;
    height: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .hamburger:hover { background: #1e2024; border-color: var(--border-focus); }
  .hamburger span {
    display: block;
    width: 18px;
    height: 2px;
    background: var(--text-main);
    border-radius: 2px;
    transition: 0.2s;
  }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 280px;
    background: var(--bg-surface);
    border-right: 1px solid var(--border);
    z-index: 70;
    transform: translateX(-100%);
    transition: transform 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sidebar.active { transform: translateX(0); }
  .sidebar h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 12px;
    padding-left: 8px;
  }
  .sidebar-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-main);
    font-family: var(--font-ui);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    width: 100%;
  }
  .sidebar-option:hover { background: rgba(255,255,255,0.04); }
  .sidebar-option.active {
    background: rgba(217, 119, 87, 0.08);
    border-color: rgba(217, 119, 87, 0.2);
  }
  .sidebar-option .icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    opacity: 0.8;
  }
  .sidebar-option .desc {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ── Chat Area ── */
  .chat-scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: 40px 24px 160px 24px;
    display: flex;
    flex-direction: column;
    gap: 32px;
    scroll-behavior: smooth;
  }

  .welcome-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .welcome-container.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-20px);
    position: absolute;
  }
  .welcome-title {
    font-family: var(--font-serif);
    font-size: 42px;
    font-weight: 400;
    letter-spacing: -0.5px;
    color: var(--text-main);
    text-align: center;
    margin-bottom: 16px;
  }
  .welcome-subtitle {
    font-size: 15px;
    color: var(--text-muted);
    text-align: center;
    max-width: 440px;
    line-height: 1.6;
  }

  .message-row {
    display: flex;
    width: 100%;
    gap: 18px;
    animation: slideUp 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    opacity: 0;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message-row.user { justify-content: flex-end; }

  /* ── AI Avatar ── */
  .msg-avatar {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
    background: transparent;
    border: none;
    box-shadow: none;
    border-radius: 0;
    overflow: visible;
    position: relative;
  }
  .msg-avatar img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(217, 119, 87, 0.25));
    animation: avatarBreathe 4s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes avatarBreathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-1.5px) scale(1.04); }
  }
  .msg-avatar.thinking img {
    animation: avatarThink 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 12px rgba(217, 119, 87, 0.7));
  }
  @keyframes avatarThink {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.85; }
    50% { transform: scale(1.1) rotate(4deg); opacity: 1; }
  }
  .message-row.user .msg-avatar { display: none; }

  .bubble {
    line-height: 1.7;
    font-size: 16px;
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 85%;
    width: fit-content;
  }
  .message-row.user .bubble {
    background: var(--bg-surface);
    padding: 14px 20px;
    border-radius: 18px;
    border-bottom-right-radius: 4px;
    border: 1px solid var(--border);
    font-size: 15px;
  }
  .message-row.assistant .bubble {
    background: transparent;
    padding: 4px 0;
    max-width: 100%;
    white-space: normal;
    width: 100%;
  }
  .message-row.assistant .bubble .content {
    white-space: pre-wrap;
    word-break: break-word;
  }
  
  /* List styles */
  .message-row.assistant .bubble ul,
  .message-row.assistant .bubble ol {
    padding-left: 24px;
    margin: 8px 0;
  }
  .message-row.assistant .bubble li {
    margin-bottom: 4px;
  }

  .cursor::after {
    content: '▍';
    color: var(--accent);
    font-size: 14px;
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Loading Indicator */
  .waiting-indicator {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    font-size: 14px;
    height: 24px;
  }
  .waiting-indicator .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Thinking Panel ── */
  .thinking-panel {
    margin: 2px 0 14px 0;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.015);
    border: 1px solid var(--border);
    overflow: hidden;
    animation: thinkIn 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    width: 100%;
    max-width: 100%;
  }
  @keyframes thinkIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .thinking-header {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 11px 14px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    text-align: left;
    transition: background 0.2s;
    white-space: normal;
  }
  .thinking-header:hover { background: rgba(255, 255, 255, 0.03); }
  .thinking-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .thinking-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    animation: thinkingPulse 1.4s ease-in-out infinite;
  }
  @keyframes thinkingPulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(217, 119, 87, 0.45); }
    50% { opacity: 0.5; box-shadow: 0 0 0 6px rgba(217, 119, 87, 0); }
  }
  .thinking-chevron {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    opacity: 0.7;
    transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  .thinking-panel.expanded .thinking-chevron {
    transform: rotate(180deg);
  }
  .thought-check {
    color: var(--accent);
    flex-shrink: 0;
  }
  .thinking-body-wrapper {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.42s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  .thinking-panel.expanded .thinking-body-wrapper {
    max-height: 340px;
    overflow-y: auto;
  }
  .thinking-body {
    padding: 0 14px 13px 14px;
    font-size: 13px;
    line-height: 1.65;
    color: #a0aab8;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--font-mono);
  }
  .thinking-panel.done .thinking-dot { display: none; }

  /* ── Code Blocks ── */
  .code-block-wrapper {
    margin: 12px 0;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #0d0c0b;
  }
  .code-block-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }
  .copy-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .copy-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }
  .code-block-wrapper pre {
    margin: 0;
    padding: 16px;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.5;
  }
  .code-block-wrapper code { font-family: var(--font-mono); }

  /* ── Bottom Bar ── */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 20px 24px 24px 24px;
    background: linear-gradient(0deg, var(--bg-base) 70%, transparent 100%);
    display: flex;
    justify-content: center;
  }
  .input-wrapper {
    width: 100%;
    max-width: 800px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
  }
  .input-wrapper.disabled { opacity: 0.6; cursor: not-allowed; }
  .input-wrapper:focus-within:not(.disabled) {
    border-color: var(--border-focus);
    box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 0 3px var(--accent-glow);
  }

  /* Attachment Chips */
  .attachments-container {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 4px 8px;
  }
  .attachment-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    color: var(--text-main);
    max-width: 200px;
  }
  .attachment-chip span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .attachment-chip .remove-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    transition: background 0.2s;
  }
  .attachment-chip .remove-btn:hover {
    background: rgba(255,255,255,0.1);
    color: var(--text-main);
  }

  .chat-input {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text-main);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    resize: none;
    min-height: 44px;
    max-height: 200px;
    outline: none;
    padding: 10px 16px;
  }
  .chat-input::placeholder { color: #6b5e55; }

  .input-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 6px 4px 10px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .left-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* ── Model Selector ── */
  .model-selector-wrapper { position: relative; }
  .model-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 8px 12px;
    border-radius: 99px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    max-width: 220px;
  }
  .model-btn:hover:not(.loading) { background: rgba(255,255,255,0.04); color: var(--text-main); }
  .model-btn .chevron-icon {
    width: 14px;
    height: 14px;
    opacity: 0.7;
    flex-shrink: 0;
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  .model-btn.active .chevron-icon {
    transform: rotate(180deg);
  }
  .model-icon {
    width: 18px; height: 18px;
    opacity: 0.9;
    border-radius: 4px;
    flex-shrink: 0;
  }
  #currentModelName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .model-dropdown {
    position: absolute;
    bottom: calc(100% + 12px);
    left: 0;
    width: 320px;
    background: #121316;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 6px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    z-index: 100;
    display: flex;
    flex-direction: column;
    isolation: isolate;
  }
  .model-dropdown.active {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .model-option {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s;
    gap: 12px;
    background: #121316;
    z-index: 1;
    margin-bottom: 2px;
  }
  .model-option:last-child { margin-bottom: 0; }
  
  /* Thin 1px Gradient Border */
  .model-option::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    padding: 1px;
    background: var(--glow-gradient);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    animation: gradientShift 4s linear infinite;
    background-size: 200% 200%;
  }
  .model-option:hover::before, 
  .model-option.active::before {
    opacity: 0.8;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .model-option[data-model="gemini"] { --glow-gradient: linear-gradient(45deg, #4285F4, #EA4335, #FBBC05, #34A853, #4285F4); }
  .model-option[data-model="claude"] { --glow-gradient: linear-gradient(45deg, #D97757, #E88A6C, #D97757); }
  .model-option[data-model="luna"] { --glow-gradient: linear-gradient(45deg, #10A37F, #0A7A5E, #10A37F); }
  .model-option[data-model="deepseek"] { --glow-gradient: linear-gradient(45deg, #4D6BFE, #8C52FF, #4D6BFE); }

  .model-option-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .model-option-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .model-option-name { font-size: 13px; font-weight: 500; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .model-option-meta { font-size: 11px; color: var(--text-muted); }
  .model-brand-icon {
    width: 24px; height: 24px;
    flex-shrink: 0;
    opacity: 0.9;
    border-radius: 4px;
  }
  .model-status-icon {
    width: 16px; height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    flex-shrink: 0;
    z-index: 3;
  }

  /* ── Reasoning Controls ── */
  .reasoning-toggle {
    display: flex;
    align-items: center;
    background: rgba(0,0,0,0.2);
    border-radius: 99px;
    padding: 3px;
    border: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .reasoning-option {
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.2s;
  }
  .reasoning-option.active {
    background: var(--text-main);
    color: var(--bg-base);
  }

  /* ── Claude 3D Metallic Slider ── */
  .claude-slider-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    width: 160px;
    height: 36px;
    padding: 0 4px;
  }
  .claude-slider-track-bg {
    position: absolute;
    inset: 8px 0;
    border-radius: 10px;
    z-index: 1;
    background: #111214;
    box-shadow: 
      inset 0 3px 8px rgba(0,0,0,0.8), 
      inset 0 -1px 2px rgba(255,255,255,0.1),
      0 1px 2px rgba(255,255,255,0.05);
    overflow: hidden;
  }
  .claude-slider-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 50%;
    background: linear-gradient(90deg, #5a3a2a, #d97757, #e88a6c);
    border-radius: 10px;
    z-index: 2;
    transition: width 0.1s ease-out;
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.2);
  }

  /* ============================================================
     HELPERS & MARKDOWN RENDERER
     ============================================================ */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function renderMarkdown(text) {
    if (!text) return '';
    const parts = text.split(/(```[\s\S]*?```)/g);
    let html = '';

    parts.forEach(part => {
      if (part.startsWith('```')) {
        const match = part.match(/```(\w*)\n([\s\S]*?)```/);
        const lang = match ? match[1] : 'text';
        const code = match ? match[2] : part.slice(3, -3);
        const id = 'code-' + Math.random().toString(36).substr(2, 9);
        html += `
          <div class="code-block-wrapper">
            <div class="code-block-header">
              <span>${escapeHtml(lang)}</span>
              <button class="copy-btn" onclick="navigator.clipboard.writeText(document.getElementById('${id}').innerText)">Copy</button>
            </div>
            <pre><code id="${id}" class="language-${escapeHtml(lang)}">${escapeHtml(code)}</code></pre>
          </div>
        `;
      } else {
        let t = escapeHtml(part);
        const lines = t.split('\n');
        let inList = false;
        let listType = '';
        let processed = [];

        lines.forEach(line => {
          const ulMatch = line.match(/^\s*[-*]\s+(.*)$/);
          const olMatch = line.match(/^\s*\d+\.\s+(.*)$/);

          if (ulMatch) {
            if (!inList || listType !== 'ul') {
              if (inList) processed.push(`</${listType}>`);
              processed.push('<ul>');
              inList = true;
              listType = 'ul';
            }
            processed.push(`<li>${ulMatch[1]}</li>`);
            return;
          }

          if (olMatch) {
            if (!inList || listType !== 'ol') {
              if (inList) processed.push(`</${listType}>`);
              processed.push('<ol>');
              inList = true;
              listType = 'ol';
            }
            processed.push(`<li>${olMatch[1]}</li>`);
            return;
          }

          if (inList) {
            processed.push(`</${listType}>`);
            inList = false;
            listType = '';
          }

          if (line.trim() === '') {
             processed.push('<br>');
          } else {
             processed.push(`${line}<br>`);
          }
        });

        if (inList) processed.push(`</${listType}>`);

        let joined = processed.join('');
        joined = joined.replace(/<br><ul>/g, '<ul>');
        joined = joined.replace(/<br><ol>/g, '<ol>');
        joined = joined.replace(/<\/ul><br>/g, '</ul>');
        joined = joined.replace(/<\/ol><br>/g, '</ol>');

        joined = joined.replace(/`([^`\n]+)`/g, '<code>$1</code>');
        joined = joined.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        joined = joined.replace(/\*(.*?)\*/g, '<em>$1</em>');
        html += `<span>${joined}</span>`;
      }
    });
    return html;
  }

  fileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      if (file.size > 5 * 1024 * 1024) {
        alert(`File ${file.name} is too large (max 5MB).`);
        continue;
      }

      let content = '';
      let type = 'text';

      if (file.name.endsWith('.zip')) {
        try {
          const zip = await JSZip.loadAsync(file);
          const textFiles = [];
          for (const [filename, zipEntry] of Object.entries(zip.files)) {
            if (!zipEntry.dir && /\.(txt|md|html|js|css|json|py|ts|tsx|jsx|c|cpp|h|hpp|java|cs|go|rs|rb|php)$/i.test(filename)) {
              const fileContent = await zipEntry.async('string');
              textFiles.push(`--- File: ${filename} ---\n${fileContent}`);
            }
          }
          content = textFiles.join('\n\n');
        } catch (err) {
          console.error('Error reading zip:', err);
          alert('Failed to read zip file.');
          continue;
        }
      } else if (/\.(txt|md|html|js|css|json|py|ts|tsx|jsx|c|cpp|h|hpp|java|cs|go|rs|rb|php)$/i.test(file.name) || file.type.startsWith('text/')) {
        content = await file.text();
      } else if (file.type.startsWith('image/')) {
        content = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(file);
        });
        type = 'image';
      } else {
        continue;
      }

      if (content) {
        state.attachments.push({ name: file.name, content, type });
      }
    }
    fileInput.value = '';
    renderAttachments();
  });

  async function pollVideoTask(taskId) {
    let attempts = 0;
    const maxAttempts = 60; // 5 minutes max

    if (state.videoPollingInterval) clearInterval(state.videoPollingInterval);

    state.videoPollingInterval = setInterval(async () => {
      attempts++;
      if (attempts > maxAttempts) {
        clearInterval(state.videoPollingInterval);
        studioResult.innerHTML = `<div style="color:var(--danger)">Generation timed out. Please try again.</div>`;
        generateVideoBtn.disabled = false;
        generateVideoBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.6H22l-6.2 4.5 2.4 7.6-6.2-4.6-6.2 4.6 2.4-7.6L2 9.6h7.6z"/></svg> Generate Video';
        return;
      }

      try {
        const res = await fetch(`https://api.kie.ai/api/v1/jobs/getTask?taskId=${taskId}`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${API_KEY}`
          }
        });

        if (!res.ok) return; // Keep polling if there's a transient network error

        const json = await res.json();
        
        if (json.code === 200 && json.data) {
          const status = json.data.status;
          
          if (status === 'SUCCESS' || status === 'completed') {
            clearInterval(state.videoPollingInterval);
            
            let videoUrl = json.data.resultUrl || (json.data.output && json.data.output[0]);
            if (!videoUrl) throw new Error('Task completed but no video URL found.');

            studioResult.innerHTML = `
              <video src="${videoUrl}" controls autoplay loop></video>
              <a href="${videoUrl}" download="seedance-video.mp4" class="download-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                Download Video
              </a>
            `;
            
            generateVideoBtn.disabled = false;
            generateVideoBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.6H22l-6.2 4.5 2.4 7.6-6.2-4.6-6.2 4.6 2.4-7.6L2 9.6h7.6z"/></svg> Generate Video';
            
          } else if (status === 'FAILED' || status === 'failed') {
            clearInterval(state.videoPollingInterval);
            throw new Error(json.data.error || 'Video generation failed');
          } else {
            // Still processing
            const progress = json.data.progress || 0;
            studioResult.innerHTML = `
              <div class="studio-waiting">
                <div class="spinner-large"></div>
                <div>Generating video... ${progress}%</div>
              </div>
            `;
          }
        }
      } catch (err) {
        console.error('Polling error:', err);
        clearInterval(state.videoPollingInterval);
        studioResult.innerHTML = `<div style="color:var(--danger)">Error: ${escapeHtml(err.message)}</div>`;
        generateVideoBtn.disabled = false;
        generateVideoBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.6H22l-6.2 4.5 2.4 7.6-6.2-4.6-6.2 4.6 2.4-7.6L2 9.6h7.6z"/></svg> Generate Video';
      }
    }, 5000); // Poll every 5 seconds
  }

  /* ============================================================
     CHAT API CALLS
     ============================================================ */
  async function fetchModelResponse(config, messages, reasoning, attachments) {
    let endpoint = config.endpoint;
    let body = {};

    let textContext = '';
    const imageAttachments = [];

    attachments.forEach(att => {
      if (att.type === 'text') {
        textContext += `\n\n--- Attached File: ${att.name} ---\n${att.content}`;
      } else if (att.type === 'image') {
        imageAttachments.push(att.content);
      }
    });

    let augmentedMessages = JSON.parse(JSON.stringify(messages));
    if (textContext) {
      const lastMsg = augmentedMessages[augmentedMessages.length - 1];
      if (lastMsg.role === 'user') {
        lastMsg.content += textContext;
      }
    }

    if (config.id === 'deepseek-v4-1-flash') {
      const input = augmentedMessages.map(m => {
        const parts = [{
          type: m.role === 'user' ? 'input_text' : 'output_text',
          text: m.content
        }];
        return { type: 'message', role: m.role, content: parts };
      });

      if (imageAttachments.length > 0) {
        const lastMsg = input[input.length - 1];
        imageAttachments.forEach(img => {
          lastMsg.content.push({ type: 'input_image', image_url: img });
        });
      }

      body = {
        model: config.id,
        stream: false,
        instructions: SYSTEM_PROMPTS[state.mode],
        input: input,
        reasoning: { effort: reasoning }
      };
    } else if (config.id === 'gemini-4-argon') {
      const gMessages = [];
      if (SYSTEM_PROMPTS[state.mode]) {
         gMessages.push({ role: 'system', content: SYSTEM_PROMPTS[state.mode] });
      }
      
      augmentedMessages.forEach(m => {
         if (m.role === 'user') {
            const contentParts = [{ type: 'text', text: m.content }];
            if (m === augmentedMessages[augmentedMessages.length - 1] && imageAttachments.length > 0) {
              imageAttachments.forEach(img => {
                contentParts.push({ type: 'image_url', image_url: { url: img } });
              });
            }
            gMessages.push({
               role: 'user',
               content: contentParts
            });
         } else {
            gMessages.push({ role: m.role, content: m.content });
         }
      });

      body = {
         messages: gMessages,
         tools: [{ type: 'function', function: { name: 'googleSearch' } }],
         stream: true,
         include_thoughts: true,
         reasoning_effort: reasoning
      };
    } else if (config.id === 'gpt-6-luna') {
      const input = augmentedMessages.map(m => {
        const parts = [{
          type: m.role === 'user' ? 'input_text' : 'output_text',
          text: m.content
        }];
        return { role: m.role, content: parts };
      });

      if (imageAttachments.length > 0) {
        const lastMsg = input[input.length - 1];
        imageAttachments.forEach(img => {
          lastMsg.content.push({ type: 'input_image', image_url: img });
        });
      }

      body = {
        model: config.id,
        stream: false,
        input: input,
        tools: [{ type: 'web_search' }],
        reasoning: { effort: reasoning }
      };
    } else {
      // Claude specific endpoint and body format
      const claudeMessages = augmentedMessages.map(m => {
        if (m.role === 'user' && m === augmentedMessages[augmentedMessages.length - 1] && imageAttachments.length > 0) {
           const contentParts = [{ type: 'text', text: m.content }];
           imageAttachments.forEach(img => {
             contentParts.push({ type: 'image_url', image_url: { url: img } });
           });
           return { role: 'user', content: contentParts };
        }
        return { role: m.role, content: m.content };
      });

      body = {
        model: config.id,
        messages: claudeMessages,
        system: SYSTEM_PROMPTS[state.mode],
        max_tokens: 4096,
        stream: false,
        thinkingFlag: true
      };
    }
    
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${API_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body),
      signal: state.abortController.signal
    });
    
    if (!res.ok) {
      const err = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status}: ${err.slice(0, 300)}`);
    }
    return res;
  }

  /* ============================================================
     CHAT STREAM PARSER
     ============================================================ */
  async function processResponse(response, config, onContent, onThinking) {
    if (config.id === 'deepseek-v4-1-flash' || config.id === 'gpt-6-luna') {
      const json = await response.json();
      if (json.error) throw new Error(json.error.message || JSON.stringify(json.error));
      
      const reasoningItem = json.output?.find(o => o.type === 'reasoning');
      const messageItem = json.output?.find(o => o.type === 'message');
      
      if (reasoningItem && reasoningItem.summary) {
        const thinkText = reasoningItem.summary.map(s => s.text).join('\n');
        if (thinkText) onThinking(thinkText);
      }
      
      if (messageItem && messageItem.content) {
        const text = messageItem.content.map(c => c.text).join('');
        onContent(text);
      }
      return;
    }

    if (config.id === 'claude-opus-5-5') {
      const json = await response.json();
      if (json.error) throw new Error(json.error.message || JSON.stringify(json.error));
      
      if (json.content && Array.isArray(json.content)) {
        json.content.forEach(block => {
          if (block.type === 'thinking' && block.thinking) {
            onThinking(block.thinking);
          }
          if (block.type === 'text' && block.text) {
            onContent(block.text);
          }
        });
      } else if (typeof json.content === 'string') {
        onContent(json.content);
      }
      return;
    }

    // Standard Streaming (Gemini)
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;
        if (trimmed.startsWith('event: ')) continue;

        if (trimmed.startsWith('data: ')) {
          const payload = trimmed.slice(6).trim();
          if (payload === '[DONE]') return;

          let json;
          try { json = JSON.parse(payload); } catch { continue; }
          if (json.error) throw new Error(json.error.message || JSON.stringify(json.error));

          if (json.choices && json.choices[0]) {
            const choice = json.choices[0];
            const delta = choice.delta || {};

            if (delta.reasoning_content) onThinking(delta.reasoning_content);
            if (delta.reasoning) onThinking(delta.reasoning);
            if (delta.thinking) onThinking(delta.thinking);

            if (delta.content != null) {
              if (typeof delta.content === 'string') {
                if (delta.content) onContent(delta.content);
              } else if (Array.isArray(delta.content)) {
                for (const part of delta.content) {
                  if (!part) continue;
                  const isThought = part.thought === true || (part.type && /thought|reasoning/i.test(part.type));
                  if (isThought) {
                    if (part.text) onThinking(part.text);
                  } else if (part.type === 'text' || typeof part.text === 'string') {
                    if (part.text) onContent(part.text);
                  }
                }
              }
            }
          }
        }
      }
    }
  }

  /* ============================================================
     CHAT GENERATE RESPONSE
     ============================================================ */
  async function generateResponse() {
    if (state.isGenerating) {
      if (state.abortController) state.abortController.abort();
      return;
    }

    const text = chatInput.value.trim();
    if (!text && state.attachments.length === 0) return;

    state.isGenerating = true;
    chatInput.value = '';
    chatInput.style.height = 'auto';
    sendIcon.style.display = 'none';
    stopIcon.style.display = 'block';
    sendBtn.classList.add('stop-mode');

    addUserMessage(text, state.attachments);
    state.messages.push({ role: 'user', content: text });
    
    const currentAttachments = [...state.attachments];
    state.attachments = [];
    renderAttachments();

    const { bubble, avatar } = createAssistantRow();

    let rawText = '';
    let rawThinking = '';
    let hasThinking = false;
    let hasContent = false;
    let thinkingPanel = null;
    let thinkingBody = null;
    let contentDiv = null;
    let pendingContentRender = false;
    let pendingThinkingRender = false;

    state.abortController = new AbortController();

    function ensureThinkingPanel() {
      if (thinkingPanel) return;
      const waitInd = bubble.querySelector('.waiting-indicator');
      if (waitInd) waitInd.remove();
      
      thinkingPanel = createThinkingPanel();
      thinkingBody = thinkingPanel.querySelector('.thinking-body');
      bubble.appendChild(thinkingPanel);
    }

    function ensureContentDiv() {
      if (contentDiv) return;
      const waitInd = bubble.querySelector('.waiting-indicator');
      if (waitInd) waitInd.remove();
      
      contentDiv = document.createElement('div');
      contentDiv.className = 'content cursor';
      bubble.appendChild(contentDiv);
    }

    function finalizeThinking(forceCollapse = true) {
      if (!thinkingPanel || thinkingPanel.dataset.finalized) return;
      thinkingPanel.dataset.finalized = 'true';
      thinkingPanel.classList.add('done');

      const userWantsExpanded = thinkingPanel.dataset.userExpanded === 'true';
      if (forceCollapse && !userWantsExpanded) {
        thinkingPanel.classList.remove('expanded');
      }

      const label = thinkingPanel.querySelector('.thinking-label');
      if (label) {
        label.innerHTML = `<svg class="thought-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><path d="M20 6L9 17l-5-5"/></svg><span class="thinking-text">Thought process</span>`;
      }
      avatar.classList.remove('thinking');
    }

    function onThinking(chunk) {
      if (!chunk) return;
      rawThinking += chunk;

      if (!hasThinking) {
        hasThinking = true;
        ensureThinkingPanel();
        avatar.classList.add('thinking');
      }

      if (!pendingThinkingRender) {
        pendingThinkingRender = true;
        requestAnimationFrame(() => {
          thinkingBody.textContent = rawThinking;
          const wrapper = thinkingBody.parentElement;
          if (wrapper && thinkingPanel.classList.contains('expanded')) {
            const nearBottom = wrapper.scrollHeight - wrapper.scrollTop - wrapper.clientHeight < 40;
            if (nearBottom) wrapper.scrollTop = wrapper.scrollHeight;
          }
          scrollToBottom();
          pendingThinkingRender = false;
        });
      }
    }

    function onContent(chunk) {
      if (!chunk) return;
      rawText += chunk;

      if (!hasContent) {
        hasContent = true;
        ensureContentDiv();
        if (hasThinking) finalizeThinking();
      }

      if (!pendingContentRender) {
        pendingContentRender = true;
        requestAnimationFrame(() => {
          const codeBlockCount = (rawText.match(/```/g) || []).length;
          if (codeBlockCount % 2 !== 0) {
            contentDiv.textContent = rawText;
          } else {
            contentDiv.innerHTML = renderMarkdown(rawText);
            contentDiv.querySelectorAll('pre code').forEach(block => {
              try { hljs.highlightElement(block); } catch {}
            });
          }
          scrollToBottom();
          pendingContentRender = false;
        });
      }
    }

    try {
      const config = MODEL_CONFIG[state.model];
      const response = await fetchModelResponse(config, state.messages, state.reasoning, currentAttachments);
      await processResponse(response, config, onContent, onThinking);

    } catch (err) {
      if (err.name === 'AbortError') {
        rawText = rawText ? rawText + '\n\n*[Generation stopped]*' : '*[Generation stopped]*';
      } else {
        console.error(err);
        const errMsg = `⚠️ **Error:** ${err.message}`;
        rawText = rawText ? rawText + '\n\n' + errMsg : errMsg;
      }
      if (!contentDiv) {
        hasContent = true;
        ensureContentDiv();
        if (hasThinking) finalizeThinking(false);
      }
    } finally {
      if (contentDiv) {
        contentDiv.innerHTML = renderMarkdown(rawText);
        contentDiv.querySelectorAll('pre code').forEach(block => {
          try { hljs.highlightElement(block); } catch {}
        });
        contentDiv.classList.remove('cursor');
      }
      
      if (!hasContent && !hasThinking) {
         ensureContentDiv();
         contentDiv.textContent = rawText || '*[No response received]*';
         contentDiv.classList.remove('cursor');
      }
      
      if (thinkingPanel && hasContent) {
        finalizeThinking();
      }
      avatar.classList.remove('thinking');

      if (rawText.trim()) {
        state.messages.push({ role: 'assistant', content: rawText });
      }

      state.isGenerating = false;
      state.abortController = null;
      sendIcon.style.display = 'block';
      stopIcon.style.display = 'none';
      sendBtn.classList.remove('stop-mode');
      chatInput.focus();
      scrollToBottom(true);
    }
  }

  /* ============================================================
     EVENTS & INIT
     ============================================================ */
  sendBtn.addEventListener('click', generateResponse);

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      generateResponse();
    }
  });

  chatInput.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 200) + 'px';
  });

  setMode('coding');
  chatInput.focus();
</script>
</body>
</html>
