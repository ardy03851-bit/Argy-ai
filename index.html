<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>LocalMind · Agent Workspace</title>
<link rel="icon" type="image/png" href="icon.png" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg-base: #0e0d0c;
    --bg-surface: #1a1817;
    --bg-input: #23201e;
    --border: #332d2a;
    --border-focus: #4a3f39;
    --text-main: #f2ebe6;
    --text-muted: #9c8d83;
    --accent: #d97757;
    --accent-hover: #e88a6c;
    --accent-glow: rgba(217, 119, 87, 0.15);
    --danger: #ef4444;

    --font-ui: 'Inter', -apple-system, sans-serif;
    --font-serif: 'Lora', Georgia, serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100dvh;
    width: 100vw;
    background-color: var(--bg-base);
    color: var(--text-main);
    font-family: var(--font-ui);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.4s ease;
  }

  /* Default layers (overridable by models.json → settings) */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 0%, rgba(217, 119, 87, 0.03) 0%, transparent 50%),
      radial-gradient(circle at 50% 100%, rgba(180, 140, 100, 0.02) 0%, transparent 50%);
    z-index: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: url('bg.png') center / cover no-repeat;
    opacity: 0.06;
    z-index: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    filter: saturate(0.85);
  }

  body.mode-coding {
    --bg-base: #0a0a0b;
    --bg-surface: #121316;
    --bg-input: #191a1e;
    --border: #282a30;
    --border-focus: #3f424b;
    --text-main: #e2e8f0;
    --text-muted: #8a9bb0;
  }
  body.mode-coding::before {
    background: radial-gradient(circle at 50% 0%, rgba(66, 133, 244, 0.04) 0%, transparent 60%);
  }
  body.mode-coding::after { opacity: 0.05; }
  body.mode-coding .welcome-title {
    font-family: var(--font-serif);
    font-weight: 400;
    letter-spacing: -0.02em;
  }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100vw;
    max-width: 960px;
    margin: 0 auto;
  }

  /* ── Hamburger & Sidebar ── */
  .hamburger {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 50;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 40px;
    height: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .hamburger:hover { background: #1e2024; border-color: var(--border-focus); }
  .hamburger span {
    display: block;
    width: 18px;
    height: 2px;
    background: var(--text-main);
    border-radius: 2px;
    transition: 0.2s;
  }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 280px;
    background: var(--bg-surface);
    border-right: 1px solid var(--border);
    z-index: 70;
    transform: translateX(-100%);
    transition: transform 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sidebar.active { transform: translateX(0); }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 8px 18px 8px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-brand img {
    width: 24px;
    height: 24px;
    object-fit: contain;
    opacity: 0.9;
    filter: drop-shadow(0 2px 6px rgba(217,119,87,0.25));
  }
  .sidebar-brand span {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.2px;
    color: var(--text-main);
  }

  .sidebar h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 12px;
    padding-left: 8px;
  }
  .sidebar-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-main);
    font-family: var(--font-ui);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    width: 100%;
  }
  .sidebar-option:hover { background: rgba(255,255,255,0.04); }
  .sidebar-option.active {
    background: rgba(217, 119, 87, 0.08);
    border-color: rgba(217, 119, 87, 0.2);
  }
  .sidebar-option .icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    opacity: 0.8;
  }
  .sidebar-option .desc {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ── Chat Area ── */
  .chat-scroll-area {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 40px 24px 160px 24px;
    display: flex;
    flex-direction: column;
    gap: 32px;
    scroll-behavior: smooth;
    position: relative;
    z-index: 2;
  }

  .welcome-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .welcome-container.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-20px);
    position: absolute;
  }
  .welcome-icon {
    width: 72px;
    height: 72px;
    margin-bottom: 22px;
    object-fit: contain;
    opacity: 0.85;
    filter: drop-shadow(0 8px 28px rgba(217,119,87,0.22));
  }
  .welcome-title {
    font-family: var(--font-serif);
    font-size: 42px;
    font-weight: 400;
    letter-spacing: -0.5px;
    color: var(--text-main);
    text-align: center;
    margin-bottom: 16px;
  }
  .welcome-subtitle {
    font-size: 15px;
    color: var(--text-muted);
    text-align: center;
    max-width: 440px;
    line-height: 1.6;
  }

  .message-row {
    display: flex;
    width: 100%;
    gap: 18px;
    animation: slideUp 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    opacity: 0;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message-row.user { justify-content: flex-end; }

  /* ── AI Avatar ── */
  .msg-avatar {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
    background: transparent;
    border: none;
    box-shadow: none;
    border-radius: 0;
    overflow: visible;
    position: relative;
  }
  .msg-avatar img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(217, 119, 87, 0.25));
  }
  .msg-avatar > svg {
    width: 24px;
    height: 24px;
    color: var(--accent);
  }
  .msg-avatar.thinking img {
    animation: avatarGlow 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 12px rgba(217, 119, 87, 0.7));
  }
  @keyframes avatarGlow {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; }
  }
  .message-row.user .msg-avatar { display: none; }

  .bubble {
    line-height: 1.7;
    font-size: 16px;
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 85%;
    width: fit-content;
  }
  .message-row.user .bubble {
    background: var(--bg-surface);
    padding: 14px 20px;
    border-radius: 18px;
    border-bottom-right-radius: 4px;
    border: 1px solid var(--border);
    font-size: 15px;
  }
  .message-row.assistant .bubble {
    background: transparent;
    padding: 4px 0;
    max-width: 100%;
    white-space: normal;
    width: 100%;
  }

  /* ── Markdown Text ── */
  .content { word-break: break-word; }
  .md-block { margin: 0; }
  .md-text {
    white-space: normal;
    word-break: break-word;
    line-height: 1.7;
    font-size: 16px;
  }
  .md-text > *:first-child { margin-top: 0; }
  .md-text > *:last-child { margin-bottom: 0; }
  .md-text p { margin: 0 0 12px; }
  .md-text ul, .md-text ol { margin: 4px 0 12px; padding-left: 22px; }
  .md-text li { margin-bottom: 4px; }
  .md-text h1, .md-text h2, .md-text h3, .md-text h4, .md-text h5, .md-text h6 {
    margin: 18px 0 8px; font-weight: 600; line-height: 1.3;
  }
  .md-text h1 { font-size: 22px; }
  .md-text h2 { font-size: 19px; }
  .md-text h3 { font-size: 17px; }
  .md-text h4 { font-size: 16px; }
  .md-text blockquote {
    margin: 8px 0; padding-left: 14px;
    border-left: 3px solid var(--border-focus);
    color: var(--text-muted);
  }
  .md-text hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .md-text code.inline-code {
    background: rgba(255,255,255,0.08);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 13px;
  }
  .md-text a { color: var(--accent); text-decoration: none; }
  .md-text a:hover { text-decoration: underline; }

  /* ── Streaming Cursor ── */
  .stream-cursor {
    display: inline-block;
    color: var(--accent);
    font-size: 14px;
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── Waiting Indicator ── */
  .waiting-indicator {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    font-size: 14px;
    height: 24px;
    min-width: 0;
  }
  .waiting-indicator span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .waiting-indicator .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Thinking Panel ── */
  .thinking-panel {
    margin: 2px 0 14px 0;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.015);
    border: 1px solid var(--border);
    overflow: hidden;
    animation: thinkIn 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    width: 100%;
    max-width: 100%;
    backdrop-filter: blur(2px);
  }
  @keyframes thinkIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .thinking-header {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 11px 14px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    text-align: left;
    transition: background 0.2s;
    white-space: normal;
  }
  .thinking-header:hover { background: rgba(255, 255, 255, 0.03); }
  .thinking-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .thinking-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    animation: thinkingPulse 1.4s ease-in-out infinite;
  }
  @keyframes thinkingPulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(217, 119, 87, 0.45); }
    50% { opacity: 0.5; box-shadow: 0 0 0 6px rgba(217, 119, 87, 0); }
  }
  .thinking-time {
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    opacity: 0.75;
    margin-left: 2px;
    font-family: var(--font-mono);
    flex-shrink: 0;
  }
  .thinking-chevron {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    opacity: 0.7;
    transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  .thinking-panel.expanded .thinking-chevron {
    transform: rotate(180deg);
  }
  .thought-check {
    color: var(--accent);
    flex-shrink: 0;
  }
  .thinking-body-wrapper {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.42s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  .thinking-panel.expanded .thinking-body-wrapper {
    max-height: 340px;
    overflow-y: auto;
  }
  .thinking-body-wrapper::-webkit-scrollbar { width: 6px; }
  .thinking-body-wrapper::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }
  .thinking-body {
    padding: 0 14px 13px 14px;
    font-size: 13px;
    line-height: 1.65;
    color: #a0aab8;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--font-mono);
  }
  .thinking-panel.done .thinking-dot { display: none; }

  /* ── Code Blocks ── */
  .code-block-wrapper {
    margin: 12px 0;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #0d0c0b;
  }
  .code-block-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px 12px 8px 16px;
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    flex-wrap: wrap;
  }
  .code-lang {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .code-block-wrapper.streaming .code-lang::after {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: thinkingPulse 1.2s ease-in-out infinite;
    flex-shrink: 0;
  }
  .code-actions {
    display: flex;
    gap: 4px;
    align-items: center;
    flex-wrap: wrap;
  }
  .code-action-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    font-family: var(--font-ui);
    transition: all 0.15s;
    white-space: nowrap;
  }
  .code-action-btn:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text-main);
    border-color: var(--border);
  }
  .code-action-btn.copied { color: #4ade80; }
  .code-block-wrapper pre {
    margin: 0;
    padding: 16px;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.5;
  }
  .code-block-wrapper code { font-family: var(--font-mono); }

  /* ── Message Actions ── */
  .message-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .msg-action-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-family: var(--font-ui);
    cursor: pointer;
    transition: all 0.2s;
  }
  .msg-action-btn:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text-main);
    border-color: var(--border-focus);
  }
  .msg-action-btn.copied {
    color: #4ade80;
    border-color: rgba(74, 222, 128, 0.35);
  }
  .msg-action-btn svg { width: 14px; height: 14px; }

  /* ── Bottom Bar ── */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 20px 24px 24px 24px;
    background: linear-gradient(0deg, var(--bg-base) 70%, transparent 100%);
    display: flex;
    justify-content: center;
    z-index: 3;
  }
  .input-wrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
  }
  .input-wrapper.disabled { opacity: 0.6; cursor: not-allowed; }
  .input-wrapper:focus-within:not(.disabled) {
    border-color: var(--border-focus);
    box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 0 3px var(--accent-glow);
  }
  .input-wrapper.generating {
    border-color: rgba(217, 119, 87, 0.35);
    animation: inputGlow 2.4s ease-in-out infinite;
  }
  @keyframes inputGlow {
    0%, 100% { box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 0 2px rgba(217,119,87,0.07); }
    50% { box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 0 3px rgba(217,119,87,0.16); }
  }
  .input-wrapper.generating::before {
    content: '';
    position: absolute;
    left: 12%; right: 12%; top: -1px; height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    background-size: 200% 100%;
    animation: scanLine 1.8s linear infinite;
    opacity: 0.9;
    pointer-events: none;
  }
  @keyframes scanLine {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Attachment Chips */
  .attachments-container {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 4px 8px;
  }
  .attachment-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    color: var(--text-main);
    max-width: 200px;
  }
  .attachment-chip span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .attachment-chip .remove-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    transition: background 0.2s;
  }
  .attachment-chip .remove-btn:hover {
    background: rgba(255,255,255,0.1);
    color: var(--text-main);
  }

  .chat-input {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text-main);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    resize: none;
    min-height: 44px;
    max-height: 200px;
    outline: none;
    padding: 10px 16px;
  }
  .chat-input::placeholder { color: #6b5e55; }

  .input-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 6px 4px 10px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .left-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* ── Model Selector ── */
  .model-selector-wrapper { position: relative; }
  .model-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 8px 12px;
    border-radius: 99px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;

        wrapper.appendChild(el);
      });

      reasoningContainer.appendChild(wrapper);
    }

  /* ============================================================
     TYPEWRITER (for non-streamed JSON responses)
     ============================================================ */
  function typewriterReveal(text, onChunk, signal, opts = {}) {
    return new Promise((resolve) => {
      if (!text) { resolve(); return; }
      const interval = opts.interval || 16;
      const minDuration = opts.minDuration || 250;
      const maxDuration = opts.maxDuration || 2200;
      const total = text.length;
      const duration = Math.min(maxDuration, Math.max(minDuration, total * 0.35));
      const steps = Math.max(1, Math.round(duration / interval));
      const chunk = Math.max(1, Math.ceil(total / steps));
      let i = 0;
      const timer = setInterval(() => {
        if (signal && signal.aborted) {
          clearInterval(timer);
          resolve();
          return;
        }
        const next = Math.min(total, i + chunk);
        onChunk(text.slice(i, next));
        i = next;
        if (i >= total) {
          clearInterval(timer);
          resolve();
        }
      }, interval);
    });
  }

  /* ============================================================
     MARKDOWN RENDERING (streaming-aware)
     ============================================================ */
  function renderInline(text) {
    let t = escapeHtml(text);
    t = t.replace(/`([^`\n]+)`/g, '<code class="inline-code">$1</code>');
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return t;
  }

  function renderTextBlock(text) {
    if (!text) return '';
    const lines = text.split('\n');
    let html = '';
    let inList = null;
    let paraLines = [];

    const flushPara = () => {
      if (paraLines.length) {
        html += `<p>${paraLines.map(renderInline).join('<br>')}</p>`;
        paraLines = [];
      }
    };
    const closeList = () => {
      if (inList) { html += `</${inList}>`; inList = null; }
    };

    for (let raw of lines) {
      const line = raw.replace(/\r$/, '');
      if (/^\s*$/.test(line)) { flushPara(); closeList(); continue; }

      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        flushPara(); closeList();
        const lvl = h[1].length;
        html += `<h${lvl}>${renderInline(h[2])}</h${lvl}>`;
        continue;
      }

      const ul = line.match(/^\s*[-*+]\s+(.*)$/);
      if (ul) {
        flushPara();
        if (inList !== 'ul') { closeList(); html += '<ul>'; inList = 'ul'; }
        html += `<li>${renderInline(ul[1])}</li>`;
        continue;
      }

      const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (ol) {
        flushPara();
        if (inList !== 'ol') { closeList(); html += '<ol>'; inList = 'ol'; }
        html += `<li>${renderInline(ol[1])}</li>`;
        continue;
      }

      if (/^\s*---+\s*$/.test(line)) {
        flushPara(); closeList();
        html += '<hr>';
        continue;
      }

      if (/^\s*>\s?/.test(line)) {
        flushPara(); closeList();
        html += `<blockquote>${renderInline(line.replace(/^\s*>\s?/, ''))}</blockquote>`;
        continue;
      }

      closeList();
      paraLines.push(line);
    }

    flushPara();
    closeList();
    return html;
  }

  function parseMarkdownParts(text) {
    const parts = [];
    let i = 0;
    const len = text.length;
    while (i < len) {
      const fenceStart = text.indexOf('```', i);
      if (fenceStart === -1) {
        if (i < len) parts.push({ type: 'text', content: text.slice(i) });
        break;
      }
      if (fenceStart > i) {
        parts.push({ type: 'text', content: text.slice(i, fenceStart) });
      }
      const lineEnd = text.indexOf('\n', fenceStart);
      let lang = '';
      let codeStart;
      if (lineEnd === -1) {
        lang = text.slice(fenceStart + 3).trim();
        codeStart = len;
      } else {
        lang = text.slice(fenceStart + 3, lineEnd).trim().split(/\s+/)[0] || '';
        codeStart = lineEnd + 1;
      }
      const fenceEnd = text.indexOf('```', codeStart);
      if (fenceEnd === -1) {
        parts.push({ type: 'code', lang, code: text.slice(codeStart), unclosed: true });
        break;
      } else {
        parts.push({ type: 'code', lang, code: text.slice(codeStart, fenceEnd), unclosed: false });
        i = fenceEnd + 3;
        if (text[i] === '\n') i++;
      }
    }
    return parts;
  }

  function createCodeNode(part) {
    const lang = (part.lang || 'text').toLowerCase();
    const displayLang = part.lang || 'text';
    const isRunnable = /^(html|htm|js|javascript)$/.test(lang);
    const wrapper = document.createElement('div');
    wrapper.className = 'code-block-wrapper' + (part.unclosed ? ' streaming' : '');
    wrapper.dataset.lang = displayLang;

    const header = document.createElement('div');
    header.className = 'code-block-header';
    const langLabel = document.createElement('span');
    langLabel.className = 'code-lang';
    langLabel.textContent = displayLang + (part.unclosed ? ' · writing…' : (part.truncated ? ' · truncated' : ''));
    header.appendChild(langLabel);

    const actions = document.createElement('div');
    actions.className = 'code-actions';

    if (!part.unclosed) {
      if (isRunnable && !part.truncated) {
        const runBtn = document.createElement('button');
        runBtn.className = 'code-action-btn run-btn';
        runBtn.textContent = '▶ Run';
        actions.appendChild(runBtn);
      }
      const copyBtn = document.createElement('button');
      copyBtn.className = 'code-action-btn copy-btn';
      copyBtn.textContent = 'Copy';
      actions.appendChild(copyBtn);

      const dlBtn = document.createElement('button');
      dlBtn.className = 'code-action-btn dl-btn';
      dlBtn.textContent = 'Download';
      actions.appendChild(dlBtn);
    }
    header.appendChild(actions);

    const pre = document.createElement('pre');
    const code = document.createElement('code');
    code.className = `language-${displayLang}`;
    code.textContent = part.code;
    pre.appendChild(code);

    wrapper.appendChild(header);
    wrapper.appendChild(pre);

    if (!part.unclosed) {
      try { if (window.hljs) hljs.highlightElement(code); } catch (e) {}
    }

    return wrapper;
  }

  function createPartNode(part) {
    if (part.type === 'text') {
      const div = document.createElement('div');
      div.className = 'md-block md-text';
      div.innerHTML = renderTextBlock(part.content);
      return div;
    }
    return createCodeNode(part);
  }

  function partsEqual(a, b) {
    if (!a || !b || a.type !== b.type) return false;
    if (a.type === 'text') return a.content === b.content;
    return a.lang === b.lang && a.code === b.code && a.unclosed === b.unclosed && a.truncated === b.truncated;
  }

  function updateStreamingContent(container, text, renderState) {
    const parts = parseMarkdownParts(text);
    let common = 0;
    while (
      common < parts.length &&
      common < renderState.renderedParts.length &&
      partsEqual(parts[common], renderState.renderedParts[common].part)
    ) {
      common++;
    }
    for (let j = common; j < renderState.renderedParts.length; j++) {
      renderState.renderedParts[j].node.remove();
    }
    renderState.renderedParts = renderState.renderedParts.slice(0, common);
    for (let j = common; j < parts.length; j++) {
      const node = createPartNode(parts[j]);
      container.appendChild(node);
      renderState.renderedParts.push({ part: parts[j], node });
    }
  }

  function ensureCursor(container) {
    let cursor = container.querySelector(':scope > .stream-cursor');
    if (!cursor) {
      cursor = document.createElement('span');
      cursor.className = 'stream-cursor';
      cursor.textContent = '▍';
    }
    if (container.lastElementChild !== cursor) {
      container.appendChild(cursor);
    }
  }

  function removeCursor(container) {
    const cursor = container.querySelector(':scope > .stream-cursor');
    if (cursor) cursor.remove();
  }

  function finalizeContent(container, text, renderState) {
    container.innerHTML = '';
    renderState.renderedParts = [];
    if (!text || !text.trim()) {
      const div = document.createElement('div');
      div.className = 'md-block md-text';
      div.innerHTML = '<p><em>[No response received]</em></p>';
      container.appendChild(div);
      return;
    }
    const parts = parseMarkdownParts(text);
    if (parts.length && parts[parts.length - 1].type === 'code' && parts[parts.length - 1].unclosed) {
      parts[parts.length - 1].unclosed = false;
      parts[parts.length - 1].truncated = true;
    }
    parts.forEach(part => {
      const node = createPartNode(part);
      container.appendChild(node);
      renderState.renderedParts.push({ part, node });
    });
  }

  /* ============================================================
     CODE ACTIONS / PROJECT PREVIEW / ZIP
     ============================================================ */
  messagesContainer.addEventListener('click', (e) => {
    const btn = e.target.closest('.code-action-btn');
    if (!btn) return;
    const wrapper = btn.closest('.code-block-wrapper');

  function copyText(text, btn) {
    const done = () => {
      if (!btn.dataset.origHtml) btn.dataset.origHtml = btn.innerHTML;
      btn.innerHTML = 'Copied!';
      btn.classList.add('copied');
      clearTimeout(btn._copyTimer);
      btn._copyTimer = setTimeout(() => {
        btn.innerHTML = btn.dataset.origHtml;
        btn.classList.remove('copied');
      }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { alert('Copy failed'); }

  function previewProject(codeParts) {
    const htmlPart = codeParts.find(p => /^(html|htm)$/i.test(p.lang || ''));
    const cssParts = codeParts.filter(p => /^css$/i.test(p.lang || ''));
    const jsParts = codeParts.filter(p => /^(js|javascript)$/i.test(p.lang || ''));

    let base = htmlPart
      ? htmlPart.code
      : '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n</head>\n<body>\n</body>\n</html>';

    const css = cssParts.map(p => p.code).join('\n');
    const js = jsParts.map(p => p.code.replace(/<\/script/gi, '<\\/script')).join('\n');

    if (css) {
      if (/<\/head>/i.test(base)) base = base.replace(/<\/head>/i, `<style>\n${css}\n</style>\n</head>`);
      else base = `<style>\n${css}\n</style>\n` + base;
    }
    if (js) {
      if (/<\/body>/i.test(base)) base = base.replace(/<\/body>/i, `<script>\n${js}\n<\/script>\n</body>`);
      else base = base + `\n<script>\n${js}\n<\/script>`;
    }
    openPreviewModal(base);
  }

  async function downloadZip(codeParts) {
    if (typeof JSZip === 'undefined') {
      alert('ZIP library not loaded.');
      return;
    }
    const zip = new JSZip();
    const usedNames = new Set();
    codeParts.forEach((p, i) => {
      const lang = (p.lang || 'txt').toLowerCase();
      let filename = `file${i + 1}.${extForLang(lang)}`;
      const firstLine = (p.code.split('\n')[0] || '').trim();
      const m = firstLine.match(/(?:\/\/|<!--|#|\/\*)\s*(?:file(?:name)?\s*[:=]\s*)?([\w.-]+\.[a-z0-9]{1,8})/i);
      if (m) filename = m[1];
      let unique = filename;
      let n = 1;
      while (usedNames.has(unique)) {
        const dot = filename.lastIndexOf('.');
        unique = dot > 0
          ? `${filename.slice(0, dot)}-${n}${filename.slice(dot)}`
          : `${filename}-${n}`;
        n++;
      }
      usedNames.add(unique);
      zip.file(unique, p.code);
    });
    try {
      const blob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'project.zip';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) {
      alert('Failed to create ZIP: ' + e.message);
    }
  }

            if (!zipEntry.dir && /\.(txt|md|html|js|css|json|py|ts|tsx|jsx|c|cpp|h|hpp|java|cs|go|rs|rb|php)$/i.test(filename)) {

  /* ============================================================
     STREAM EVENT HANDLING (unified across providers)
     ============================================================ */
  function handleStreamEvent(json, meta, onContent, onThinking) {
    if (!json || typeof json !== 'object') return;

    // Gemini native (candidates array)
    if (Array.isArray(json.candidates) && json.candidates.length) {
      const cand = json.candidates[0];
      if (cand.content && Array.isArray(cand.content.parts)) {
        cand.content.parts.forEach(part => {
          if (!part) return;
          if (part.thought === true) {
            if (typeof part.text === 'string') onThinking(part.text);
          } else if (typeof part.text === 'string') {
            onContent(part.text);
          }
        });
      }
      if (cand.finishReason === 'MAX_TOKENS' || cand.finishReason === 'LENGTH') meta.truncated = true;
      return;
    }

    // OpenAI Chat Completions
    if (Array.isArray(json.choices) && json.choices.length) {
      const choice = json.choices[0];
      const delta = choice.delta || choice.message || {};
      if (typeof delta.reasoning_content === 'string') onThinking(delta.reasoning_content);
      if (typeof delta.reasoning === 'string') onThinking(delta.reasoning);
      if (typeof delta.thinking === 'string') onThinking(delta.thinking);
      if (delta.content != null) {
        if (typeof delta.content === 'string') {
          onContent(delta.content);
        } else if (Array.isArray(delta.content)) {
          for (const part of delta.content) {
            if (!part) continue;
            const isThought = part.thought === true || (part.type && /thought|reasoning/i.test(part.type));
            if (isThought) {
              if (typeof part.text === 'string') onThinking(part.text);
            } else if (typeof part.text === 'string') {
              onContent(part.text);
            }
          }
        }
      }
      if (choice.finish_reason === 'length') meta.truncated = true;
      return;
    }

    const type = json.type;
    if (typeof type !== 'string') return;

    // Anthropic Messages
    if (type === 'content_block_start' && json.content_block) {
      const cb = json.content_block;
      if (cb.type === 'thinking' && typeof cb.thinking === 'string' && cb.thinking) onThinking(cb.thinking);
      if (cb.type === 'text' && typeof cb.text === 'string' && cb.text) onContent(cb.text);
      return;
    }
    if (type === 'content_block_delta' && json.delta) {
      const d = json.delta;
      if (d.type === 'thinking_delta' && typeof d.thinking === 'string') onThinking(d.thinking);
      else if (d.type === 'text_delta' && typeof d.text === 'string') onContent(d.text);
      return;
    }
    if (type === 'message_delta') {
      if (json.delta && json.delta.stop_reason === 'max_tokens') meta.truncated = true;
      return;
    }
    if (type === 'message_start' || type === 'message_stop' ||
        type === 'content_block_stop' || type === 'ping') {
      return;
    }

    // OpenAI Responses API
    if (type.startsWith('response.')) {
      if (type === 'response.output_text.delta' && typeof json.delta === 'string') {
        onContent(json.delta);
        return;
      }
      if (type === 'response.reasoning_summary_text.delta' && typeof json.delta === 'string') {
        onThinking(json.delta);
        return;
      }
      if (type === 'response.reasoning_text.delta' && typeof json.delta === 'string') {
        onThinking(json.delta);
        return;
      }
      if (type === 'response.completed' && json.response) {
        if (json.response.status === 'incomplete' || json.response.incomplete_details) {
          meta.truncated = true;
        }
        if (!meta.text && Array.isArray(json.response.output)) {
          let extracted = '';
          let extractedThinking = '';
          json.response.output.forEach(item => {
            if (!item) return;
            if (item.type === 'reasoning') {
              if (Array.isArray(item.summary)) extractedThinking += item.summary.map(s => s.text || '').join('\n');
              if (Array.isArray(item.content)) extractedThinking += item.content.map(c => c.text || '').join('');
            }
            if (item.type === 'message' && Array.isArray(item.content)) {
              item.content.forEach(c => {
                if ((c.type === 'output_text' || c.type === 'text') && c.text) extracted += c.text;
              });
            }
          });
          if (extractedThinking) onThinking(extractedThinking);
          if (extracted) onContent(extracted);
        }
        return;
      }
      if (type === 'response.failed') {
        throw new Error(
          (json.response && json.response.error && json.response.error.message) ||
          'Response failed'
        );
      }
      return;
    }

    if (type === 'error') {
      throw new Error((json.error && json.error.message) || json.message || 'Stream error');
    }

    if (json.delta && typeof json.delta === 'object') {
      if (typeof json.delta.content === 'string') onContent(json.delta.content);
      if (typeof json.delta.thinking === 'string') onThinking(json.delta.thinking);
      if (typeof json.delta.reasoning === 'string') onThinking(json.delta.reasoning);
    }
    if (typeof json.thinking === 'string') onThinking(json.thinking);
    if (typeof json.text === 'string') onContent(json.text);
  }

  async function processStreamingResponse(response, onContent, onThinking) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    const meta = { text: '', thinking: '', truncated: false };
    const emitContent = (c) => { if (c) { meta.text += c; onContent(c); } };
    const emitThinking = (c) => { if (c) { meta.thinking += c; onThinking(c); } };
    let finished = false;

    const processLine = (line) => {
      const trimmed = line.trim();
      if (!trimmed) return;
      if (trimmed.startsWith(':')) return;
      if (trimmed.startsWith('event:')) return;
      if (!trimmed.startsWith('data:')) return;
      const payload = trimmed.slice(5).trim();
      if (!payload) return;
      if (payload === '[DONE]') { finished = true; return; }
      let json;
      try { json = JSON.parse(payload); } catch (e) { return; }
      if (json.error) throw new Error(json.error.message || JSON.stringify(json.error));
      handleStreamEvent(json, meta, emitContent, emitThinking);
    };

    try {
      while (!finished) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf('\n')) !== -1) {
          const line = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 1);
          processLine(line);
          if (finished) break;
        }
      }
      if (!finished && buffer.trim()) processLine(buffer);
    } finally {
      try { await reader.cancel(); } catch (e) {}
    }
    return meta;
  }

  /* ============================================================
     NON-STREAMING RESPONSE EXTRACTION
     ============================================================ */
  function extractFromJson(json, config) {
    if (!json || typeof json !== 'object') throw new Error('Empty response');
    if (json.error) throw new Error(json.error.message || JSON.stringify(json.error));

    let text = '';
    let thinking = '';
    let truncated = false;

    if (Array.isArray(json)) {
      json.forEach(chunk => {
        if (!chunk) return;
        if (chunk.error) throw new Error(chunk.error.message || JSON.stringify(chunk.error));
        if (Array.isArray(chunk.candidates) && chunk.candidates.length) {
          const cand = chunk.candidates[0];
          if (cand.content && Array.isArray(cand.content.parts)) {
            cand.content.parts.forEach(part => {
              if (!part) return;
              if (part.thought === true) {
                if (typeof part.text === 'string') thinking += part.text;
              } else if (typeof part.text === 'string') {
                text += part.text;
              }
            });
          }
          if (cand.finishReason === 'MAX_TOKENS' || cand.finishReason === 'LENGTH') truncated = true;
        }
      });
      return { text, thinking, truncated };
    }

    if (Array.isArray(json.candidates) && json.candidates.length) {
      const cand = json.candidates[0];
      if (cand.content && Array.isArray(cand.content.parts)) {
        cand.content.parts.forEach(part => {
          if (!part) return;
          if (part.thought === true) {

          } else if (typeof part.text === 'string') {

          }
        });
      }
      if (cand.finishReason === 'MAX_TOKENS' || cand.finishReason === 'LENGTH') truncated = true;

    const consumeChatMessage = (msg) => {

      } else if (Array.isArray(msg.content)) {
        msg.content.forEach(part => {

          const isThought = part.thought === true || (part.type && /thought|reasoning/i.test(part.type));
          if (isThought) {
            if (typeof part.text === 'string') thinking += part.text;
          } else if (typeof part.text === 'string') {
            text += part.text;
          }
        });
      }
      if (typeof msg.reasoning_content === 'string') thinking += msg.reasoning_content;
      if (typeof msg.reasoning === 'string') thinking += msg.reasoning;
      if (typeof msg.thinking === 'string') thinking += msg.thinking;
    };

    if (Array.isArray(json.content) && !Array.isArray(json.choices)) {
      json.content.forEach(block => {
        if (!block) return;
        if (block.type === 'thinking' && typeof block.thinking === 'string') thinking += block.thinking;
        else if (block.type === 'text' && typeof block.text === 'string') text += block.text;
      });
      if (json.stop_reason === 'max_tokens') truncated = true;
    } else if (Array.isArray(json.output)) {
      json.output.forEach(item => {
        if (!item) return;
        if (item.type === 'reasoning') {
          if (Array.isArray(item.summary)) thinking += item.summary.map(s => s.text || '').join('\n');
          if (Array.isArray(item.content)) thinking += item.content.map(c => c.text || '').join('');
          if (typeof item.text === 'string') thinking += item.text;
        }
        if (item.type === 'message' && Array.isArray(item.content)) {
          item.content.forEach(c => {
            if ((c.type === 'output_text' || c.type === 'text') && c.text) text += c.text;
          });
        }
      });
      if (!text && typeof json.output_text === 'string') text = json.output_text;
      if (json.status === 'incomplete' || json.incomplete_details) truncated = true;
    } else if (Array.isArray(json.choices) && json.choices.length) {
      const choice = json.choices[0];
      consumeChatMessage(choice.message);
      if (choice.finish_reason === 'length') truncated = true;
    } else {
      if (typeof json.output_text === 'string') text = json.output_text;
      if (!text && typeof json.content === 'string') text = json.content;
      consumeChatMessage(json.message);
    }

    return { text, thinking, truncated };
  }

  /* ============================================================
     API CALLS
     ============================================================ */
  async function fetchModelResponse(config, messages, reasoning, attachments, opts = {}) {
    const stream = opts.stream !== false;
    const endpoint = config.endpoint;
    let body = {};

    let textContext = '';
    const imageAttachments = [];

    attachments.forEach(att => {
      if (att.type === 'text') {
        textContext += `\n\n--- Attached File: ${att.name} ---\n${att.content}`;
      } else if (att.type === 'image') {
        imageAttachments.push(att.content);
      }
    });

    let augmentedMessages = JSON.parse(JSON.stringify(messages));
    if (textContext) {
      const lastMsg = augmentedMessages[augmentedMessages.length - 1];
      if (lastMsg && lastMsg.role === 'user') {
        lastMsg.content += textContext;
      }
    }

    const apiType = config.apiType || 'openai-chat';

    if (apiType === 'openai-chat') {
      // ── OpenAI Chat Completions ──
      const gMessages = [];
      if (SYSTEM_PROMPTS[state.mode]) {
        gMessages.push({ role: 'system', content: SYSTEM_PROMPTS[state.mode] });
      }
      augmentedMessages.forEach(m => {
        if (m.role === 'user') {
          const isLast = m === augmentedMessages[augmentedMessages.length - 1];
          if (isLast && imageAttachments.length > 0) {
            const contentParts = [{ type: 'text', text: m.content }];
            imageAttachments.forEach(img => {
              contentParts.push({ type: 'image_url', image_url: { url: img } });
            });
            gMessages.push({ role: 'user', content: contentParts });
          } else {
            gMessages.push({ role: 'user', content: m.content });
          }
        } else {
          gMessages.push({ role: m.role, content: m.content });
        }
      });

      body = { messages: gMessages, stream };
      if (config.sendModelInBody) body.model = config.id;
      if (config.supportsReasoningEffort) body.reasoning_effort = reasoning;
      if (config.includeThoughts) body.include_thoughts = true;
      if (Array.isArray(config.tools) && config.tools.length) body.tools = config.tools;
    } else if (apiType === 'openai-responses') {
      // ── OpenAI Responses API ──
      const input = augmentedMessages.map(m => {
        const parts = [{
          type: m.role === 'user' ? 'input_text' : 'output_text',
          text: m.content
        }];
        return { type: 'message', role: m.role, content: parts };
      });

      if (imageAttachments.length > 0) {
        const lastMsg = input[input.length - 1];
        imageAttachments.forEach(img => {
          lastMsg.content.push({ type: 'input_image', image_url: img });
        });
      }

      body = { stream, input };
      if (config.sendModelInBody !== false) body.model = config.id;
      if (config.supportsReasoningEffort) body.reasoning = { effort: reasoning };
      if (config.includeInstructions && SYSTEM_PROMPTS[state.mode]) body.instructions = SYSTEM_PROMPTS[state.mode];
      if (Array.isArray(config.tools) && config.tools.length) body.tools = config.tools;
      if (config.maxOutputTokens) body.max_output_tokens = config.maxOutputTokens;
    } else if (apiType === 'gemini-native') {
      // ── Gemini native generateContent / streamGenerateContent ──
      const gContents = [];
      augmentedMessages.forEach(m => {
        gContents.push({
          role: m.role === 'user' ? 'user' : 'model',
          parts: [{ text: m.content }]
        });
      });

      if (imageAttachments.length > 0) {
        const lastContent = gContents[gContents.length - 1];
        imageAttachments.forEach(img => {
          const match = img.match(/^data:([^;]+);base64,(.+)$/);
          if (match) {
            lastContent.parts.push({
              inlineData: { mimeType: match[1], data: match[2] }
            });
          }
        });
      }

      body = {
        stream: true,
        contents: gContents,
        generationConfig: {
          thinkingConfig: {
            includeThoughts: true,
            thinkingLevel: reasoning
          }
        }
      };

      if (SYSTEM_PROMPTS[state.mode]) {
        body.systemInstruction = {
          parts: [{ text: SYSTEM_PROMPTS[state.mode] }]
        };
      }
    } else if (apiType === 'anthropic') {
      // ── Claude / Anthropic Messages ──
      const claudeMaxTokens = {
        minimal: 8192,
        low: 12288,
        medium: 16384,
        high: 24576,
        max: 32000
      };

      const claudeMessages = augmentedMessages.map(m => {
        if (m.role === 'user' && m === augmentedMessages[augmentedMessages.length - 1] && imageAttachments.length > 0) {
          const contentParts = [{ type: 'text', text: m.content }];
          imageAttachments.forEach(img => {
            contentParts.push({ type: 'image_url', image_url: { url: img } });
          });
          return { role: 'user', content: contentParts };
        }
        return { role: m.role, content: m.content };
      });

      body = {
        model: config.id,
        messages: claudeMessages,
        system: SYSTEM_PROMPTS[state.mode],
        max_tokens: claudeMaxTokens[reasoning] || 32000,
        stream,
        thinkingFlag: true
      };
    } else {
      throw new Error(`Unknown apiType: ${apiType}`);
    }

    const res = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${API_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body),
      signal: state.abortController.signal
    });

    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      if (stream && res.status >= 400 && res.status < 500 && /stream/i.test(errText)) {
        return fetchModelResponse(config, messages, reasoning, attachments, { stream: false });
      }
      throw new Error(`HTTP ${res.status}: ${errText.slice(0, 300)}`);
    }
    return res;
  }

  /* ============================================================
     GENERATE RESPONSE
     ============================================================ */
  async function generateResponse() {
    if (state.isGenerating) {
      if (state.abortController) state.abortController.abort();
      return;
    }

    const text = chatInput.value.trim();
    if (!text && state.attachments.length === 0) return;
    if (!state.model) return;

    state.isGenerating = true;
    chatInput.value = '';
    chatInput.style.height = 'auto';
    sendIcon.style.display = 'none';
    stopIcon.style.display = 'block';
    sendBtn.classList.add('stop-mode');
    sendBtn.disabled = false;
    inputWrapper.classList.add('generating');
    updateSendBtn();

    addUserMessage(text, state.attachments);
    state.messages.push({ role: 'user', content: text });

    const currentAttachments = [...state.attachments];
    state.attachments = [];
    renderAttachments();

    const { row, bubble, avatar, contentDiv } = createAssistantRow();
    const streamState = { renderedParts: [] };

    let rawText = '';
    let rawThinking = '';
    let hasThinking = false;
    let hasContent = false;
    let thinkingPanel = null;
    let thinkingBody = null;
    let thinkingTimeEl = null;
    let thinkingTimer = null;
    let thinkingStart = 0;
    let renderTimer = null;
    let pendingThinking = false;

    state.abortController = new AbortController();
    const signal = state.abortController.signal;

    function removeWaiting() {
      const w = bubble.querySelector('.waiting-indicator');
      if (w) w.remove();
    }

    function ensureThinkingPanel() {
      if (thinkingPanel) return;
      removeWaiting();
      thinkingPanel = createThinkingPanel();
      thinkingBody = thinkingPanel.querySelector('.thinking-body');
      thinkingTimeEl = thinkingPanel.querySelector('.thinking-time');
      thinkingStart = performance.now();
      thinkingTimer = setInterval(() => {
        if (thinkingTimeEl) {
          thinkingTimeEl.textContent = ((performance.now() - thinkingStart) / 1000).toFixed(1) + 's';
        }
      }, 100);
      bubble.insertBefore(thinkingPanel, contentDiv);
    }

    function scheduleContentRender() {
      if (renderTimer) return;
      renderTimer = setTimeout(() => {
        renderTimer = null;
        updateStreamingContent(contentDiv, rawText, streamState);
        ensureCursor(contentDiv);
        scrollToBottom();
      }, 30);
    }

    function finalizeThinking(forceCollapse = true) {
      if (!thinkingPanel || thinkingPanel.dataset.finalized) return;
      thinkingPanel.dataset.finalized = 'true';
      thinkingPanel.classList.add('done');

      if (thinkingTimer) {
        clearInterval(thinkingTimer);
        thinkingTimer = null;
      }

      const elapsed = thinkingStart ? ((performance.now() - thinkingStart) / 1000) : 0;
      const userWantsExpanded = thinkingPanel.dataset.userExpanded === 'true';
      if (forceCollapse && !userWantsExpanded) {
        thinkingPanel.classList.remove('expanded');
      }

      const label = thinkingPanel.querySelector('.thinking-label');
      if (label) {
        label.innerHTML = `<svg class="thought-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><path d="M20 6L9 17l-5-5"/></svg><span class="thinking-text">Thought for ${elapsed.toFixed(1)}s</span>`;
      }
      avatar.classList.remove('thinking');
    }

    function onThinking(chunk) {
      if (!chunk) return;
      rawThinking += chunk;

      if (!hasThinking) {
        hasThinking = true;
        ensureThinkingPanel();
        avatar.classList.add('thinking');
      }

      if (pendingThinking) return;
      pendingThinking = true;
      requestAnimationFrame(() => {
        pendingThinking = false;
        if (thinkingBody) {
          thinkingBody.textContent = rawThinking;
          const wrapper = thinkingBody.parentElement;
          if (wrapper && thinkingPanel && thinkingPanel.classList.contains('expanded')) {
            const nearBottom = wrapper.scrollHeight - wrapper.scrollTop - wrapper.clientHeight < 40;
            if (nearBottom) wrapper.scrollTop = wrapper.scrollHeight;
          }
        }
        scrollToBottom();
      });
    }

    function onContent(chunk) {
      if (!chunk) return;
      rawText += chunk;

      if (!hasContent) {
        hasContent = true;
        removeWaiting();
        if (hasThinking) finalizeThinking();
      }
      scheduleContentRender();
    }

    try {
      const config = MODEL_CONFIG[state.model];
      let requestMessages = [...state.messages];
      let accumulated = '';
      const maxAttempts = 3;

      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        if (signal.aborted) throw abortError();

        const response = await fetchModelResponse(
          config,
          requestMessages,
          state.reasoning,
          attempt === 0 ? currentAttachments : []
        );

        const contentType = (response.headers.get('content-type') || '').toLowerCase();
        let result;

        if (contentType.includes('text/event-stream') && response.body) {
          result = await processStreamingResponse(response, onContent, onThinking);
        } else {
          const json = await response.json();
          result = extractFromJson(json, config);

          if (result.thinking) {
            await typewriterReveal(result.thinking, onThinking, signal, { maxDuration: 1600 });
          }
          if (signal.aborted) throw abortError();

          if (result.text) {
            await typewriterReveal(result.text, onContent, signal);
          }
          if (signal.aborted) throw abortError();
        }

        accumulated += result.text || '';
        if (!result.truncated) break;

        if (attempt === maxAttempts - 1) break;
        requestMessages = [
          ...requestMessages,
          { role: 'assistant', content: accumulated },
          { role: 'user', content: 'Continue from exactly where you stopped. Do not repeat any previous content. Output only the continuation.' }
        ];
      }
    } catch (err) {
      if (err.name === 'AbortError') {
        rawText = rawText ? rawText + '\n\n*[Generation stopped]*' : '*[Generation stopped]*';
      } else {
        console.error(err);
        const errMsg = `⚠️ **Error:** ${err.message}`;
        rawText = rawText ? rawText + '\n\n' + errMsg : errMsg;
      }
      hasContent = true;
      removeWaiting();
      scheduleContentRender();
    } finally {
      if (renderTimer) {
        clearTimeout(renderTimer);
        renderTimer = null;
      }
      if (thinkingTimer) {
        clearInterval(thinkingTimer);
        thinkingTimer = null;
      }
      removeWaiting();
      removeCursor(contentDiv);
      finalizeContent(contentDiv, rawText, streamState);
      if (hasThinking) finalizeThinking();
      avatar.classList.remove('thinking');
      addMessageActions(bubble, rawText);

      if (rawText.trim()) {
        state.messages.push({ role: 'assistant', content: rawText });
      }

      state.isGenerating = false;
      state.abortController = null;
      inputWrapper.classList.remove('generating');
      sendIcon.style.display = 'block';
      stopIcon.style.display = 'none';
      sendBtn.classList.remove('stop-mode');
      updateSendBtn();
      chatInput.focus();
      scrollToBottom(true);
      updateScrollBtn();
    }
  }

  /* ============================================================
     EVENTS & INIT
     ============================================================ */
  sendBtn.addEventListener('click', generateResponse);

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (state.isGenerating) return;
      generateResponse();
    }
  });

  chatInput.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 200) + 'px';
    updateSendBtn();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      modelDropdown.classList.remove('active');
      modelBtn.classList.remove('active');
      sidebar.classList.remove('active');
      sidebarOverlay.classList.remove('active');
      previewModal.classList.remove('open');
    }
  });

  /* ============================================================
     BOOTSTRAP
     ============================================================ */
  async function loadConfig() {
    try {
      if (location.protocol === 'file:') {
        throw new Error('file:// protocol — local fetch blocked');
      }
      const res = await fetch('models.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data || !Array.isArray(data.models) || data.models.length === 0) {
        throw new Error('models.json missing models array');
      }
      console.log('[LocalMind] Loaded models.json —', data.models.length, 'model(s)');
      return data;
    } catch (err) {
      console.warn('[LocalMind] models.json load failed — using built-in fallback:', err.message);
      return DEFAULT_CONFIG;
    }
  }

  async function init() {
    const cfg = await loadConfig();
    SETTINGS = cfg.settings || {};
    MODELS_LIST = cfg.models;
    MODEL_CONFIG = {};
    MODELS_LIST.forEach(m => { MODEL_CONFIG[m.key] = m; });

    applySettings();
    populateModelDropdown();

    const defaultKey = SETTINGS.defaultModel && MODEL_CONFIG[SETTINGS.defaultModel]
      ? SETTINGS.defaultModel
      : MODELS_LIST[0].key;

    selectModel(defaultKey);
    setMode('coding');
    chatInput.focus();
    updateSendBtn();
  }

  init().catch(err => {
    console.error('[LocalMind] Init failed:', err);
    alert('Failed to initialize LocalMind. Check the console and models.json.');
  });
</script>
</body>
