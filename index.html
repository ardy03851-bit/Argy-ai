  /* ============================================================
     HELPERS
     ============================================================ */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function capitalize(s) { return String(s).charAt(0).toUpperCase() + String(s).slice(1); }

  function extForLang(lang) {
    const map = {
      html: 'html', htm: 'html', css: 'css', js: 'js', javascript: 'js', jsx: 'jsx',
      ts: 'ts', typescript: 'ts', tsx: 'tsx', py: 'py', python: 'py', json: 'json',
      md: 'md', markdown: 'md', txt: 'txt', sh: 'sh', bash: 'sh', c: 'c', cpp: 'cpp',
      h: 'h', java: 'java', cs: 'cs', go: 'go', rs: 'rs', rb: 'rb', php: 'php',
      sql: 'sql', xml: 'xml', yml: 'yml', yaml: 'yaml'
    };
    return map[(lang || '').toLowerCase()] || 'txt';
  }

  function scrollToBottom(force = false) {
    if (!state.userHasScrolled || force) {
      chatScrollArea.scrollTop = chatScrollArea.scrollHeight;
    }
    updateScrollBtn();
  }

  function updateScrollBtn() {
    if (!scrollBottomBtn) return;
    const dist = chatScrollArea.scrollHeight - chatScrollArea.scrollTop - chatScrollArea.clientHeight;
    scrollBottomBtn.classList.toggle('visible', dist > 200 && state.messages.length > 0);
  }

  chatScrollArea.addEventListener('scroll', () => {
    const isAtBottom = chatScrollArea.scrollHeight - chatScrollArea.scrollTop - chatScrollArea.clientHeight < 50;
    state.userHasScrolled = !isAtBottom;
    updateScrollBtn();
  });
  scrollBottomBtn.addEventListener('click', () => {
    chatScrollArea.scrollTo({ top: chatScrollArea.scrollHeight, behavior: 'smooth' });
  });

  function hideWelcome() {
    if (welcomeContainer.style.display !== 'none') welcomeContainer.classList.add('hidden');
  }

  function updateSendBtn() {
    if (state.isGenerating) { sendBtn.disabled = false; return; }
    sendBtn.disabled = !chatInput.value.trim() && state.attachments.length === 0;
  }

  /* ============================================================
     MARKDOWN RENDERING (streaming-aware)
     ============================================================ */
  function renderInline(text) {
    let t = escapeHtml(text);
    t = t.replace(/`([^`\n]+)`/g, '<code class="inline-code">$1</code>');
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return t;
  }

  function renderTextBlock(text) {
    if (!text) return '';
    const lines = text.split('\n');
    let html = '';
    let inList = null;
    let paraLines = [];

    const flushPara = () => {
      if (paraLines.length) {
        html += `<p>${paraLines.map(renderInline).join('<br>')}</p>`;
        paraLines = [];
      }
    };
    const closeList = () => { if (inList) { html += `</${inList}>`; inList = null; } };

    for (let raw of lines) {
      const line = raw.replace(/\r$/, '');
      if (/^\s*$/.test(line)) { flushPara(); closeList(); continue; }

      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        flushPara(); closeList();
        const lvl = h[1].length;
        html += `<h${lvl}>${renderInline(h[2])}</h${lvl}>`;
        continue;
      }
      const ul = line.match(/^\s*[-*+]\s+(.*)$/);
      if (ul) {
        flushPara();
        if (inList !== 'ul') { closeList(); html += '<ul>'; inList = 'ul'; }
        html += `<li>${renderInline(ul[1])}</li>`;
        continue;
      }
      const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (ol) {
        flushPara();
        if (inList !== 'ol') { closeList(); html += '<ol>'; inList = 'ol'; }
        html += `<li>${renderInline(ol[1])}</li>`;
        continue;
      }
      if (/^\s*---+\s*$/.test(line)) { flushPara(); closeList(); html += '<hr>'; continue; }
      if (/^\s*>\s?/.test(line)) {
        flushPara(); closeList();
        html += `<blockquote>${renderInline(line.replace(/^\s*>\s?/, ''))}</blockquote>`;
        continue;
      }
      closeList();
      paraLines.push(line);
    }
    flushPara(); closeList();
    return html;
  }

  function parseMarkdownParts(text) {
    const parts = [];
    let i = 0;
    const len = text.length;
    while (i < len) {
      const fenceStart = text.indexOf('```', i);
      if (fenceStart === -1) {
        if (i < len) parts.push({ type: 'text', content: text.slice(i) });
        break;
      }
      if (fenceStart > i) parts.push({ type: 'text', content: text.slice(i, fenceStart) });
      const lineEnd = text.indexOf('\n', fenceStart);
      let lang = '';
      let codeStart;
      if (lineEnd === -1) {
        lang = text.slice(fenceStart + 3).trim();
        codeStart = len;
      } else {
        lang = text.slice(fenceStart + 3, lineEnd).trim().split(/\s+/)[0] || '';
        codeStart = lineEnd + 1;
      }
      const fenceEnd = text.indexOf('```', codeStart);
      if (fenceEnd === -1) {
        parts.push({ type: 'code', lang, code: text.slice(codeStart), unclosed: true });
        break;
      } else {
        parts.push({ type: 'code', lang, code: text.slice(codeStart, fenceEnd), unclosed: false });
        i = fenceEnd + 3;
        if (text[i] === '\n') i++;
      }
    }
    return parts;
  }

  function createCodeNode(part) {
    const lang = (part.lang || 'text').toLowerCase();
    const displayLang = part.lang || 'text';
    const isRunnable = /^(html|htm|js|javascript)$/.test(lang);
    const wrapper = document.createElement('div');
    wrapper.className = 'code-block-wrapper' + (part.unclosed ? ' streaming' : '');
    wrapper.dataset.lang = displayLang;

    const header = document.createElement('div');
    header.className = 'code-block-header';
    const langLabel = document.createElement('span');
    langLabel.className = 'code-lang';
    langLabel.textContent = displayLang + (part.unclosed ? ' · writing…' : (part.truncated ? ' · truncated' : ''));
    header.appendChild(langLabel);

    const actions = document.createElement('div');
    actions.className = 'code-actions';
    if (!part.unclosed) {
      if (isRunnable && !part.truncated) {
        const runBtn = document.createElement('button');
        runBtn.className = 'code-action-btn run-btn';
        runBtn.textContent = '▶ Run';
        actions.appendChild(runBtn);
      }
      const copyBtn = document.createElement('button');
      copyBtn.className = 'code-action-btn copy-btn';
      copyBtn.textContent = 'Copy';
      actions.appendChild(copyBtn);
      const dlBtn = document.createElement('button');
      dlBtn.className = 'code-action-btn dl-btn';
      dlBtn.textContent = 'Download';
      actions.appendChild(dlBtn);
    }
    header.appendChild(actions);

    const pre = document.createElement('pre');
    const code = document.createElement('code');
    code.className = `language-${displayLang}`;
    code.textContent = part.code;
    pre.appendChild(code);
    wrapper.appendChild(header);
    wrapper.appendChild(pre);

    if (!part.unclosed) {
      try { if (window.hljs) hljs.highlightElement(code); } catch (e) {}
    }
    return wrapper;
  }

  function createPartNode(part) {
    if (part.type === 'text') {
      const div = document.createElement('div');
      div.className = 'md-block md-text';
      div.innerHTML = renderTextBlock(part.content);
      return div;
    }
    return createCodeNode(part);
  }

  function partsEqual(a, b) {
    if (!a || !b || a.type !== b.type) return false;
    if (a.type === 'text') return a.content === b.content;
    return a.lang === b.lang && a.code === b.code && a.unclosed === b.unclosed && a.truncated === b.truncated;
  }

  function updateStreamingContent(container, text, renderState) {
    const parts = parseMarkdownParts(text);
    let common = 0;
    while (
      common < parts.length &&
      common < renderState.renderedParts.length &&
      partsEqual(parts[common], renderState.renderedParts[common].part)
    ) common++;
    for (let j = common; j < renderState.renderedParts.length; j++) renderState.renderedParts[j].node.remove();
    renderState.renderedParts = renderState.renderedParts.slice(0, common);
    for (let j = common; j < parts.length; j++) {
      const node = createPartNode(parts[j]);
      container.appendChild(node);
      renderState.renderedParts.push({ part: parts[j], node });
    }
  }

  function ensureCursor(container) {
    let cursor = container.querySelector(':scope > .stream-cursor');
    if (!cursor) {
      cursor = document.createElement('span');
      cursor.className = 'stream-cursor';
      cursor.textContent = '▍';
    }
    if (container.lastElementChild !== cursor) container.appendChild(cursor);
  }
  function removeCursor(container) {
    const cursor = container.querySelector(':scope > .stream-cursor');
    if (cursor) cursor.remove();
  }

  function finalizeContent(container, text, renderState) {
    container.innerHTML = '';
    renderState.renderedParts = [];
    if (!text || !text.trim()) {
      const div = document.createElement('div');
      div.className = 'md-block md-text';
      div.innerHTML = '<p><em>[No response received]</em></p>';
      container.appendChild(div);
      return;
    }
    const parts = parseMarkdownParts(text);
    if (parts.length && parts[parts.length - 1].type === 'code' && parts[parts.length - 1].unclosed) {
      parts[parts.length - 1].unclosed = false;
      parts[parts.length - 1].truncated = true;
    }
    parts.forEach(part => {
      const node = createPartNode(part);
      container.appendChild(node);
      renderState.renderedParts.push({ part, node });
    });
  }

  /* ============================================================
     CODE ACTIONS / PROJECT PREVIEW / ZIP
     ============================================================ */
  messagesContainer.addEventListener('click', (e) => {
    const btn = e.target.closest('.code-action-btn');
    if (!btn) return;
    const wrapper = btn.closest('.code-block-wrapper');
    if (!wrapper) return;
    const codeEl = wrapper.querySelector('code');
    if (!codeEl) return;
    const code = codeEl.textContent;
    const lang = wrapper.dataset.lang || 'text';

    if (btn.classList.contains('copy-btn')) {
      copyText(code, btn);
    } else if (btn.classList.contains('run-btn')) {
      if (/^(html|htm)$/i.test(lang)) {
        openPreviewModal(code);
      } else {
        const safeCode = code.replace(/<\/script/gi, '<\\/script');
        const runner = '<!DOCTYPE html><html><body style="margin:0;background:#111;color:#eee;font-family:monospace;padding:16px">' +
          '<pre id="__out" style="white-space:pre-wrap"></pre><script>' +
          'const __p=document.getElementById("__out");const __log=console.log;' +
          'console.log=(...a)=>{__p.textContent+=a.join(" ")+"\\n";__log(...a)};' +
          'try{' + safeCode + '}catch(e){__p.textContent+="Error: "+e.message}' +
          '<\/script></body></html>';
        openPreviewModal(runner);
      }
    } else if (btn.classList.contains('dl-btn')) {
      const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `code.${extForLang(lang)}`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
  });

  function copyText(text, btn) {
    const done = () => {
      const orig = btn.dataset.orig || btn.textContent;
      btn.dataset.orig = orig;
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      clearTimeout(btn._copyTimer);
      btn._copyTimer = setTimeout(() => {
        btn.textContent = orig;
        btn.classList.remove('copied');
      }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { alert('Copy failed'); }
    ta.remove();
  }

  function openPreviewModal(html) {
    previewIframe.srcdoc = html;
    previewModal.classList.add('open');
  }
  previewCloseBtn.addEventListener('click', () => previewModal.classList.remove('open'));
  previewModal.querySelector('.preview-modal-backdrop').addEventListener('click', () => previewModal.classList.remove('open'));

  function previewProject(codeParts) {
    const htmlPart = codeParts.find(p => /^(html|htm)$/i.test(p.lang || ''));
    const cssParts = codeParts.filter(p => /^css$/i.test(p.lang || ''));
    const jsParts = codeParts.filter(p => /^(js|javascript)$/i.test(p.lang || ''));

    let base = htmlPart
      ? htmlPart.code
      : '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n</head>\n<body>\n</body>\n</html>';

    const css = cssParts.map(p => p.code).join('\n');
    const js = jsParts.map(p => p.code.replace(/<\/script/gi, '<\\/script')).join('\n');

    if (css) {
      if (/<\/head>/i.test(base)) base = base.replace(/<\/head>/i, `<style>\n${css}\n</style>\n</head>`);
      else base = `<style>\n${css}\n</style>\n` + base;
    }
    if (js) {
      if (/<\/body>/i.test(base)) base = base.replace(/<\/body>/i, `<script>\n${js}\n<\/script>\n</body>`);
      else base = base + `\n<script>\n${js}\n<\/script>`;
    }
    openPreviewModal(base);
  }

  async function downloadZip(codeParts) {
    if (typeof JSZip === 'undefined') { alert('ZIP library not loaded.'); return; }
    const zip = new JSZip();
    const usedNames = new Set();
    codeParts.forEach((p, i) => {
      const lang = (p.lang || 'txt').toLowerCase();
      let filename = `file${i + 1}.${extForLang(lang)}`;
      const firstLine = (p.code.split('\n')[0] || '').trim();
      const m = firstLine.match(/(?:\/\/|<!--|#|\/\*)\s*(?:file(?:name)?\s*[:=]\s*)?([\w.-]+\.[a-z0-9]{1,8})/i);
      if (m) filename = m[1];
      let unique = filename;
      let n = 1;
      while (usedNames.has(unique)) {
        const dot = filename.lastIndexOf('.');
        unique = dot > 0 ? `${filename.slice(0, dot)}-${n}${filename.slice(dot)}` : `${filename}-${n}`;
        n++;
      }
      usedNames.add(unique);
      zip.file(unique, p.code);
    });
    try {
      const blob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'project.zip';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) {
      alert('Failed to create ZIP: ' + e.message);
    }
  }

  function addMessageActions(bubble, text) {
    const parts = parseMarkdownParts(text);
    const codeParts = parts.filter(p => p.type === 'code');
    if (!codeParts.length) return;

    const actions = document.createElement('div');
    actions.className = 'message-actions';

    const hasPreviewable = codeParts.some(p => /^(html|htm|css|js|javascript)$/i.test(p.lang || ''));
    if (hasPreviewable) {
      const previewBtn = document.createElement('button');
      previewBtn.className = 'msg-action-btn preview-project-btn';
      previewBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Preview Project';
      previewBtn.addEventListener('click', () => previewProject(codeParts));
      actions.appendChild(previewBtn);
    }

    const zipBtn = document.createElement('button');
    zipBtn.className = 'msg-action-btn';
    zipBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> Download ZIP';
    zipBtn.addEventListener('click', () => downloadZip(codeParts));
    actions.appendChild(zipBtn);

    bubble.appendChild(actions);
  }

  /* ============================================================
     ATTACHMENTS
     ============================================================ */
  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      if (file.size > 5 * 1024 * 1024) {
        alert(`File ${file.name} is too large (max 5MB).`);
        continue;
      }
      let content = '';
      let type = 'text';

      if (file.name.endsWith('.zip')) {
        try {
          const zip = await JSZip.loadAsync(file);
          const textFiles = [];
          for (const [filename, zipEntry] of Object.entries(zip.files)) {
            if (!zipEntry.dir && /\.(txt|md|html|js|css|json|py|ts|tsx|jsx|c|cpp|h|hpp|java|cs|go|rs|rb|php)$/i.test(filename)) {
              const fileContent = await zipEntry.async('string');
              textFiles.push(`--- File: ${filename} ---\n${fileContent}`);
            }
          }
          content = textFiles.join('\n\n');
        } catch (err) {
          console.error('Error reading zip:', err);
          alert('Failed to read zip file.');
          continue;
        }
      } else if (/\.(txt|md|html|js|css|json|py|ts|tsx|jsx|c|cpp|h|hpp|java|cs|go|rs|rb|php)$/i.test(file.name) || file.type.startsWith('text/')) {
        content = await file.text();
      } else if (file.type.startsWith('image/')) {
        content = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (ev) => resolve(ev.target.result);
          reader.readAsDataURL(file);
        });
        type = 'image';
      } else {
        continue;
      }
      if (content) state.attachments.push({ name: file.name, content, type });
    }
    fileInput.value = '';
    renderAttachments();
    updateSendBtn();
  });

  function renderAttachments() {
    attachmentsContainer.innerHTML = '';
    state.attachments.forEach((att, index) => {
      const chip = document.createElement('div');
      chip.className = 'attachment-chip';
      chip.innerHTML = `
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          ${att.type === 'image'
            ? '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>'
            : '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/>'}
        </svg>
        <span>${escapeHtml(att.name)}</span>
        <button class="remove-btn" onclick="removeAttachment(${index})">×</button>
      `;
      attachmentsContainer.appendChild(chip);
    });
  }
  window.removeAttachment = (index) => {
    state.attachments.splice(index, 1);
    renderAttachments();
    updateSendBtn();
  };

  /* ============================================================
     MESSAGE CREATION
     ============================================================ */
  function addUserMessage(text, attachments) {
    hideWelcome();
    const row = document.createElement('div');
    row.className = 'message-row user';
    let attHtml = '';
    if (attachments && attachments.length > 0) {
      attHtml = '<div style="margin-bottom:8px;font-size:12px;color:var(--text-muted);">Attachments: ' +
        attachments.map(a => escapeHtml(a.name)).join(', ') + '</div>';
    }
    row.innerHTML = `<div class="bubble">${attHtml}<div style="white-space:pre-wrap;">${escapeHtml(text)}</div></div>`;
    messagesContainer.appendChild(row);
    scrollToBottom(true);
  }

  function createAssistantRow() {
    hideWelcome();
    const row = document.createElement('div');
    row.className = 'message-row assistant';

    const model = MODELS[state.model];
    if (model && model.glow) row.style.setProperty('--avatar-glow', model.glow);

    const avatarSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.6H22l-6.2 4.5 2.4 7.6-6.2-4.6-6.2 4.6 2.4-7.6L2 9.6h7.6z"/></svg>`;
    const avatarContent = model && model.icon ? `<img src="${model.icon}" alt="Model">` : avatarSvg;

    row.innerHTML = `
      <div class="msg-avatar">${avatarContent}</div>
      <div class="bubble">
        <div class="waiting-indicator">
          <div class="spinner"></div>
          <span>Connecting…</span>
        </div>
      </div>
    `;

    const bubble = row.querySelector('.bubble');
    const contentDiv = document.createElement('div');
    contentDiv.className = 'content';
    bubble.appendChild(contentDiv);

    messagesContainer.appendChild(row);
    scrollToBottom(true);
    return { row, bubble, avatar: row.querySelector('.msg-avatar'), contentDiv };
  }

  function createThinkingPanel() {
    const panel = document.createElement('div');
    panel.className = 'thinking-panel expanded';
    panel.innerHTML = `
      <button class="thinking-header" type="button">
        <span class="thinking-label">
          <span class="thinking-dot"></span>
          <span class="thinking-text">Reasoning…</span>
        </span>
        <svg class="thinking-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="thinking-body-wrapper">
        <div class="thinking-body"></div>
      </div>
    `;
    panel.querySelector('.thinking-header').addEventListener('click', () => {
      const willExpand = !panel.classList.contains('expanded');
      panel.classList.toggle('expanded');
      panel.dataset.userExpanded = willExpand ? 'true' : '';
    });
    return panel;
  }

  /* ============================================================
     SIDEBAR / MODE
     ============================================================ */
  hamburger.addEventListener('click', () => {
    sidebar.classList.add('active');
    sidebarOverlay.classList.add('active');
  });
  sidebarOverlay.addEventListener('click', () => {
    sidebar.classList.remove('active');
    sidebarOverlay.classList.remove('active');
  });

  function setMode(mode) {
    state.mode = mode;
    document.body.className = `mode-${mode}`;
    sidebar.classList.remove('active');
    sidebarOverlay.classList.remove('active');

    if (mode === 'coding') {
      welcomeTitle.textContent = 'Agent Workspace';
      welcomeSubtitle.textContent = 'System ready. Awaiting prompt.';
      modeCoding.classList.add('active');
      modeSimple.classList.remove('active');
    } else {
      welcomeTitle.textContent = 'LocalMind';
      welcomeSubtitle.textContent = 'Chat with advanced models.';
      modeCoding.classList.remove('active');
      modeSimple.classList.add('active');
    }
    renderReasoningUI();
  }
  modeCoding.addEventListener('click', () => setMode('coding'));
  modeSimple.addEventListener('click', () => setMode('simple'));

  /* ============================================================
     MODEL SELECTOR (built from models.js)
     ============================================================ */
  modelBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isActive = modelDropdown.classList.toggle('active');
    modelBtn.classList.toggle('active', isActive);
  });
  modelDropdown.addEventListener('click', (e) => e.stopPropagation());
  document.addEventListener('click', () => {
    modelDropdown.classList.remove('active');
    modelBtn.classList.remove('active');
  });

  function buildModelDropdown() {
    modelDropdown.innerHTML = '';
    MODEL_ORDER.forEach(key => {
      const m = MODELS[key];
      if (!m) return;
      const opt = document.createElement('div');
      opt.className = 'model-option';
      opt.dataset.model = key;
      opt.style.setProperty('--glow-gradient', m.gradient);
      opt.innerHTML = `
        <div class="model-option-left">
          <img src="${m.icon}" class="model-brand-icon" alt="">
          <div class="model-option-info">
            <span class="model-option-name">${escapeHtml(m.name)}</span>
            <span class="model-option-meta">${escapeHtml(m.meta || '')}</span>
          </div>
        </div>
        <div class="model-status-icon"></div>
      `;
      opt.addEventListener('click', () => selectModel(key));
      modelDropdown.appendChild(opt);
    });
    syncModelDropdown();
  }

  function syncModelDropdown() {
    modelDropdown.querySelectorAll('.model-option').forEach(opt => {
      const active = opt.dataset.model === state.model;
      opt.classList.toggle('active', active);
      opt.querySelector('.model-status-icon').innerHTML = active ? CHECK_SVG : '';
    });
  }

  function syncModelButton() {
    const m = MODELS[state.model];
    if (!m) return;
    currentModelName.textContent = m.name;
    currentModelIcon.src = m.icon;
  }

  function selectModel(key) {
    if (!MODELS[key]) return;
    state.model = key;
    syncModelButton();
    syncModelDropdown();
    renderReasoningUI();
    modelDropdown.classList.remove('active');
    modelBtn.classList.remove('active');
  }

  /* ============================================================
     REASONING UI (built from the selected model's config)
     ============================================================ */
  function renderReasoningUI() {
    reasoningContainer.innerHTML = '';
    const m = MODELS[state.model];
    if (!m || !m.reasoning) return;
    const cfg = m.reasoning;
    const modeDefault = cfg.defaults[state.mode]
      || cfg.defaults.default
      || (cfg.options && cfg.options[Math.floor(cfg.options.length / 2)])
      || 'medium';

    if (cfg.type === 'slider') {
      const options = cfg.options;
      const idx = Math.max(0, options.indexOf(modeDefault));
      state.reasoning = options[idx];

      const group = document.createElement('div');
      group.className = 'claude-slider-group';

      const wrapper = document.createElement('div');
      wrapper.className = 'claude-slider-wrapper';

      const track = document.createElement('div');
      track.className = 'claude-slider-track-bg';

      const ticks = document.createElement('div');
      ticks.className = 'claude-slider-ticks';
      options.forEach((_, i) => {
        const tick = document.createElement('span');
        tick.className = 'tick';
        tick.style.left = `${(i / (options.length - 1)) * 100}%`;
        ticks.appendChild(tick);
      });

      const fill = document.createElement('div');
      fill.className = 'claude-slider-fill';
      fill.style.width = `${(idx / (options.length - 1)) * 100}%`;

      track.appendChild(ticks);
      track.appendChild(fill);

      const slider = document.createElement('input');
      slider.type = 'range';
      slider.className = 'claude-slider';
      slider.min = 0;
      slider.max = options.length - 1;
      slider.step = 1;
      slider.value = idx;

      wrapper.appendChild(track);
      wrapper.appendChild(slider);

      const label = document.createElement('span');
      label.className = 'claude-slider-label';
      label.textContent = capitalize(options[idx]);

      group.appendChild(wrapper);
      group.appendChild(label);

      slider.addEventListener('input', (e) => {
        const v = parseInt(e.target.value, 10);
        fill.style.width = `${(v / (options.length - 1)) * 100}%`;
        label.textContent = capitalize(options[v]);
        state.reasoning = options[v];
      });

      reasoningContainer.appendChild(group);
    } else {
      const wrapper = document.createElement('div');
      wrapper.className = 'reasoning-toggle';
      cfg.options.forEach(opt => {
        const el = document.createElement('div');
        el.className = 'reasoning-option' + (opt === modeDefault ? ' active' : '');
        el.dataset.level = opt;
        el.textContent = capitalize(opt);
        el.addEventListener('click', () => {
          wrapper.querySelectorAll('.reasoning-option').forEach(o => o.classList.remove('active'));
          el.classList.add('active');
          state.reasoning = opt;
        });
        wrapper.appendChild(el);
      });
      reasoningContainer.appendChild(wrapper);
    }
  }

  /* ============================================================
     CLEAR CHAT
     ============================================================ */
  clearChatBtn.addEventListener('click', () => {
    if (state.isGenerating) return;
    state.messages = [];
    state.attachments = [];
    state.userHasScrolled = false;
    renderAttachments();
    messagesContainer.innerHTML = '';
    welcomeContainer.classList.remove('hidden');
    welcomeContainer.style.display = 'flex';
    chatInput.focus();
    updateScrollBtn();
    updateSendBtn();
  });

  /* ============================================================
     API TRANSPORT
     ============================================================ */
  function buildAugmentedMessages(messages, attachments) {
    const textAtts = attachments.filter(a => a.type === 'text');
    const copy = messages.map(m => ({ role: m.role, content: m.content }));
    if (textAtts.length) {
      for (let i = copy.length - 1; i >= 0; i--) {
        if (copy[i].role === 'user') {
          copy[i].content += textAtts.map(a => `\n\n--- Attached File: ${a.name} ---\n${a.content}`).join('');
          break;
        }
      }
    }
    return copy;
  }

  async function sendRequest(config, attachments, messages, signal) {
    const augmented = buildAugmentedMessages(messages, attachments);
    const req = config.buildRequest({
      messages: augmented,
      systemPrompt: SYSTEM_PROMPTS[state.mode],
      reasoning: state.reasoning,
      attachments,
      mode: state.mode
    });
    const res = await fetch(req.endpoint, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${API_KEY}`,
        'Content-Type': 'application/json',
        ...(req.headers || {})
      },
      body: JSON.stringify(req.body),
      signal
    });
    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status}: ${errText.slice(0, 300)}`);
    }
    return res;
  }

  /* Real SSE processing for streaming models (Gemini) */
  async function processSSE(response, config, onThinking, onContent, signal) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      if (signal && signal.aborted) {
        try { reader.cancel(); } catch (e) {}
        throw new DOMException('Aborted', 'AbortError');
      }
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('event:')) continue;
        if (!trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim();
        if (payload === '[DONE]') return;
        let json;
        try { json = JSON.parse(payload); } catch (e) { continue; }
        const result = config.parseStreamEvent(json);
        if (!result) continue;
        if (result.thinking) onThinking(result.thinking);
        if (result.content) onContent(result.content);
      }
    }
  }

  /* Progressive reveal for non-streaming endpoints — looks like streaming,
     keeps live thinking + answer for every model. */
  function revealDuration(len, min, max, factor) {
    return Math.min(max, Math.max(min, len * factor));
  }

  function animateText(fullText, onChunk, { duration = 1500, signal } = {}) {
    if (!fullText) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const start = performance.now();
      let revealed = 0;
      function step(now) {
        if (signal && signal.aborted) return reject(new DOMException('Aborted', 'AbortError'));
        const t = Math.min(1, (now - start) / duration);
        const target = Math.floor(fullText.length * t);
        if (target > revealed) {
          onChunk(fullText.slice(revealed, target));
          revealed = target;
        }
        if (t < 1) requestAnimationFrame(step);
        else {
          if (revealed < fullText.length) onChunk(fullText.slice(revealed));
          resolve();
        }
      }
      requestAnimationFrame(step);
    });
  }

  /* ============================================================
     GENERATE RESPONSE
     ============================================================ */
  async function generateResponse() {
    if (state.isGenerating) {
      if (state.abortController) state.abortController.abort();
      return;
    }

    const text = chatInput.value.trim();
    if (!text && state.attachments.length === 0) return;

    const config = MODELS[state.model];
    if (!config) return;

    state.isGenerating = true;
    chatInput.value = '';
    chatInput.style.height = 'auto';
    sendIcon.style.display = 'none';
    stopIcon.style.display = 'block';
    sendBtn.classList.add('stop-mode');
    sendBtn.disabled = false;
    updateSendBtn();

    addUserMessage(text, state.attachments);
    state.messages.push({ role: 'user', content: text });

    const currentAttachments = [...state.attachments];
    state.attachments = [];
    renderAttachments();

    const { bubble, avatar, contentDiv } = createAssistantRow();
    const streamState = { renderedParts: [] };

    let rawText = '';
    let rawThinking = '';
    let hasThinking = false;
    let hasContent = false;
    let thinkingPanel = null;
    let thinkingBody = null;
    let renderTimer = null;
    let pendingThinking = false;
    let waitingTimer = null;
    const requestStart = performance.now();

    const waitingTextEl = bubble.querySelector('.waiting-indicator span');
    waitingTimer = setTimeout(() => {
      if (waitingTextEl && waitingTextEl.isConnected) waitingTextEl.textContent = 'Thinking…';
    }, 900);

    function removeWaiting() {
      clearTimeout(waitingTimer);
      const w = bubble.querySelector('.waiting-indicator');
      if (w) w.remove();
    }

    function ensureThinkingPanel() {
      if (thinkingPanel) return;
      removeWaiting();
      thinkingPanel = createThinkingPanel();
      thinkingBody = thinkingPanel.querySelector('.thinking-body');
      bubble.insertBefore(thinkingPanel, contentDiv);
    }

    function scheduleContentRender() {
      if (renderTimer) return;
      renderTimer = setTimeout(() => {
        renderTimer = null;
        updateStreamingContent(contentDiv, rawText, streamState);
        ensureCursor(contentDiv);
        scrollToBottom();
      }, 30);
    }

    function finalizeThinking(forceCollapse = true) {
      if (!thinkingPanel || thinkingPanel.dataset.finalized) return;
      thinkingPanel.dataset.finalized = 'true';
      thinkingPanel.classList.add('done');
      const userWantsExpanded = thinkingPanel.dataset.userExpanded === 'true';
      if (forceCollapse && !userWantsExpanded) thinkingPanel.classList.remove('expanded');

      const label = thinkingPanel.querySelector('.thinking-label');
      if (label) {
        const elapsed = ((performance.now() - requestStart) / 1000).toFixed(1);
        label.innerHTML = `<svg class="thought-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><path d="M20 6L9 17l-5-5"/></svg><span class="thinking-text">Thought for ${elapsed}s</span>`;
      }
      avatar.classList.remove('thinking');
    }

    function onThinking(chunk) {
      if (!chunk) return;
      rawThinking += chunk;
      if (!hasThinking) {
        hasThinking = true;
        ensureThinkingPanel();
        avatar.classList.add('thinking');
      }
      if (pendingThinking) return;
      pendingThinking = true;
      requestAnimationFrame(() => {
        pendingThinking = false;
        if (thinkingBody) {
          thinkingBody.textContent = rawThinking;
          const wrapper = thinkingBody.parentElement;
          if (wrapper && thinkingPanel && thinkingPanel.classList.contains('expanded')) {
            const nearBottom = wrapper.scrollHeight - wrapper.scrollTop - wrapper.clientHeight < 40;
            if (nearBottom) wrapper.scrollTop = wrapper.scrollHeight;
          }
        }
        scrollToBottom();
      });
    }

    function onContent(chunk) {
      if (!chunk) return;
      rawText += chunk;
      if (!hasContent) {
        hasContent = true;
        removeWaiting();
        if (hasThinking) finalizeThinking();
      }
      scheduleContentRender();
    }

    state.abortController = new AbortController();
    const signal = state.abortController.signal;

    try {
      if (config.streaming) {
        const res = await sendRequest(config, currentAttachments, state.messages, signal);
        await processSSE(res, config, onThinking, onContent, signal);
      } else {
        let reqMessages = state.messages.map(m => ({ ...m }));
        let accumulated = '';

        for (let attempt = 0; attempt < 3; attempt++) {
          if (signal.aborted) break;
          const res = await sendRequest(config, attempt === 0 ? currentAttachments : [], reqMessages, signal);
          const json = await res.json();
          const { text: t, thinking: th, truncated } = config.parseResponse(json);

          if (th) {
            await animateText(th, onThinking, {
              duration: revealDuration(th.length, 600, 2600, 2),
              signal
            });
          }
          if (t) {
            await animateText(t, onContent, {
              duration: revealDuration(t.length, 800, 4500, 1.4),
              signal
            });
          }

          accumulated += t;
          if (!truncated) break;
          reqMessages = [
            ...reqMessages,
            { role: 'assistant', content: accumulated },
            { role: 'user', content: CONTINUE_PROMPT }
          ];
        }
      }
    } catch (err) {
      if (err.name === 'AbortError') {
        rawText = rawText ? rawText + '\n\n*[Generation stopped]*' : '*[Generation stopped]*';
      } else {
        console.error(err);
        const errMsg = `⚠️ **Error:** ${err.message}`;
        rawText = rawText ? rawText + '\n\n' + errMsg : errMsg;
      }
      hasContent = true;
      removeWaiting();
      scheduleContentRender();
    } finally {
      clearTimeout(waitingTimer);
      if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
      removeCursor(contentDiv);
      finalizeContent(contentDiv, rawText, streamState);
      if (hasThinking) finalizeThinking();
      avatar.classList.remove('thinking');
      addMessageActions(bubble, rawText);

      if (rawText.trim()) state.messages.push({ role: 'assistant', content: rawText });

      state.isGenerating = false;
      state.abortController = null;
      sendIcon.style.display = 'block';
      stopIcon.style.display = 'none';
      sendBtn.classList.remove('stop-mode');
      updateSendBtn();
      chatInput.focus();
      scrollToBottom(true);
      updateScrollBtn();
    }
  }

  /* ============================================================
     EVENTS & INIT
     ============================================================ */
  sendBtn.addEventListener('click', generateResponse);

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (!state.isGenerating) generateResponse();
    }
  });

  chatInput.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 200) + 'px';
    updateSendBtn();
  });

  /* Boot */
  buildModelDropdown();
  syncModelButton();
  setMode('coding');
  chatInput.focus();
  updateSendBtn();
</script>
</body>
</html>
